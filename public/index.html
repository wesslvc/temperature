<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion Room — 온습도</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="온습도">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ==========================================================================
   Orion Room — playcounters와 같은 디자인 언어
   글꼴은 Pretendard 하나. 숫자·제목은 크고 굵고 촘촘하게, 나머지는 작고 조용하게.
   화면 틀은 무채색(먹색 글씨, 종이색 배경, 헤어라인). 색은 데이터(온도·습도·이슬점·계절)에만 쓴다.
   ========================================================================== */
:root{
  --bg:#F6F6F4; --panel:#FFFFFF; --sunk:#EDEDEA; --sunk-2:#E4E4E0;
  --ink:#0C0C0D; --sub:#5B5B61; --faint:#8F8F96;
  --rule:rgba(12,12,13,.10); --hair:rgba(12,12,13,.06);
  --shadow:0 1px 2px rgba(12,12,13,.04), 0 10px 30px -14px rgba(12,12,13,.18);
  --top-bg:rgba(246,246,244,.82);
  --t:#c2410c; --h:#1e6a8c; --ok:#1E9E62;
  --hot:#c43a3a; --cold:#3c78b0; --wet:#2f8f74; --dry:#b9772f;
  --d:#7b5ea7; --d-soft:rgba(123,94,167,.13);
  --t-soft:rgba(194,65,12,.13); --h-soft:rgba(30,106,140,.13); --comfort:rgba(77,124,58,.12); --sw:#3b78c4; --sm:#4d7c3a; --ss:#d9822b; --sun:#d39b12;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090A; --panel:#141416; --sunk:#1E1E21; --sunk-2:#2A2A2E;
  --ink:#F3F3F4; --sub:#A4A4AB; --faint:#6F6F77;
  --rule:rgba(255,255,255,.10); --hair:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
  --top-bg:rgba(11,11,12,.78);
  --t:#f08a52; --h:#6cb4d6; --ok:#3DD68C;
  --hot:#f0805f; --cold:#7db3d3; --wet:#82c4ad; --dry:#e0b36a;
  --d:#b9a1e6; --d-soft:rgba(185,161,230,.16);
  --t-soft:rgba(240,138,82,.16); --h-soft:rgba(108,180,214,.16); --comfort:rgba(152,194,124,.1); --sw:#7db3d3; --sm:#98c27c; --ss:#f0a65a; --sun:#f2c552;
}}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.005em;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:var(--ink);color:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 56px}
.mono{font-variant-numeric:tabular-nums}
.k{font-size:12.5px;font-weight:500;color:var(--sub)}

/* ---------- header: 고정 + 블러 ---------- */
header{position:sticky;top:0;z-index:20;margin:0 -20px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;height:56px;
  background:var(--top-bg);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid var(--hair)}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:16.5px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.brand img{width:22px;height:22px;border-radius:6px}
.brand span{color:var(--faint);font-weight:500;font-size:13.5px;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:4px;min-width:0}
.fresh{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.fresh.live i{background:var(--ok)}
.fresh.stale i{background:#d99a2b}
.rbtn{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sunk);white-space:nowrap;transition:background .15s}
.rbtn:hover:not(:disabled){background:var(--sunk-2)}
.rbtn:disabled{color:var(--faint)}

/* ---------- 기간 선택: 세그먼트 + 칩 ---------- */
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:16px 0 0}
.pickL{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.tabs{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--sunk);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;height:30px;padding:0 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--sub);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--hair)}
@media (prefers-color-scheme:dark){.tabs button.on{background:var(--sunk-2)}}
.step{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-variant-numeric:tabular-nums}
.step button{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);font-size:16px;line-height:1;transition:border-color .15s}
.step button:hover:not(:disabled){border-color:var(--faint)}
.step button:disabled{color:var(--faint);background:transparent;border-color:var(--hair);cursor:default}
.step span{min-width:9em;text-align:center;font-weight:650;letter-spacing:-.015em}
.pick2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 0 0}
.pick2 .k{margin-right:4px}
.pick2[hidden]{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--faint)}
.pill select{border:0;background:none;font:inherit;color:inherit;outline:none;cursor:pointer;max-width:9.5em;color-scheme:light dark}
.pill.on{border-color:var(--ink)}
button.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pill.dis{opacity:.4;pointer-events:none}
#pToggle{color:var(--sub)}

/* ---------- 현재 / 구간 통계 ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;padding-top:26px;align-items:start}
.now{padding:8px 0 0;min-width:0}
.pair{display:flex;gap:48px;flex-wrap:wrap}
.num{font-size:clamp(64px,9vw,96px);font-weight:800;letter-spacing:-.055em;line-height:.95;display:flex;align-items:flex-start}
.num small{font-size:24px;font-weight:600;letter-spacing:0;color:var(--faint);margin:8px 0 0 4px}
.num.t{color:var(--t)} .num.h{color:var(--h)}
.sw{display:block;height:4px;border-radius:3px;margin-top:12px}
.lbl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--sub)}
.lbl b{color:var(--ink);font-weight:700;font-size:14px}
.delta{font-variant-numeric:tabular-nums}
.verdict{margin-top:22px;font-size:16px;font-weight:600;letter-spacing:-.02em;max-width:34em;word-break:keep-all}
.c-hot{color:var(--hot)}.c-cold{color:var(--cold)}.c-wet{color:var(--wet)}.c-dry{color:var(--dry)}
.chips{display:inline-grid;grid-template-columns:repeat(2,minmax(74px,auto));gap:5px}
.chip2{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;line-height:1.2;border-radius:8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;background:color-mix(in srgb,currentColor 11%,transparent)}
.chip2 svg{width:13px;height:13px;flex:none;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip2.z{color:var(--faint);font-weight:500;background:var(--sunk)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-left:10px;vertical-align:-2px}.lg svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:6px}.lg svg:first-child{margin-left:0}

/* 최저·최고·평균 표: 헤어라인으로만 구획 */
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);margin-top:8px;border-top:1px solid var(--rule)}
.mx>div{padding:12px 14px 12px 0;min-width:0;border-bottom:1px solid var(--hair)}
.mx .mh{font-size:12px;font-weight:500;color:var(--faint);padding:10px 14px 8px 0}
.mx .ml{display:flex;flex-direction:column;justify-content:center;font-size:13.5px;font-weight:650;padding-right:18px;white-space:nowrap}
.mx .ml small{font-weight:400;color:var(--sub);font-size:11px}
.mx .mc b{display:block;font-size:27px;font-weight:750;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;border-bottom:2px solid;padding-bottom:5px}
.mx .mc b em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--faint);margin-left:2px;letter-spacing:0}
.mx .mc small{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.mx .mc .dl{font-size:12px;font-weight:650;margin-top:2px}
.mxh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.cmpbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:14px 0 12px;font-size:12.5px;color:var(--sub)}
.cmpbar button{height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);font-size:12.5px;font-weight:500;color:var(--sub)}
.cmpbar button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

/* ---------- 카드 ---------- */
.scatter,.panel.on{background:var(--panel);border:1px solid var(--hair);border-radius:18px}
.scatter{padding:18px 18px 16px;min-width:0}
.scatter h3{font-size:18px;font-weight:750;letter-spacing:-.03em}
.scatter p,.sec p.cap,p.cap{font-size:12.5px;color:var(--sub);margin:3px 0 12px}
.sg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}.sg i{width:10px;height:10px;border-radius:3px;display:inline-block}.sg i.hx{background:repeating-linear-gradient(45deg,transparent 0 2px,color-mix(in srgb,var(--ink) 25%,transparent) 2px 3px);border:1px solid var(--rule)}
#scCap{display:flex;flex-wrap:wrap;gap:4px 0;line-height:1.4}

/* 진입률: 큰 숫자 + 세로 헤어라인 */
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.rates:empty{display:none}
.rate{min-width:0;padding:0 14px;border-left:1px solid var(--rule)}
.rate:first-child{padding-left:0;border-left:none}
.rate b{display:block;font-size:24px;font-weight:750;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.rate .bar2{height:3px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.rate .bar2 i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.rate small{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.rate .k{font-size:12px}

/* ---------- 섹션 탭 (밑줄) ---------- */
.secnav{display:flex;gap:24px;margin-top:44px;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{position:relative;padding:4px 0 13px;font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--faint);white-space:nowrap;transition:color .15s}
.secnav button:hover{color:var(--sub)}
.secnav button.on{color:var(--ink)}
.secnav button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.panel{display:none}
.panel.on{display:block;margin-top:16px;padding:18px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 14px;flex-wrap:wrap;margin-bottom:8px}
.sec-h h3,.three h3{font-size:16px;font-weight:750;letter-spacing:-.02em}
.hh{font-size:15px;font-weight:750;letter-spacing:-.02em;margin:16px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:8px;opacity:.5}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:14px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--sunk)}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--hair)}
@media (prefers-color-scheme:dark){.seg button.on{background:var(--sunk-2)}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--faint);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.gl{stroke:var(--hair);stroke-width:1}
.spec{position:relative;margin:16px 0 0 auto;max-width:440px;padding:0 14px}
.specbar{height:8px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair)}
.spect{position:relative;height:18px;margin-top:5px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.spect span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.spect span:first-child{transform:none}.spect span:last-child{transform:translateX(-100%)}
.specu{position:absolute;right:0;top:-2px;font-size:11px;color:var(--faint)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}

/* 하단 지표: 큰 숫자 + 세로 헤어라인 */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:22px 0 0;padding-top:16px;border-top:1px solid var(--hair)}
.strip>div{min-width:0;padding:0 14px;border-left:1px solid var(--rule)}
.strip>div:first-child{padding-left:0;border-left:none}
.strip b{display:block;font-size:24px;font-weight:750;letter-spacing:-.04em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .k{font-size:12px}

/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tb th{font-weight:500;font-size:12px;color:var(--faint);text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule)}
table.tb td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--hair)}
table.tb th:first-child,table.tb td:first-child{text-align:left;padding-left:0}
table.tb td.ex{font-weight:700}
table.tb td.t{color:var(--t)} table.tb td.h{color:var(--h)}
.tbw{overflow-x:auto}
.chip{display:inline-block;min-width:3.6em;text-align:center;padding:2px 8px;border-radius:7px;font-weight:600}
.chip.ex{font-weight:800;box-shadow:inset 0 0 0 1.5px currentColor}
.tb tr.go{cursor:pointer} .tb tr.go:hover td{background:var(--sunk)}

/* 점 클릭 카드 */
.detail{margin-top:16px;padding:16px;border-radius:16px;background:var(--sunk)}
.detail .dh{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.detail .dh b{color:var(--ink);font-size:15px}
.detail .dh button{height:30px;padding:0 12px;border-radius:9px;background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink)}
.detail .pair3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px}
.detail .pc{min-width:0}.detail .num{font-size:56px}.detail .lbl{display:flex;flex-direction:column;gap:2px;align-items:flex-start;margin-top:10px}.detail .delta{font-size:13px;font-weight:650}
.detail .verdict{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.tile{padding:14px 16px 12px 0;border-bottom:1px solid var(--hair);min-width:0}
.tile .v{font-size:34px;font-weight:750;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .v em{font-style:normal;font-size:14px;font-weight:500;color:var(--faint);margin-left:2px;letter-spacing:0}
.tile.t .v{color:var(--t)} .tile.h .v{color:var(--h)}
.tile small{display:block;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tile .dl{margin-top:8px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .dl i{font-style:normal;font-weight:400;color:var(--faint);margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;padding-top:18px;border-top:1px solid var(--hair)}
.facts div b{display:block;font-size:20px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.facts div b em{font-style:normal;font-size:13px;color:var(--faint);font-weight:400;margin-left:2px}
.facts small{display:block;font-size:12px;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}

#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.5;opacity:0;z-index:30;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.empty{padding:48px 12px;text-align:center;color:var(--sub);font-size:14px}
footer{margin-top:48px;font-size:12px;color:var(--faint);text-align:center;line-height:1.8}



/* ---------- 한 칸 흐름 레이아웃 ---------- */
.mt{display:flex;flex-direction:column}.mt .gauge{margin-top:auto}
.wrap{max-width:1000px}
.hero{display:block;padding-top:22px}
.now{padding:0}
.scatter{margin-top:30px;padding:20px 20px 18px}
.scatter h3{font-size:17px}
.hero .tiles2{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt-dew .mt-v{font-size:clamp(40px,5.2vw,60px)}
.mt-dew .g-band{display:none}
#scCap{gap:4px 0;margin:6px 0 14px}
.sg.crit{color:var(--faint);margin-left:auto;margin-right:0}
.area{pointer-events:none}
.verdict{margin-top:20px}
.subh{margin-top:34px}
@media(max-width:720px){
  .hero .tiles2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mt-dew{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h h" "v g";column-gap:18px;align-items:end}
  .mt-dew .mt-h{grid-area:h}.mt-dew .mt-v{grid-area:v;margin:6px 0 0;font-size:40px}
  .mt-dew .gauge,.mt-dew .g-t{grid-column:2}

/* ========== 다시 다듬은 현재 화면 ========== */
.hero2{position:relative;isolation:isolate;overflow:hidden;padding:22px 24px 22px;border-radius:26px;background:var(--panel);border:1px solid var(--hair)}
.hero2::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 120% at 0% 0%,color-mix(in srgb,var(--ct) 22%,transparent),transparent 70%),radial-gradient(70% 120% at 100% 0%,color-mix(in srgb,var(--ch) 20%,transparent),transparent 70%)}

.h2-main{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:0 28px;margin-top:18px}

.g2{position:relative;height:14px;margin-top:18px}
.g2-t{position:absolute;left:0;right:0;top:6px;height:2px;border-radius:1px;opacity:.28}
.g2-z{position:absolute;top:5px;height:4px;border-radius:2px;background-repeat:no-repeat}
.g2-m{position:absolute;top:0;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 3px var(--panel)}

.scs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.sc{min-width:0;padding:16px 16px 0;border-radius:20px;background:var(--panel);border:1px solid var(--hair);overflow:hidden;display:flex;flex-direction:column}

.sc-r b{color:var(--sub);font-weight:650}
.sc-r em{font-style:normal}
.sp{display:block;width:calc(100% + 32px);height:48px;margin:12px -16px 0}

@media(max-width:720px){

}
.cs-p{fill:var(--ink)!important;font-size:15px!important;font-weight:750;letter-spacing:-.02em}
.cs-pd{fill:var(--faint)!important;font-size:10.5px!important;font-weight:600}
#rates{display:none!important}

.subh{font-size:15px;font-weight:750;letter-spacing:-.02em;margin:30px 0 2px}
.plab text{fill:var(--ink);font-size:12.5px;font-weight:650;letter-spacing:-.01em}

/* ---------- 현재 온습도 카드 (다크 기준) ---------- */
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt{position:relative;isolation:isolate;overflow:hidden;min-width:0;padding:18px 18px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--hair)}
.mt::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent) 0%,color-mix(in srgb,var(--c) 8%,transparent) 45%,transparent 75%)}

/* ---------- 최저 · 평균 · 최고 + 범위 막대 ---------- */
.rrs{margin-top:10px}
.rr{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));grid-template-areas:"l a b c" ". t t t";align-items:start;gap:0 12px;padding:16px 0 14px;border-bottom:1px solid var(--hair)}

/* ==========================================================================
   타이포그래피 중심: 크고 시원한 숫자(좁은 폭 그로테스크), 상자 대신 헤어라인, 무채색
   ========================================================================== */
:root{--disp:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif}
.en{display:block;font-style:normal;font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.hm-v,.sc-v,.rt,.dl-av{font-family:var(--disp)}
svg text.cs-p{font-family:var(--disp)}
/* 현재 */
.hero2{padding:14px 0 34px;border-radius:0;background:none;border:none;border-bottom:1px solid var(--rule);overflow:visible}

.h2-main{margin-top:26px;gap:0 40px}
.h2-sep{background:var(--rule)}

.hm-v small{font-size:.22em;font-weight:600;color:var(--faint);margin:.35em 0 0 .12em;letter-spacing:0}
.hm-s{margin-top:16px;font-size:15px}
/* 지표 카드 → 상자 없이 헤어라인 열 */
.subh{font-family:var(--disp);font-size:13px!important;font-weight:650;letter-spacing:0;text-transform:uppercase;color:var(--faint);margin:34px 0 0!important}
.scs{gap:0 32px;margin-top:14px}
.sc{padding:16px 0 0;border-radius:0;background:none;border:none;border-top:1px solid var(--rule);overflow:visible}
.sc-h{font-size:14px;color:var(--sub)}
.sc-v{font-size:clamp(40px,4.4vw,52px);font-weight:750;letter-spacing:-.05em;line-height:1;margin-top:10px}
.sc-v small{font-size:16px!important;color:var(--faint)}
.sc-r{margin-top:14px}
.sc .sp{margin:10px 0 0!important;width:100%!important;display:block}
/* 쾌적 시간 */
.scatter{background:none!important;border:none!important;border-radius:0!important;padding:0!important;margin-top:46px!important}
.scatter h3{font-size:24px!important;font-weight:750;letter-spacing:-.035em;line-height:1.1}
#scCap{margin:10px 0 6px!important}
svg text.cs-p{fill:var(--ink)!important;font-size:22px!important;font-weight:750;letter-spacing:-.03em}
svg text.cs-p tspan.cs-u{font-size:13px;font-weight:600;fill:var(--faint)}
svg text.cs-pd{fill:var(--faint)!important;font-size:12px!important;font-weight:600}

/* 쾌적 시간: 시계 + 달력 */
.ccs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 28px;margin-top:14px;max-width:760px}
.cc{width:100%;height:auto;display:block}
svg text.cc-p{fill:var(--ink)!important;font-size:30px!important;font-weight:750;letter-spacing:-.04em}
svg text.cc-p tspan.cc-u{font-size:14px;font-weight:600;fill:var(--faint)}
svg text.cc-n{fill:var(--sub)!important;font-size:12.5px!important;font-weight:650}

<script>
const $ = (s) => document.querySelector(s);
const KST = 9*3600e3, WD = ['일','월','화','수','목','금','토'];
const kstDate = (ms) => new Date(ms+KST).toISOString().slice(0,10);
const addDays = (d, n) => { const x = new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo-1+n, 1)).toISOString().slice(0,7); };
const mondayOf = (d) => addDays(d, -((new Date(d+'T00:00:00Z').getUTCDay()+6)%7));
const wd = (d) => WD[new Date(d+'T00:00:00Z').getUTCDay()];
const md2 = (d) => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
const kstMs = (d) => Date.parse(d + 'T00:00:00+09:00');
const periodBounds = (r) => { const v = r.slice(2);
  if(r[0]==='k'){ const [mm, k] = v.split(':'); return [kstMs(kStart(mm,+k)), kstMs(kEnd(mm,+k))]; }
  return r[0]==='d' ? [kstMs(v), kstMs(addDays(v,1))] : r[0]==='w' ? [kstMs(v), kstMs(addDays(v,7))] : r[0]==='m' ? [kstMs(v+'-01'), kstMs(addMonths(v,1)+'-01')] : [kstMs(v+'-01-01'), kstMs((+v+1)+'-01-01')]; };
// 비교 대상 구간. 아직 끝나지 않은 기간(오늘·이번 주 등)은 지난 기간의 같은 경과 시간만큼만 비교한다.
const compareSpecs = (r) => {
  if(!/^[dwmyk]:/.test(r)) return [];
  const [s, e] = periodBounds(r), el = Math.min(Date.now(), e) - s; if(el <= 0) return [];
  const mk = (shifted, label) => { const [ps, pe] = periodBounds(shifted), to = Math.min(pe, ps + el); return {label, range: `r:${ps}:${to}`, from: ps, to}; };
  return r[0]==='d' ? [mk(shiftRange(r,-1),'전날 같은 시간대'), mk('d:'+addDays(r.slice(2),-7),'지난주 같은 요일')]
       : r[0]==='k' ? [mk(shiftRange(r,-1),'이전 주 같은 기간')] : r[0]==='w' ? [mk(shiftRange(r,-1),'지난주 같은 기간')] : r[0]==='m' ? [mk(shiftRange(r,-1),'지난달 같은 기간')] : [mk(shiftRange(r,-1),'작년 같은 기간')];
};
let cmpIdx = 0, heatBy = '', unit = '', tblMetric = 'temp', panel = (() => { try { return localStorage.panel || 'trend'; } catch { return 'trend'; } })(), cache = null, selTs = null, lastStats = null, lastTrend = null, dataFirst = null, dataLast = null;
const wkOfDay = (d) => Math.min(4, Math.floor((+d.slice(8,10)-1)/7)+1);
const kStart = (m, n) => `${m}-${String(1+7*(n-1)).padStart(2,'0')}`;
const kEnd = (m, n) => n === 4 ? addMonths(m,1)+'-01' : addDays(kStart(m,n), 7);
const kSpan = (n) => n === 4 ? '22~말일' : `${(n-1)*7+1}~${n*7}`;
const TABS = [['24h','현재'],['today','오늘'],['yest','어제'],['week','이번 주'],['month','이번 달'],['year','올해'],['all','전체']];
const tabRange = (k) => { const t = kstDate(Date.now()); return k==='24h' ? '24h' : k==='today' ? 'd:'+t : k==='yest' ? 'd:'+addDays(t,-1) : k==='week' ? `k:${t.slice(0,7)}:${wkOfDay(t)}` : k==='month' ? 'm:'+t.slice(0,7) : k==='year' ? 'y:'+t.slice(0,4) : 'all'; };
const rangeLabel = (r) => { const v = r.slice(2), thisYear = kstDate(Date.now()).slice(0,4);
  if (r === '24h') return '최근 24시간'; if (r === 'all') return '전체 기간'; if (r === '1h') return '최근 1시간'; if (r === '7d') return '최근 7일'; if (r === '30d') return '최근 30일';
  if (r[0]==='d') return `${v.slice(0,4)===thisYear ? '' : v.slice(0,4)+'년 '}${+v.slice(5,7)}월 ${+v.slice(8,10)}일 (${wd(v)})`;
  if (r[0]==='w') return `${md2(v)} – ${md2(addDays(v,6))} 주`;
  if (r[0]==='k') { const [mm, n] = v.split(':'); return `${mm.slice(0,4)===thisYear ? '' : mm.slice(0,4)+'년 '}${+mm.slice(5)}월 ${n}주 (${kSpan(+n)}일)`; }
  if (r[0]==='m') return `${v.slice(0,4)}년 ${+v.slice(5,7)}월`;
  return `${v}년`; };
const shiftRange = (r, n) => r[0]==='k' ? (() => { const [mm, k] = r.slice(2).split(':'); let i = +k + n, m = mm; while(i > 4){ i -= 4; m = addMonths(m, 1); } while(i < 1){ i += 4; m = addMonths(m, -1); } return `k:${m}:${i}`; })() : r[0]==='d' ? 'd:'+addDays(r.slice(2), n) : r[0]==='w' ? 'w:'+addDays(r.slice(2), 7*n) : r[0]==='m' ? 'm:'+addMonths(r.slice(2), n) : r[0]==='y' ? 'y:'+(+r.slice(2)+n) : r;
const startOfRange = (r) => r[0]==='k' ? (() => { const [mm, k] = r.slice(2).split(':'); return kStart(mm, +k); })() : r[0]==='m' ? r.slice(2)+'-01' : r[0]==='y' ? r.slice(2)+'-01-01' : r.slice(2);
const canStep = (r) => /^[dwmyk]:/.test(r);
const isFutureStart = (r) => startOfRange(r) > kstDate(Date.now());
let range = (()=>{try{const r = localStorage.range; return /^(24h|all|[dw]:\d{4}-\d{2}-\d{2}|m:\d{4}-\d{2}|k:\d{4}-\d{2}:[1-4]|y:\d{4})$/.test(r) ? r : null}catch{return null}})() || '24h', heatData = [];
const n1 = (v) => v == null ? '–' : v.toFixed(1);
const n0 = (v) => v == null ? '–' : Math.round(v);
const hhmm = (ts) => new Date(ts).toLocaleTimeString('ko',{hour:'2-digit',minute:'2-digit',hour12:false});
const md = (ts) => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
const mdLong = (ts) => { const d = new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
const when = (ts) => ts ? `${md(ts)} ${hhmm(ts)}` : '';
const tip = $('#tip');
// 손가락으로 볼 때는 손에 가리지 않게 위쪽에 띄운다
const showTip = (e, h) => { const touch = e.pointerType === 'touch' || matchMedia('(hover: none)').matches; tip.innerHTML = h; tip.style.opacity = 1; const w = tip.offsetWidth, hh = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(e.clientX + (touch ? -w / 2 : 14), innerWidth - w - 8)) + 'px'; tip.style.top = (touch ? Math.max(8, e.clientY - hh - 28) : e.clientY + 16) + 'px'; };
const hideTip = () => tip.style.opacity = 0;
const get = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

const fmtGap = (min) => min < 60 ? `${Math.max(1,Math.round(min))}분` : min < 1440 ? `${Math.floor(min/60)}시간${Math.round(min%60) ? ' ' + Math.round(min%60) + '분' : ''}` : `${(min/1440).toFixed(1)}일`;
const dew = (t, h) => { const g = Math.log(Math.max(h,1)/100) + 17.62*t/(243.12+t); return 243.12*g/(17.62-g); };
// 온도·습도를 단계별 표현으로 (쾌적 범위 안에서도 '살짝 따뜻한 편', '매우 적절' 등으로 구분)
// 가변최적기온제도 (한국 시간 기준 월): 12~2월 23–25°C·습도 40% 이상 / 3~5·9~11월 26–28°C·40–55% / 6~8월 27–29°C·50% 이하
function comfortAt(ts){
  const m = new Date((ts || Date.now()) + 9*36e5).getUTCMonth() + 1;
  if(m === 12 || m <= 2) return { m, key:'w', season:'겨울', t:[23,25], h:[40,100], hTxt:'40% 이상' };
  if(m >= 6 && m <= 8)   return { m, key:'s', season:'여름', t:[27,29], h:[0,50],   hTxt:'50% 이하' };
  return { m, key:'m', season: m <= 5 ? '봄' : '가을', t:[26,28], h:[40,55], hTxt:'40–55%' };
}
const comfortTxt = (c) => `${c.t[0]}–${c.t[1]}°C · ${c.hTxt}`;
const inComfort = (c, t, h) => ({ t: t >= c.t[0] && t <= c.t[1], h: h >= c.h[0] && h <= c.h[1] });
let CTX = comfortAt(Date.now()), MULTI = false, SEASONS = ['m'];
const SEASON_BOX = { w:{ name:'겨울 12~2월', t:[23,25], h:[40,100] }, m:{ name:'봄·가을 3~5·9~11월', t:[26,28], h:[40,55] }, s:{ name:'여름 6~8월', t:[27,29], h:[0,50] } };
// 조회 구간에 걸친 계절 (올해·전체는 사계절 모두)
function seasonsFor(rangeKey, pts, cur){
  if(rangeKey === 'all' || rangeKey[0] === 'y') return ['w','m','s'];
  const a = pts.length ? pts[0].ts : (cur ? cur.ts : Date.now()), b = pts.length ? pts.at(-1).ts : a, out = new Set();
  const d0 = new Date(a + 9*36e5), d1 = new Date(b + 9*36e5);
  for(let y = d0.getUTCFullYear(), mo = d0.getUTCMonth(); y < d1.getUTCFullYear() || (y === d1.getUTCFullYear() && mo <= d1.getUTCMonth()); mo++){ if(mo > 11){ mo = 0; y++; if(y > d1.getUTCFullYear()) break; } out.add(comfortAt(Date.UTC(y, mo, 15)).key); }
  return ['w','m','s'].filter(k => out.has(k));
}
// 쾌적 범위를 기준으로 상대적인 단계 표현 (범위 안에서도 '살짝 따뜻한 편', '매우 적절' 등으로 구분)
function tempWord(t, c = CTX){
  const [lo, hi] = c.t, w = hi - lo;
  const S = [[lo-4.5,'매우 춥고','매우 춥습니다','매우 추움'],[lo-2,'춥고','춥습니다','추움'],[lo,'조금 춥고','조금 춥습니다','조금 추움'],[lo+.2*w,'살짝 춥고','살짝 춥습니다','살짝 추움'],
    [hi-.27*w,'매우 적절하고','매우 적절합니다','매우 적절'],[hi+1e-9,'살짝 따뜻한 편이고','살짝 따뜻한 편입니다','살짝 따뜻한 편'],[hi+2,'따뜻하고','따뜻합니다','따뜻함'],[hi+4,'덥고','덥습니다','더움'],[Infinity,'매우 덥고','매우 덥습니다','매우 더움']];
  return S.find(x => t < x[0]);
}
function humWord(h, c = CTX){
  const [lo, hi] = c.h;
  const S = [[lo-10,'매우 건조하고','매우 건조합니다','매우 건조'],[lo,'건조하고','건조합니다','건조'],[lo+3,'살짝 건조한 편이고','살짝 건조한 편입니다','살짝 건조한 편'],
    [hi-3,'매우 적절하고','매우 적절합니다','매우 적절'],[hi+1e-9,'살짝 습한 편이고','살짝 습한 편입니다','살짝 습한 편'],[hi+10,'습하고','습합니다','습함'],[Infinity,'매우 습하고','매우 습합니다','매우 습함']];
  return S.find(x => h < x[0]);
}
function feel(t, h, c = CTX){ return `온도는 ${tempWord(t, c)[1]} 습도는 ${humWord(h, c)[2]}.`; }

function niceScale(a, b){
  const span = Math.max(b - a, .5);
  const step = [0.5,1,2,5,10,20,50,100].find(x => span / x <= 5) || 100;
  let lo = Math.floor(a/step + 1e-9)*step, hi = Math.ceil(b/step - 1e-9)*step; if(hi - lo < step) hi = lo + step;
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  return { lo, hi, step, ticks };
}
const tickLabel = (v, step) => step < 1 ? v.toFixed(1) : String(Math.round(v));

/* ---------- 매끄러운 곡선: 단조 3차 보간(Fritsch–Carlson). 1차 미분이 연속이고 overshoot 없음 ---------- */
function smooth(pts, move = true){
  const n = pts.length; if(n === 0) return '';
  const f = v => v.toFixed(1);
  let d = (move ? 'M' : 'L') + f(pts[0][0]) + ',' + f(pts[0][1]);
  if(n === 1) return d;
  if(n === 2) return d + 'L' + f(pts[1][0]) + ',' + f(pts[1][1]);
  const h = [], sl = [];
  for(let i = 0; i < n-1; i++){ h[i] = pts[i+1][0]-pts[i][0]; sl[i] = h[i] ? (pts[i+1][1]-pts[i][1])/h[i] : 0; }
  const m = new Array(n);
  m[0] = sl[0]; m[n-1] = sl[n-2];
  for(let i = 1; i < n-1; i++) m[i] = sl[i-1]*sl[i] <= 0 ? 0 : 2/(1/sl[i-1] + 1/sl[i]);
  for(let i = 0; i < n-1; i++){
    if(sl[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    const a = m[i]/sl[i], b = m[i+1]/sl[i], r = a*a + b*b;
    if(r > 9){ const t = 3/Math.sqrt(r); m[i] = t*a*sl[i]; m[i+1] = t*b*sl[i]; }
  }
  for(let i = 0; i < n-1; i++){
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i+1][0], y1 = pts[i+1][1];
    d += `C${f(x0+h[i]/3)},${f(y0+m[i]*h[i]/3)} ${f(x1-h[i]/3)},${f(y1-m[i+1]*h[i]/3)} ${f(x1)},${f(y1)}`;
  }
  return d;
}

// 증감 색: 온도·습도 색 체계와 같은 계열 — 더워지면 적색, 추워지면 청색 / 습해지면(이슬점 포함) 민트, 건조해지면 황색
const chgCls = (kind, v, eps) => v == null || Math.abs(v) < eps ? '' : kind === 'temp' ? (v > 0 ? 'c-hot' : 'c-cold') : (v > 0 ? 'c-wet' : 'c-dry');
const chgTxt = (v, u, dec) => `${v > 0 ? '▲' : '▼'} ${Math.abs(v).toFixed(dec)}${u}`;

  const el = $('#detail'), p = d.prev, dp = dew(d.temp, d.hum), pdp = d.prev_d ? d.prev_d.dew : null, avgT = lastStats && lastStats.overall.temp;

  el.style.display = '';

    <div class="k" style="margin-top:2px">${p ? (lastChg ? `변화는 값이 달라지기 직전 측정(${when(lastChg)}, ${gap} 전) 대비` : '이전 측정과 같은 값입니다') : '기록상 첫 측정입니다'}</div>

    ${(() => { const S = cache && cache.out && cache.out.series; if(!S || !S.length || d.ts < S[0].ts - 36e5 || d.ts > S.at(-1).ts + 36e5) return '';

/* ---------- 값에 따른 색 그라데이션 (선·막대 공통) ---------- */
let GID = 0;
// y축 위치에 값의 색을 대응시킨 세로 그라데이션. yLo/yHi = lo/hi 값의 화면 y
function vGrad(metric, lo, hi, yLo, yHi, op = 1, fade = false){
  const id = 'vg' + (++GID), n = 10;
  const st = Array.from({length: n + 1}, (_, i) => { const v = lo + (hi - lo) * i / n; return `<stop offset="${(i / n * 100).toFixed(1)}%" stop-color="${specColor(metric, v)}" stop-opacity="${fade ? (op * Math.pow(i / n, 1.4)).toFixed(3) : op}"/>`; }).join('');
  return { id, def: `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="${yLo}" y2="${yHi}">${st}</linearGradient>` };
}
/* ---------- 쾌적 시간: 시간축 위에 값의 색 띠 + 쾌적 범위 안 구간 표시 ---------- */
function comfortStrip(el, pts, o, base){
  const P = pts.filter(p => p.temp != null && p.hum != null);
  if(P.length < 2){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = Math.max(300, el.clientWidth || 520), m = {l:44,r:W < 480 ? 96 : 150}, iw = W-m.l-m.r, t0 = P[0].ts, t1 = P.at(-1).ts, span = t1-t0 || 1;
  const X = ts => m.l + (ts-t0)/span*iw;
  const rows = [{k:'temp',name:'온도',y:14,rk:'comfort_t'},{k:'hum',name:'습도',y:62,rk:'comfort_h'},{k:'both',name:'둘 다',y:110,rk:'comfort'}], RH = 4, H = 110+RH+34;
  let g = '';
  rows.forEach((R, ri) => { g += `<clipPath id="cs${ri}"><rect x="${m.l}" y="${R.y}" width="${iw}" height="${RH}"/></clipPath><text class="cs-l" x="0" y="${R.y+RH/2+4}">${R.name}</text>`;
    if(o && o[R.rk] != null){ const d = base && base[R.rk] != null ? o[R.rk] - base[R.rk] : null; g += `<text class="cs-p" x="${W}" y="${R.y+RH/2+12}" text-anchor="end">${Math.round(o[R.rk])}<tspan class="cs-u">%</tspan></text>`;
      if(d != null && Math.abs(d) >= .5 && W >= 480) g += `<text class="cs-pd" x="${W-78}" y="${R.y+RH/2+5}" text-anchor="end">${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(0)}%p</text>`; } });
  // 상태별로 이어진 덩어리: 온도 = 낮음(청)·쾌적(초록)·높음(적), 습도 = 건조(황)·쾌적·습함(민트), 둘 다 = 쾌적만
  const COLS = { temp: { lo:'var(--cold)', hi:'var(--hot)' }, hum: { lo:'var(--dry)', hi:'var(--wet)' } };
  const state = (M, p) => { const c = comfortAt(p.ts), r = M === 'temp' ? c.t : c.h, v = p[M]; return v < r[0] ? 'lo' : v > r[1] ? 'hi' : 'ok'; };
  const runsOf = (fn) => { const out = []; let cur = null;
    P.forEach((p, i) => { const k = fn(p), x = X(p.ts);
      if(!cur || cur.k !== k){ if(cur) cur.x2 = x; cur = { k, x1: x, x2: x }; out.push(cur); } });
    if(cur) cur.x2 = m.l + iw; return out; };
  const fill = (M, k) => k === 'ok' ? 'var(--ink)' : 'transparent';
  const draw = (ri, M, runs) => runs.map((u, i) => { if(u.k === 'none') return ''; const g0 = 0, g1 = 0, w = Math.max(u.x2-u.x1-g0-g1, 2);
    return `<rect x="${(u.x1+g0).toFixed(1)}" y="${rows[ri].y}" width="${w.toFixed(1)}" height="${RH}" rx="1" fill="${fill(M, u.k)}" fill-opacity=".92"/>`; }).join('');
  rows.forEach((R, ri) => { g += `<rect x="${m.l}" y="${R.y+RH/2-.5}" width="${iw}" height="1" fill="var(--rule)"/>`; });
  g += `<g clip-path="url(#cs0)">${draw(0, 'temp', runsOf(p => state('temp', p)))}</g><g clip-path="url(#cs1)">${draw(1, 'hum', runsOf(p => state('hum', p)))}</g>`;
  g += `<g clip-path="url(#cs2)">${draw(2, 'temp', runsOf(p => state('temp', p) === 'ok' && state('hum', p) === 'ok' ? 'ok' : 'none'))}</g>`;
  const fmt = ts => span < 2*864e5 ? hhmm(ts) : span < 7*864e5 ? `${md(ts)} ${new Date(ts).getHours()}시` : md(ts);
  const nt = W < 480 ? 2 : 4; for(let i=0;i<=nt;i++){ const ts = t0+span*i/nt; g += `<text x="${m.l+iw*i/nt}" y="${H-6}" text-anchor="${i==0?'start':i==nt?'end':'middle'}">${fmt(ts)}</text>`; }
  g += `<line id="csv" y1="0" y2="${110+RH+6}" stroke="var(--ink)" stroke-width="1" opacity="0"/><rect id="cshit" x="${m.l}" y="0" width="${iw}" height="${110+RH+8}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, vl = svg.querySelector('#csv'), hit = svg.querySelector('#cshit');
  const st = (M, v, c) => { const r = M === 'temp' ? c.t : c.h; return v < r[0] ? '낮음' : v > r[1] ? '높음' : '쾌적'; };
  hit.onmousemove = e => { const rc = svg.getBoundingClientRect(), px = (e.clientX-rc.left)/rc.width*W;
    let b = P[0]; for(const q of P) if(Math.abs(X(q.ts)-px) < Math.abs(X(b.ts)-px)) b = q;
    const c = comfortAt(b.ts); vl.setAttribute('x1', X(b.ts)); vl.setAttribute('x2', X(b.ts)); vl.setAttribute('opacity', .7);
    showTip(e, `<b>${when(b.ts)}</b><br>온도 ${n1(b.temp)}° · ${st('temp', b.temp, c)}<br>습도 ${n0(b.hum)}% · ${st('hum', b.hum, c)}`); };
  hit.onmouseleave = () => { vl.setAttribute('opacity', 0); hideTip(); };

/* ---------- 쾌적 시간: 24시간 시계(시각별 쾌적 비율) + 날짜 달력 ---------- */
let ccOpen = false; try { ccOpen = localStorage.getItem('ccOpen') === '1'; } catch {}
let ccArgs = null, ccFlag = false;
function comfortClock(el, pts, o, base){
  ccArgs = [el, pts, o, base];
  const tg = $('#ccTog'); if(tg){ tg.setAttribute('aria-expanded', ccOpen); tg.firstChild.textContent = ccOpen ? '간단히' : '자세히'; }
  const P = pts.filter(p => p.temp != null && p.hum != null);
  if(P.length < 2){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const ok = (M, p) => { const c = comfortAt(p.ts), r = M === 'temp' ? c.t : c.h; return p[M] >= r[0] && p[M] <= r[1]; };
  const test = { temp: p => ok('temp', p), hum: p => ok('hum', p), both: p => ok('temp', p) && ok('hum', p) };
  const hr = (ts) => new Date(ts + KST).getUTCHours();
  // 시각별 비율
  const H = { temp: Array.from({length:24}, () => [0,0]), hum: Array.from({length:24}, () => [0,0]), both: Array.from({length:24}, () => [0,0]) };
  const D = {};
  P.forEach(p => { const h = hr(p.ts), d = kstDate(p.ts); D[d] = D[d] || { temp:[0,0], hum:[0,0], both:[0,0] };
    for(const k in test){ const v = test[k](p) ? 1 : 0; H[k][h][0] += v; H[k][h][1]++; D[d][k][0] += v; D[d][k][1]++; } });
  const nowH = hr(Date.now()), live = Date.now() - P.at(-1).ts < 3*36e5;
  const arc = (cx, cy, r0, r1, a0, a1) => { const p = (r, a) => [cx + r*Math.sin(a), cy - r*Math.cos(a)], [x0,y0] = p(r1,a0), [x1,y1] = p(r1,a1), [x2,y2] = p(r0,a1), [x3,y3] = p(r0,a0);
    return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r1},${r1} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r0},${r0} 0 0 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`; };
  const TINT = { temp:'var(--cc-t)', hum:'var(--cc-h)', both:'var(--cc-b)' };
  const clock = (k, name, rk) => {
    const S = 168, c = S/2, r1 = ccOpen ? 72 : 82, r0 = ccOpen ? 60 : 66, gap = 0; let g = '';
    for(let h = 0; h < 24; h++){ const [a, n] = H[k][h], a0 = h/24*2*Math.PI + gap, a1 = (h+1)/24*2*Math.PI - gap, sh = n ? a/n : null;
      g += `<path d="${arc(c, c, r0, r1, a0, a1)}" fill="${sh == null ? 'var(--sunk)' : TINT[k]}" fill-opacity="${sh == null ? 1 : (.08 + .9*sh).toFixed(3)}" class="cc-seg" style="--i:${h}"><title>${h}시 · ${sh == null ? '기록 없음' : `쾌적 ${Math.round(sh*100)}%`}</title></path>`; }
    const v = o && o[rk] != null ? Math.round(o[rk]) : null, d = base && base[rk] != null && v != null ? o[rk] - base[rk] : null;
    if(!ccOpen){ // 간단히: 얇은 고리 + 옆에 큰 숫자
      return `<div class="cc-mini" style="--tint:${TINT[k]}"><svg class="cc" viewBox="0 0 ${S} ${S}">${g}</svg><div><b>${v == null ? '–' : v}<small>%</small></b><span>${name}</span></div></div>`; }
    // 자세히: 시각 눈금(0·6·12·18)은 고리 안쪽 짧은 선, 지금 시각은 바깥 삼각형
    [0,6,12,18].forEach(h => { const a = h/24*2*Math.PI, sx = Math.sin(a), cy0 = Math.cos(a);
      g += `<text class="cc-h" x="${(c+84*sx).toFixed(1)}" y="${(c-84*cy0+3.5).toFixed(1)}" text-anchor="middle">${h}</text>`; });
    if(live){ const a = (nowH+.5)/24*2*Math.PI, R = 78, q = (r, da) => `${(c + r*Math.sin(a+da)).toFixed(1)},${(c - r*Math.cos(a+da)).toFixed(1)}`; g += `<path d="M${q(R-2,0)}L${q(R+5,.045)}L${q(R+5,-.045)}Z" fill="var(--ink)"/>`; }
    g += `<text class="cc-p" x="${c}" y="${c+10}" text-anchor="middle">${v == null ? '–' : v}<tspan class="cc-u">${v == null ? '' : '%'}</tspan></text>`;
    if(d != null && Math.abs(d) >= .5) g += `<text class="cc-d" x="${c}" y="${c+26}" text-anchor="middle">${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(0)}%p</text>`;
    return `<figure class="cc-big" style="--tint:${TINT[k]}"><svg class="cc" viewBox="-14 -14 ${S+28} ${S+28}">${g}</svg><figcaption>${name}</figcaption></figure>`; };
  // 고리가 차례로 켜지는 모션은 페이지를 처음 열 때(새로고침)만
  let html = `<div class="ccs${ccOpen ? '' : ' min'}${ccAnimNext ? ' intro' : ''}">${clock('temp', '온도', 'comfort_t')}${clock('hum', '습도', 'comfort_h')}${clock('both', '둘 다', 'comfort')}</div>`;
  // 날짜 달력: 하루 중 온·습도가 모두 쾌적했던 시간 비율
  const days = Object.keys(D).sort();
  if(ccOpen && days.length >= 3){
    const show = days.slice(-62), first = mondayOf(show[0]), last = show.at(-1);
    let cells = ''; for(let d = first; d <= last; d = addDays(d, 1)){
      const x = D[d], inR = d >= show[0];

      const sh = x.both[0]/x.both[1], pc = (q) => Math.round(q[0]/q[1]*100);
      cells += `<i class="cd${sh > .55 ? ' hi' : ''}" style="--a:${(.06 + .9*sh).toFixed(3)}" title="${md2(d)} (${wd(d)}) · 둘 다 ${pc(x.both)}% · 온도 ${pc(x.temp)}% · 습도 ${pc(x.hum)}%"><b>${+d.slice(8) === 1 || d === show[0] ? `${+d.slice(5,7)}/${+d.slice(8)}` : +d.slice(8)}</b><span>${pc(x.both)}</span></i>`; }
    html += `<div class="cal"><div class="cal-h"><span>날짜별</span><em>온·습도 모두 쾌적했던 시간 비율</em></div><div class="cal-w">${'월화수목금토일'.split('').map(w => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells}</div></div>`;
  }
  const anim = el.dataset.ready && !matchMedia('(prefers-reduced-motion: reduce)').matches, h0 = el.offsetHeight;
  el.innerHTML = html; el.dataset.ready = 1;
  if(anim && ccFlag){ const h1 = el.offsetHeight; ccFlag = false;
    el.animate([{ height: h0 + 'px' }, { height: h1 + 'px' }], { duration: 260, easing: 'cubic-bezier(.3,.7,.3,1)' });
    el.firstElementChild && el.querySelectorAll('.ccs > *, .cal').forEach((n, i) => n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: i*30, easing: 'ease-out', fill: 'backwards' })); }
}

/* ---------- scatter: 온도 × 습도 ---------- */
function scatter(el, pts, cur, marks){
  const W = 460, H = 330, m = {l:38,r:10,t:8,b:30}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  // 축 범위는 점이 잘리지 않는 만큼만 (남는 구간 없이)
  const p = (marks && marks.length ? marks : pts).filter(q => q.temp != null && q.hum != null);
  const tv = p.map(q => q.temp).concat(cur && cur.temp != null ? [cur.temp] : []), hv = p.map(q => q.hum).concat(cur && cur.hum != null ? [cur.hum] : []);
  const ext = (v, minSpan, padF, padMin) => { if(!v.length) return [0, minSpan]; let lo = Math.min(...v), hi = Math.max(...v); const sp = Math.max(hi - lo, minSpan), pad = Math.max(sp * padF, padMin); const c = (lo + hi) / 2; lo = Math.min(lo, c - sp/2) - pad; hi = Math.max(hi, c + sp/2) + pad; return [lo, hi]; };
  const sx = niceScale(...ext(tv, 3, .06, .3)), sy = niceScale(...ext(hv, 8, .06, 1));
  const [x0, x1, y0, y1] = [sx.lo, sx.hi, Math.max(0, sy.lo), Math.min(100, sy.hi)];
  const X = t => m.l + (t-x0)/(x1-x0)*iw, Y = h => m.t + ih - (h-y0)/(y1-y0)*ih;
  let g = '';
  sx.ticks.forEach(t => { g += `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${m.t+ih}"/><text x="${X(t)}" y="${H-10}" text-anchor="middle">${tickLabel(t, sx.step)}°</text>`; });
  sy.ticks.filter(h => h >= y0 && h <= y1).forEach(h => { g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(h)}" y2="${Y(h)}"/><text x="${m.l-8}" y="${Y(h)+4}" text-anchor="end">${tickLabel(h, sy.step)}%</text>`; });
  const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
  const COL = { w:'var(--sw)', m:'var(--sm)', s:'var(--ss)' };
  // 조회 중인 계절의 쾌적 박스만 표시 (겹치는 영역은 아주 연한 빗금)
  g += `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--ink)" stroke-opacity=".13" stroke-width="1.2"/></pattern></defs>`;
  // 표시 범위와 겹치는 박스만 그리고, 잘린 변에는 테두리를 그리지 않는다
  const boxes = SEASONS.map(k => ({ k, ...SEASON_BOX[k] })).filter(bx => bx.t[1] > x0 && bx.t[0] < x1 && bx.h[1] > y0 && bx.h[0] < y1);
  boxes.forEach(bx => {
    const ta = Math.max(bx.t[0], x0), tb = Math.min(bx.t[1], x1), hy0 = Math.max(bx.h[0], y0), hy1 = Math.min(bx.h[1], y1), xa = X(ta), xb = X(tb), ya = Y(hy1), yb = Y(hy0), col = COL[bx.k];
    g += `<rect x="${xa}" y="${ya}" width="${xb-xa}" height="${yb-ya}" style="fill:color-mix(in srgb,${col} 13%,transparent)"/>`;
    const e = [bx.t[0] >= x0 ? `M${xa},${ya}V${yb}` : '', bx.t[1] <= x1 ? `M${xb},${ya}V${yb}` : '', bx.h[1] <= y1 && bx.h[1] < 100 ? `M${xa},${ya}H${xb}` : '', bx.h[0] >= y0 && bx.h[0] > 0 ? `M${xa},${yb}H${xb}` : ''].join('');
    g += `<path d="${e}" fill="none" stroke="${col}" stroke-width="1.6" stroke-opacity=".7"/>`;
  });
  for(let i = 0; i < boxes.length; i++) for(let j = i+1; j < boxes.length; j++){
    const A = boxes[i], B = boxes[j], t0 = Math.max(A.t[0], B.t[0]), t1 = Math.min(A.t[1], B.t[1]), h0 = Math.max(A.h[0], B.h[0], y0), h1 = Math.min(A.h[1], B.h[1], y1);
    if(t0 < t1 && h0 < h1) g += `<rect x="${X(t0)}" y="${Y(h1)}" width="${X(t1)-X(t0)}" height="${Y(h0)-Y(h1)}" fill="url(#hatch)"/>`;
  }
  // 점은 측정 시점의 계절 색으로 (박스보다 진하게), 최근일수록 진하게
  p.forEach((q,i) => { const a = .25 + .65*i/Math.max(1,p.length-1);
    g += `<circle cx="${X(clamp(q.temp,x0,x1))}" cy="${Y(clamp(q.hum,y0,y1))}" r="2.8" style="fill:${COL[comfortAt(q.ts).key]}" fill-opacity="${a}"/>`; });
  if(cur && cur.temp != null){
    const cx = X(clamp(cur.temp,x0,x1)), cy = Y(clamp(cur.hum,y0,y1));
    g += `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="var(--ink)" stroke-opacity=".25"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--ink)"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  return boxes.map(bx => bx.k);
}

/* ---------- 추이 (온도/습도 2단) ---------- */
function trend(el, pts, marks){
  lastTrend = [el, pts, marks];
  if(pts.length < 2){ el.innerHTML = '<div class="empty">아직 그릴 만큼의 데이터가 없습니다. 수집이 시작되면 이곳에 나타납니다.</div>'; return; }
  const W = Math.max(320, el.clientWidth || 1112), m = {l:44,r:8}, iw = W-m.l-m.r;
  const panels = [{k:'temp',lo:'tmin',hi:'tmax',c:'var(--t)',s:'var(--t-soft)',y:34,h:170,u:'°'},{k:'hum',lo:'hmin',hi:'hmax',c:'var(--h)',s:'var(--h-soft)',y:252,h:140,u:'%'},{k:'dew',lo:'dmin',hi:'dmax',c:'var(--d)',s:'var(--d-soft)',y:436,h:116,u:'°'}];
  const OSx = cache && cache.out && cache.out.series ? cache.out.series.filter(q => q.ts >= pts[0].ts - 36e5 && q.ts <= pts.at(-1).ts + 36e5) : [], OP = null; // 실내·바깥 비교는 '바깥' 탭으로 옮김
  const BOT = OP ? OP.y + OP.h : 436+116, H = BOT+28, t0 = pts[0].ts, t1 = pts.at(-1).ts, span = t1-t0 || 1;
  const REV = false, XT = ts => m.l + (REV ? t1-ts : ts-t0)/span*iw, X = p => XT(p.ts), ord = a => REV ? a.slice().reverse() : a;
  let g = '';
  panels.forEach(P => {
    const v = pts.flatMap(p => [p[P.lo],p[P.hi]]).filter(x => x!=null);
    const mn = Math.min(...v), mx = Math.max(...v), pad = Math.max((mx-mn)*.12, .3), sc = niceScale(mn-pad, mx+pad), lo = sc.lo, hi = sc.hi;
    P.Y = val => P.y + P.h - (val-lo)/(hi-lo)*P.h;
    const tks = sc.ticks.length > 4 ? sc.ticks.filter((_, i) => i % 2 === 0) : sc.ticks;
    tks.forEach(t => { const yy = P.Y(t); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${tickLabel(t, sc.step)}${P.u}</text>`; });
    const ga = vGrad(P.k, lo, hi, P.Y(lo), P.Y(hi), .38, true), gb = vGrad(P.k, lo, hi, P.Y(lo), P.Y(hi), .22); g += `<defs>${ga.def}${gb.def}</defs>`; P.c = 'var(--ink)'; P.s = `url(#${gb.id})`; P.a = `url(#${ga.id})`;
    const v2 = pts.filter(p => p[P.k]!=null);
    // 실측 지점이 보이는 범위(≤300회)에서는 실측값을 지나는 매끄러운 곡선으로, 그보다 촘촘한 범위에서는 보간 격자를 이어서 그린다
    const real = (marks || []).filter(q => q[P.k] != null && q.ts > t0 && q.ts < t1);
    const src = real.length ? [v2[0], ...real, v2.at(-1)] : v2;
    const line = smooth(ord(src).map(p => [X(p), P.Y(p[P.k])]));
    let band = '';
    // (최소–최대 띠는 선 아래 채움과 겹쳐 헷갈려서 그리지 않음. 범위는 마우스를 올리면 보임)
    // 선 아래를 값의 색으로 은은하게 채워 '얼마나 따뜻/습한지'는 색으로, 모양은 또렷한 선으로
    const x0 = X(src[0]).toFixed(1), x1 = X(src.at(-1)).toFixed(1), yb = (P.y + P.h).toFixed(1);
    const area = `<path d="${line}L${x1},${yb}L${x0},${yb}Z" fill="${P.a}" class="area"/>`;
    g += `${area}${band}<path d="${line}" fill="none" stroke="var(--ink)" stroke-opacity=".88" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    // 최고·최저 지점에만 값을 직접 표시
    if(src.length > 2){ const fv = P.k === 'hum' ? n0 : n1, ex = (best) => src.reduce((a, b) => best(b[P.k], a[P.k]) ? b : a);
      const hiP = ex((x, y) => x > y), loP = ex((x, y) => x < y), lbl = (pt, dy) => { const xx = Math.max(m.l+14, Math.min(W-m.r-14, X(pt))); return `<circle cx="${X(pt).toFixed(1)}" cy="${P.Y(pt[P.k]).toFixed(1)}" r="3" fill="var(--ink)"/><text class="exl" x="${xx.toFixed(1)}" y="${(P.Y(pt[P.k])+dy).toFixed(1)}" text-anchor="middle">${fv(pt[P.k])}${P.u}</text>`; };
      if(hiP[P.k] !== loP[P.k]) g += lbl(hiP, -9) + lbl(loP, 17); }
    P.label = `<g class="plab"><text x="${m.l-36}" y="${P.y-20}">${{temp:'온도',hum:'습도',dew:'이슬점'}[P.k]}</text></g>`;
    const mk = (marks || []).filter(q => q[P.k] != null && q.ts >= t0 && q.ts <= t1);
    if(mk.length <= 48) mk.forEach(q => { g += `<circle cx="${XT(q.ts).toFixed(1)}" cy="${P.Y(q[P.k]).toFixed(1)}" r="2.4" fill="var(--panel)" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1.3"/>`; });
  });
  // 실내·바깥 기온을 한 축에: 두 선 사이(편차)를 옅게 채움
  if(OP){
    const ins = pts.filter(p => p.temp != null), os = OSx.filter(q => q.ts >= t0 && q.ts <= t1);
    const all = ins.map(p => p.temp).concat(os.map(q => q.temp)), mn = Math.min(...all), mx = Math.max(...all), sc = niceScale(mn - (mx-mn)*.08, mx + (mx-mn)*.08);
    OP.Y = v => OP.y + OP.h - (v - sc.lo)/(sc.hi - sc.lo)*OP.h;
    (sc.ticks.length > 4 ? sc.ticks.filter((_, i) => i % 2 === 0) : sc.ticks).forEach(t => { const yy = OP.Y(t); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${tickLabel(t, sc.step)}°</text>`; });
    if(os.length > 1){
      const step = Math.max(1, Math.ceil(ins.length / 400)), iq = ins.filter((_, i) => i % step === 0 || i === ins.length-1);
      const top = iq.map(p => [X(p), OP.Y(p.temp)]), bot = iq.slice().reverse().map(p => [X(p), OP.Y(valAt(os, p.ts, 'temp'))]);
      g += `<path d="${smooth(top) + smooth(bot, false)}Z" class="od-gap"/>`;
      g += `<path d="${smooth(os.map(q => [X(q), OP.Y(q.temp)]))}" class="od-out"/>`;
      g += `<path d="${smooth(iq.map(p => [X(p), OP.Y(p.temp)]))}" class="od-in"/>`;
      const gaps = iq.map(p => p.temp - valAt(os, p.ts, 'temp')), avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      g += `<g class="plab"><text x="${m.l-36}" y="${OP.y-16}">실내 · 바깥 기온</text></g><text class="od-l" x="${W-m.r}" y="${OP.y-16}" text-anchor="end">평균 차이 ${avg >= 0 ? '+' : '−'}${Math.abs(avg).toFixed(1)}° · 바깥 ${OUT.name}</text>`;
      const le = iq.at(-1), lo = os.at(-1); g += `<text class="od-k" x="${Math.min(X(le)+4, W-m.r-2)}" y="${OP.Y(le.temp)-6}" text-anchor="end">실내</text><text class="od-k" x="${Math.min(X(lo)+4, W-m.r-2)}" y="${OP.Y(lo.temp)+14}" text-anchor="end">바깥</text>`;
    }
  }
  panels.forEach(P => { g += P.label; });
  const fmt = ts => span < 2*864e5 ? hhmm(ts) : span < 7*864e5 ? `${md(ts)} ${new Date(ts).getHours()}시` : md(ts);
  const nt = W < 600 ? 3 : 6; for(let i=0;i<=nt;i++){ const ts = REV ? t1-span*i/nt : t0+span*i/nt; g += `<text x="${m.l+iw*i/nt}" y="${H-4}" text-anchor="${i==0?'start':i==nt?'end':'middle'}">${fmt(ts)}</text>`; }
  if(selTs && selTs >= t0 && selTs <= t1){ const sx = XT(selTs).toFixed(1); g += `<line x1="${sx}" x2="${sx}" y1="20" y2="${BOT}" stroke="var(--ink)" stroke-width="1.6"/><path d="M${sx-5},0 L${+sx+5},0 L${sx},7 Z" fill="var(--ink)"/>`; }
  g += `<g id="cur" opacity="0"><line y1="20" y2="${BOT}" stroke="var(--ink)" stroke-opacity=".4"/><circle id="d1" r="4.5" stroke="var(--panel)" stroke-width="2"/><circle id="d2" r="4.5" stroke="var(--panel)" stroke-width="2"/><circle id="d3" r="4.5" stroke="var(--panel)" stroke-width="2"/><circle id="d4" r="4" fill="var(--ink)" stroke="var(--panel)" stroke-width="2" opacity="${OP ? 1 : 0}"/></g><rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H-20}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, cur = svg.querySelector('#cur'), hit = svg.querySelector('#hit');
  hit.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W;
    let b = pts[0]; for(const p of pts) if(Math.abs(X(p)-px) < Math.abs(X(b)-px)) b = p;
    cur.setAttribute('opacity',1); cur.firstChild.setAttribute('x1',X(b)); cur.firstChild.setAttribute('x2',X(b));
    const d1 = cur.querySelector('#d1'), d2 = cur.querySelector('#d2');
    d1.setAttribute('cx',X(b)); d1.setAttribute('cy',panels[0].Y(b.temp)); d1.setAttribute('fill', specColor('temp', b.temp)); d2.setAttribute('fill', specColor('hum', b.hum)); if(b.dew != null) cur.querySelector('#d3').setAttribute('fill', specColor('dew', b.dew)); d2.setAttribute('cx',X(b)); d2.setAttribute('cy',panels[1].Y(b.hum)); const d3 = cur.querySelector('#d3'); if(b.dew != null){ d3.setAttribute('cx',X(b)); d3.setAttribute('cy',panels[2].Y(b.dew)); }
    const ot = OP ? valAt(OSx, b.ts, 'temp') : null, oh = OP ? valAt(OSx, b.ts, 'hum') : null;
    if(OP && OP.Y && ot != null){ const d4 = cur.querySelector('#d4'); d4.setAttribute('cx', X(b)); d4.setAttribute('cy', OP.Y(ot)); }
    const rg = (lo, hi, f) => lo == null || f(lo) === f(hi) ? '' : ` <span style="opacity:.55">${f(lo)}–${f(hi)}</span>`;
    showTip(e, `<b>${when(b.ts)}</b><br>온도 ${n1(b.temp)}°${rg(b.tmin, b.tmax, n1)}<br>습도 ${n0(b.hum)}%${rg(b.hmin, b.hmax, n0)}<br>이슬점 ${n1(b.dew)}°${rg(b.dmin, b.dmax, n1)}` + (ot != null ? `<br>바깥 ${n1(ot)}° · ${n0(oh)}% <span style="opacity:.6">(실내 ${b.temp - ot >= 0 ? '+' : '−'}${n1(Math.abs(b.temp - ot))}°)</span>` : ''));
  };
  hit.onmouseleave = () => { cur.setAttribute('opacity',0); hideTip(); };
  hit.style.cursor = 'pointer';
  hit.onclick = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W; selectPoint(Math.round(REV ? t1 - (px-m.l)/iw*span : t0 + (px-m.l)/iw*span)); };
}

/* ---------- 히트맵 ---------- */
// 연속 색 스펙트럼: 값에 따라 색 정지점 사이를 부드럽게 보간한다
const BINS = {

  const fmt = ts => span < 2*864e5 ? hhmm(ts) : span < 7*864e5 ? `${md(ts)} ${new Date(ts).getHours()}시` : md(ts);
  const nt = W < 600 ? 3 : 6; for(let i = 0; i <= nt; i++){ const ts = t0 + span * i / nt; g += `<text x="${m.l + iw * i / nt}" y="${H-6}" text-anchor="${i == 0 ? 'start' : i == nt ? 'end' : 'middle'}">${fmt(ts)}</text>`; }
  g += `<text class="od-l" x="${m.l+iw}" y="22" text-anchor="end">굵은 선 실내 · 가는 선 ${OUT.name}${SUN.length && !narrow ? ' · 막대 일사량' : ''}</text>`;
  g += `<g id="ocur" opacity="0"><line y1="24" y2="${H-24}" stroke="var(--ink)" stroke-opacity=".35"/><circle id="oc1" r="4" class="od-dot"/><circle id="oc2" r="4" class="od-dot"/><circle id="oc3" r="4" class="od-dot"/><circle id="oc4" r="4" class="od-dot"/></g><rect id="ohit" x="${m.l}" y="0" width="${iw}" height="${H-24}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, cur = svg.querySelector('#ocur');
  svg.querySelector('#ohit').onmousemove = e => { const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W;
    let b = D[0]; for(const q of D) if(Math.abs(X(q.ts) - px) < Math.abs(X(b.ts) - px)) b = q;
    cur.setAttribute('opacity', 1); cur.firstChild.setAttribute('x1', X(b.ts)); cur.firstChild.setAttribute('x2', X(b.ts));
    [['#oc1', 0, 'it'], ['#oc2', 0, 'ot'], ['#oc3', 1, 'ih'], ['#oc4', 1, 'oh']].forEach(([id, pi, k]) => { const c = svg.querySelector(id); c.setAttribute('cx', X(b.ts)); c.setAttribute('cy', panels[pi].Y(b[k])); });
    const sp = SUN.find(h => b.ts >= h.a && b.ts < h.b);
    showTip(e, `<b>${when(b.ts)}</b><br>기온 실내 ${n1(b.it)}° · AWS ${n1(b.ot)}° <span style="opacity:.6">(${sg(b.dt, 1, '°')})</span><br>습도 실내 ${n0(b.ih)}% · AWS ${n0(b.oh)}% <span style="opacity:.6">(${sg(b.dh, 0, '%p')})</span>` + (sp ? `<br>일사량 ${Math.round(sp.w)} W/㎡` : '')); };
  svg.querySelector('#ohit').onmouseleave = () => { cur.setAttribute('opacity', 0); hideTip(); };
}

/* ---------- 햇빛: 집 위치 위성 일사량 (한국에너지기술연구원, 1시간 평균 W/㎡, hm = 그 1시간의 시작) ---------- */
// 시간별 [{ a, b, w }]  w = 1시간 평균 W/㎡
let sunOM = { rows: [], at: 0 };
function solarHours(){
  const c = cache || {}, G = c.ghi || [], key = G.length + ':' + (G.at(-1) || {}).ts + ':' + sunOM.rows.length;
  if(c._solarKey === key) return c._solar;
  // 집 격자 위성값(KIER)을 우선, 없는 시간은 Open-Meteo
  const K = G.map(p => ({ a: p.ts, b: p.ts + 36e5, w: p.ghi })), have = new Set(K.map(x => x.a));
  c._solarKey = key; c._solar = K.concat(sunOM.rows.filter(x => !have.has(x.a)).map(x => ({ ...x, om: true }))).sort((x, y) => x.a - y.a);
  return c._solar;
}
const sunIn = (a, b) => solarHours().filter(h => h.b > a && h.a < b);
// 일별 햇빛량 kWh/㎡ (= 시간 평균 W/㎡의 합 ÷ 1000). 낮(7–16시) 10칸 중 9칸 이상 있어야 full
function sunDays(Hs){
  const g = {}; Hs.forEach(h => { const d = kstDate(h.a + 18e5); (g[d] = g[d] || []).push(h); });
  return Object.keys(g).sort().map(d => { const a = g[d], hrs = new Set(a.map(h => new Date(h.a + 18e5 + KST).getUTCHours()));
    let day = 0; for(let h = 7; h <= 16; h++) if(hrs.has(h)) day++;
    return { d, kwh: a.reduce((x, h) => x + h.w, 0) / 1000, peak: Math.max(...a.map(h => h.w)), full: day >= 9 }; });
}
let sunIndoor = { key: '', rows: [] };
async function loadSunIndoor(Hs){
  if(!Hs.length) return;
  const a = kstMs(kstDate(Hs[0].a)) - 864e5, b = Math.min(Date.now(), kstMs(addDays(kstDate(Date.now()), 1))), key = a + ':' + Math.floor(b / 9e5);
  if(sunIndoor.key === key) return; sunIndoor.key = key;
  const rows = await get(`/api/heatmap?range=r:${a}:${b}&by=d`).catch(() => []);
  if(sunIndoor.key === key){ sunIndoor.rows = Array.isArray(rows) ? rows : []; if(panel === 'out') sunAnalysis($('#outSun')); }
}

/* ---------- 열 배터리: 집이 품은 열(또는 냉기)을 배터리처럼. 같은 25°라도 계절에 따라 잔량이 다르다 ----------
   바깥이 그 달 쾌적 범위보다 추우면 '열 배터리': 0% = 쾌적 하한 −3°, 100% = 쾌적 상한 (겨울 20°→25°, 봄·가을 23°→28°)
   바깥이 더 더우면 '냉기 배터리': 0% = 쾌적 상한 +3°, 100% = 쾌적 하한 (여름 32°→27°). 내려갈수록 충전 */
const batClamp = (v) => Math.max(0, Math.min(1, v));
function batSpec(ts, outMean){
  const c = comfortAt(ts), L = c.t[0], H = c.t[1];
  const heat = outMean != null ? outMean < (L + H) / 2 : ![5, 6, 7, 8, 9].includes(c.m);
  return heat ? { heat: true, name: '열 배터리', lo: L - 3, hi: H, c, soc: (v) => batClamp((v - (L - 3)) / (H - (L - 3))) }
              : { heat: false, name: '냉기 배터리', lo: H + 3, hi: L, c, soc: (v) => batClamp(((H + 3) - v) / ((H + 3) - L)) };
}
const outMeanIn = (a, b) => { const S = cache && cache.out && cache.out.series; if(!S) return null; const v = S.filter(p => p.ts >= a && p.ts < b).map(p => p.temp); return v.length >= 6 ? v.reduce((x, y) => x + y, 0) / v.length : null; };
function sunAnalysis(el){
  const Hs = solarHours();
  if(!Hs.length){ el.innerHTML = '<h3>열 배터리</h3><div class="empty">햇빛 자료를 불러오는 중</div>'; return; }
  loadSunIndoor(Hs);
  const R = sunIndoor.rows.filter(r => r.temp != null).map(r => ({ ...r, ts: kstMs(r.d) + r.h * 36e5 }));
  // 실내: 날짜별 일평균, 오전 최저, 하루 최고
  const I = {}; R.forEach(r => (I[r.d] = I[r.d] || []).push(r));
  const ind = (d) => { const a = I[d]; if(!a || a.length < 20) return null; const am = a.filter(r => r.h < 12).map(r => r.temp);
    return { mean: a.reduce((x, r) => x + r.temp, 0) / a.length, amMin: am.length ? Math.min(...am) : null, max: Math.max(...a.map(r => r.temp)) }; };
  const days = sunDays(Hs).map(r => { const i = ind(r.d), p = ind(addDays(r.d, -1));
    return { ...r, mean: i && i.mean, rise: i && i.amMin != null ? i.max - i.amMin : null, dMean: i && p ? i.mean - p.mean : null }; });
  const avg = (a, k) => { const v = a.filter(r => r[k] != null); return v.length ? v.reduce((x, r) => x + r[k], 0) / v.length : null; };
  const sgn = (v, dec = 1, u = '°') => v == null ? '–' : `${v >= 0 ? '+' : '−'}${Math.abs(v).toFixed(dec)}${u}`;
  // 맑은 날·흐린 날의 하루 충전/방전 (햇빛량 위·아래 3분의 1, 날이 적으면 절반)
  const full = days.filter(r => r.full && r.dMean != null), srt = full.slice().sort((x, y) => x.kwh - y.kwh);
  const cut = srt.length >= 9 ? Math.round(srt.length / 3) : Math.floor(srt.length / 2);
  const cloudy = cut ? srt.slice(0, cut) : [], sunny = cut ? srt.slice(srt.length - cut) : [];
  const rateS = avg(sunny, 'dMean'), rateC = avg(cloudy, 'dMean');
  // 지금 상태: 최근 24시간 평균과 그 전 24시간 평균
  const now = Date.now(), m24 = (a, b) => { const v = R.filter(r => r.ts + 18e5 > a && r.ts + 18e5 <= b).map(r => r.temp); return v.length >= 12 ? v.reduce((x, y) => x + y, 0) / v.length : null; };
  const T24 = m24(now - 864e5, now), P24 = m24(now - 2 * 864e5, now - 864e5), flow = T24 != null && P24 != null ? T24 - P24 : null;
  const O24 = outMeanIn(now - 864e5, now), B = batSpec(now, O24);
  const soc = T24 == null ? null : B.soc(T24), pct = soc == null ? null : Math.round(soc * 100), psoc = P24 == null ? null : B.soc(P24);
  // 충전/방전은 잔량이 늘었는지로 판단 (냉기 배터리는 시원해질수록 충전)
  const dSoc = soc != null && psoc != null ? soc - psoc : null, st = dSoc == null ? 'idle' : dSoc > .008 ? 'chg' : dSoc < -.008 ? 'dis' : 'idle';
  const stTxt = { chg: '충전 중', dis: '방전 중', idle: '유지' }[st];
  const today = days.find(r => r.d === kstDate(now)), ref = Math.max(1, ...days.slice(-15).filter(r => r.full).map(r => r.kwh));
  // 남은 날: 열 배터리는 흐린 날 식는 속도로 0%까지, 냉기 배터리는 맑은 날 데워지는 속도로 0%까지
  const runway = T24 == null ? null : B.heat ? (rateC != null && rateC < -.05 && T24 > B.lo ? (T24 - B.lo) / -rateC : null) : (rateS != null && rateS > .05 && T24 < B.lo ? (B.lo - T24) / rateS : null);
  const tColor = T24 == null ? 'var(--faint)' : specColor('temp', T24), loColor = specColor('temp', B.lo);
  const ticks = Array.from({ length: 9 }, (_, i) => `<i style="left:${(i + 1) * 10}%"></i>`).join('');
  const bolt = '';
  // 최근 14일 일평균을 작은 배터리로 (그날의 계절·바깥 기준)
  const hist = days.filter(r => r.mean != null).slice(-14).map(r => { const t0 = kstMs(r.d), Bd = batSpec(t0 + 432e5, outMeanIn(t0, t0 + 864e5)), sd = Bd.soc(r.mean);
    return `<div class="bh${r.d === kstDate(now) ? ' now' : ''}${Bd.heat ? '' : ' cool'}" title="${md(t0)} 일평균 ${r.mean.toFixed(1)}° · ${Bd.name} ${Math.round(sd * 100)}% · 햇빛 ${r.kwh.toFixed(1)} kWh/㎡ · 하루 변화 ${sgn(r.dMean, 2)}">
      <span class="bh-c"><i style="height:${(sd * 100).toFixed(0)}%;background:${specColor('temp', r.mean)}"></i></span>
      <span class="bh-s" style="opacity:${(.15 + .85 * Math.min(1, r.kwh / ref)).toFixed(2)}"></span>
      <span class="bh-l">${+r.d.slice(8)}</span></div>`; }).join('');
  const pp = (v) => `${v >= 0 ? '+' : '−'}${Math.abs(Math.round(v * BS))}%p`; // 일평균 변화(°)를 배터리 %p로
  const col = (k, v, sub, cls = '') => `<div class="bs"><span class="k">${k}</span><b class="${cls}">${v}</b><em>${sub}</em></div>`;
  const stats = col('오늘 햇빛', today ? `${today.kwh.toFixed(1)}<small> kWh/㎡</small>` : '–', today ? `맑은 날의 ${Math.round(Math.min(1, today.kwh / ref) * 100)}%${today.full ? '' : ' · 진행 중'}` : '집 위치 위성')
    + col('맑은 날 하루', rateS == null ? '–' : pp(rateS), sunny.length ? `${sgn(rateS, 2)} · ${sunny.length}일 평균` : '자료 모으는 중', rateS > 0 ? 'up' : 'dn')
    + col('흐린 날 하루', rateC == null ? '–' : pp(rateC), cloudy.length ? `${sgn(rateC, 2)} · ${cloudy.length}일 평균` : '자료 모으는 중', rateC > 0 ? 'up' : 'dn');
  const note = [T24 != null ? `24시간 평균 ${T24.toFixed(1)}°` : null, O24 != null ? `바깥 ${O24.toFixed(1)}°` : null,
    runway != null ? `${B.heat ? '흐린 날만' : '맑은 날만'} 이어지면 약 ${runway < 1.5 ? '하루' : Math.round(runway) + '일'} 뒤 ${B.lo}°(0%)` : null].filter(Boolean).join(' · ');
  const battery = `<div class="bat ${st}" style="--k:${soc == null ? 0 : soc.toFixed(3)};--tc:${tColor};--lc:${loColor}">
    <div class="bat-row">
      <div class="bat-h"><span class="bat-m">${B.name} · ${B.c.season}</span><b>${pct == null ? '–' : pct}<small>%</small></b><em class="bat-st">${stTxt} ${flow == null ? '' : sgn(flow, 2) + ' / 24시간'}</em></div>
      <div class="bat-v"><div class="bat-body"><div class="bat-fill"><i class="bat-flow"></i></div><div class="bat-ticks">${ticks}</div>${bolt}</div><div class="bat-cap"></div>
        <div class="bat-sc"><span>${B.lo}° · 0%</span><span>${((B.lo + B.hi) / 2).toFixed(1).replace(/\.0$/, '')}°</span><span>${B.hi}° · 100%</span></div></div>
    </div>
    <div class="bat-stats">${stats}</div>
    ${note ? `<p class="bat-note">${note}</p>` : ''}
    <div class="bat-hist">${hist}</div>
    <p class="bat-leg"><span><span class="bh-s" style="display:inline-block;margin-right:5px;vertical-align:1px"></span>햇빛 많을수록 진하게</span><span> · 잔량은 그날의 계절 기준 (같은 온도라도 겨울엔 높고 여름엔 낮음)</span></p>
  </div>`;
  const mx = Math.max(.5, ...days.map(r => r.kwh));
  const rows = days.slice().reverse().slice(0, 14).map(r => `<div class="sd-row${r.full ? '' : ' part'}"><span class="d">${md(kstMs(r.d))}<i>${'일월화수목금토'[new Date(r.d + 'T00:00:00Z').getUTCDay()]}</i></span>
    <span class="sd-bar" title="${r.kwh.toFixed(2)} kWh/㎡ · 최대 ${Math.round(r.peak)} W/㎡"><i style="width:${(r.kwh / mx * 100).toFixed(1)}%"></i></span>
    <span class="v n">${r.kwh.toFixed(1)}</span>
    <span class="v${r.rise == null ? ' f' : ''}">${r.rise == null ? '–' : sgn(r.rise)}</span><span class="v ${r.dMean == null || Math.abs(r.dMean) < .05 ? 'f' : r.dMean > 0 ? 'up' : 'dn'}">${sgn(r.dMean)}</span></div>`).join('');
  el.innerHTML = `<h3>열 배터리</h3>` + thermoCard(true) + `<div id="tbDays" class="bd-wrap"></div><div id="tbChart" class="tb-chart"></div>`;
  loadThermo(); loadThermoRange(); batteryStrip($('#tbDays')); thermoChart($('#tbChart'));
}


/* ---------- 열 배터리 (실측 기반) ----------
   집은 바깥과의 온도 차에 비례해 열을 잃는다(뉴턴 냉각): 시간당 식는 정도 = k × (실내 − 바깥).
   k는 최근 14일 밤(해 없는 시간) 실내가 내려간 구간에서 직접 잰다. 그래서 같은 가을이라도
   이상저온(바깥이 더 차가움)이면 더 빨리 비고, 단열이 좋은 집이면 오래 버틴다.
   잔량 = 난방·냉방 없이 '버틸 수 있는 시간': 실내가 바닥(22°)까지 식는 데 걸리는 시간. 더운 철은 28°(더움)까지 데워지는 시간
   72시간(사흘) 이상 = 100% */
const TB = { min: 22, max: 28, full: 72 };
let thermo = { key: '', k: null, n: 0, H: [] };
async function loadThermo(){
  const b = Date.now(), a = b - 14 * 864e5, key = String(Math.floor(b / 18e5));
  if(thermo.key === key) return; thermo.key = key;
  const [ind, od] = await Promise.all([get(`/api/heatmap?range=r:${a}:${b}&by=d`).catch(() => []), get(`/api/outdoor?from=${a}&to=${b}&b=60`).catch(() => null)]);
  const OS = od && od.series || []; if(!Array.isArray(ind) || !ind.length || OS.length < 24){ thermo.key = ''; return; }
  const H = ind.filter(r => r.temp != null).map(r => { const ts = kstMs(r.d) + r.h * 36e5 + 18e5; return { ts, h: r.h, tin: r.temp, hin: r.hum, dew: r.dew, tout: valAt(OS, ts, 'temp') }; }).sort((x, y) => x.ts - y.ts);
  // 밤(19~06시)에 실내가 내려간 한 시간들에서 k를 잰다. 난방이 켜진 시간(오른 시간)은 빠진다
  const ks = [];
  for(let i = 1; i < H.length; i++){ const p = H[i - 1], q = H[i]; if(q.ts - p.ts > 1.5 * 36e5) continue;
    const night = q.h >= 19 || q.h <= 6, gap = (p.tin + q.tin) / 2 - (p.tout + q.tout) / 2, d = q.tin - p.tin;
    if(night && Math.abs(gap) > 4 && d * Math.sign(gap) < 0) ks.push(-d / gap); }
  ks.sort((x, y) => x - y);
  // 집과 바깥의 관계: 전체 기록의 일평균으로 '실내 = α + β × 바깥(5일 평균)'을 맞춘다
  const F = kstMs('2026-09-25'), [st, oa] = await Promise.all([get('/api/stats?range=all').catch(() => null), get(`/api/outdoor?from=${F}&to=${b}&b=60`).catch(() => null)]);
  const di = {}; (st && st.daily || []).forEach(r => { if(r.temp != null) di[r.d] = r.temp; });
  const dg = {}; (oa && oa.series || OS).forEach(p => { const d = kstDate(p.ts); (dg[d] = dg[d] || []).push(p.temp); });
  const dout = {}; Object.keys(dg).forEach(d => { if(dg[d].length >= 18) dout[d] = dg[d].reduce((x, y) => x + y, 0) / dg[d].length; });
  const hn = await get(`/api/outdoor?heat=1&from=${b - 2 * 36e5}&to=${b}`).catch(() => null), hl = (hn && hn.series || []).filter(x => x.room === '침실1').at(-1) || null;
  thermo = { key, H, n: ks.length, k: ks.length >= 8 ? ks[Math.floor(ks.length / 2)] : null, di, dout, M: fitHouse(di, dout), heat: hl };
  renderAll();
}
// 날짜별 실제 난방 사용량 (HT 에너지 화면 값). 0이면 그날 난방은 안 돈 것
let heatUse = { at: 0, map: {}, ok: false };
async function loadHeatUse(){
  if(Date.now() - heatUse.at < 30 * 60e3) return; heatUse.at = Date.now();
  const ms = []; for(let m = '2026-09'; m <= kstDate(Date.now()).slice(0, 7); m = addMonths(m, 1)) ms.push(m);
  const rs = await Promise.all(ms.map(m => get(`/api/outdoor?heatuse=${m}`).catch(() => null))); const map = {}; let ok = false;
  rs.forEach((r, i) => { if(!r || !r.usage) return; ok = true; r.usage.forEach((v, j) => { const d = `${ms[i]}-${String(j + 1).padStart(2, '0')}`; if(d <= kstDate(Date.now())) map[d] = v; }); });
  heatUse = { at: heatUse.at, map, ok }; renderAll();
}
// 선택한 기간에 맞춘 배터리 그래프용 자료 (앞쪽 6일은 24시간·5일 평균 계산용 여유)
let thermoR = { key: '', H: [], heat: [], t0: 0, t1: 0 };
async function loadThermoRange(){
  const P = cache && cache.hist && cache.hist.points; if(!P || !P.length) return;
  const t0 = P[0].ts, t1 = Math.min(Date.now(), P.at(-1).ts), a = Math.max(kstMs('2026-09-25'), t0 - 6 * 864e5), key = a + ':' + t0 + ':' + Math.floor(t1 / 18e5);
  if(thermoR.key === key) return; thermoR.key = key;
  const [ind, od, hb] = await Promise.all([get(`/api/heatmap?range=r:${a}:${t1}&by=d`).catch(() => []), get(`/api/outdoor?from=${a}&to=${t1}&b=60`).catch(() => null), get(`/api/outdoor?heat=1&from=${t0}&to=${t1}`).catch(() => null)]);
  const OS = od && od.series || []; if(!Array.isArray(ind) || !ind.length || OS.length < 6){ thermoR.key = ''; return; }
  const H = ind.filter(r => r.temp != null).map(r => { const ts = kstMs(r.d) + r.h * 36e5 + 18e5; return { ts, h: r.h, tin: r.temp, hin: r.hum, dew: r.dew, tout: valAt(OS, ts, 'temp') }; }).sort((x, y) => x.ts - y.ts);
  if(thermoR.key !== key) return;
  thermoR = { key, H, heat: hb && hb.series || [], t0, t1 };

// ---- 전체 기록을 날짜별 배터리로 ----
// 그날 평균 잔량 = 50% + (그날 실내 평균 − 그날 바깥 5일 평균으로 본 평소) × 25%p.
// 하루 변화를 '햇빛으로 설명되는 만큼'(전체 기록으로 맞춘 직선: 변화 = a × 햇빛 kWh/㎡ + c)과 나머지로 나눠,
// 햇빛 말고도 8%p 넘게 더 찬 날(또는 HT 기록상 난방이 돈 날)은 '난방 도움'으로 본다

  const di = thermo.di || {}, dout = thermo.dout || {}; if(!thermo.M) return [];

  const D = Object.keys(di).sort().map(d => { const e = houseExp(out5(dout, d)); return e == null ? null : { d, tin: di[d], e, soc: .5 + (di[d] - e) * BS / 100, kwh: kwh[d] ?? null }; }).filter(Boolean);
  D.forEach((r, i) => { r.dS = i ? r.soc - D[i - 1].soc : null; });

    // 충전된 날: 햇빛으로 설명 안 되는 몫(extra)이 크거나 HT상 난방이 돈 날이면 그만큼을 난방 몫으로, 나머지는 햇빛 몫

    sc.ticks.forEach(t => { const yy = P.Y(t); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${tickLabel(t, sc.step)}${P.u}</text>`; });
    const ga = vGrad(P.k, sc.lo, sc.hi, P.Y(sc.lo), P.Y(sc.hi), .38, true); g += `<defs>${ga.def}</defs>`;

    showTip(e, `<b>${b.h}시 평균</b><br>온도 ${n1(b.temp)}°<br>습도 ${n0(b.hum)}%` + (b.dew != null ? `<br>이슬점 ${n1(b.dew)}°` : '') + (b.out != null ? `<br>바깥 ${n1(b.out)}° <span style="opacity:.6">(실내 ${b.temp - b.out >= 0 ? '+' : '−'}${n1(Math.abs(b.temp - b.out))}°)</span>` : '')); };

// 실내·바깥 비교: 한 줄. 같은 눈금(기온 −10~35°, 습도 0~100%) 위 바깥(작은 고리)과 실내(점)를 가는 선으로 잇고, 오른쪽에 바깥 값과 차이

  const pi = P(inV), po = P(outV), d = inV - outV, f = (v) => hum ? `${Math.round(v)}%` : `${v.toFixed(1)}°`;
  const dt = Math.abs(d) < (hum ? .5 : .05) ? '±0' : `${d > 0 ? '+' : '−'}${hum ? Math.round(Math.abs(d)) + '%p' : Math.abs(d).toFixed(1) + '°'}`;
  return `<div class="db${opt.mini ? ' mini' : ''}" title="실내 ${f(inV)} · ${opt.out || '바깥'} ${f(outV)}">
    <div class="db-v"><i class="db-s" style="left:${Math.min(pi, po)}%;width:${Math.abs(pi - po)}%"></i><i class="db-o" style="left:${po}%"></i><i class="db-i" style="left:${pi}%"></i></div>
    <div class="db-x">${opt.out === '' ? '' : (opt.out || '바깥') + ' '}${f(outV)} <b>${dt}</b></div></div>`;
}
// 쾌적 구간만 밝게 켜진 얇은 스펙트럼 선 + 현재 위치

  const st = BINS[M].stops, a = st[0][0], b = st.at(-1)[0], P = (x) => Math.max(0, Math.min(100, (x - a) / (b - a) * 100));
  const grad = `linear-gradient(90deg,${st.map(([x, c]) => `${c} ${P(x).toFixed(1)}%`).join(',')})`;
  const rr = M === 'temp' ? CTX.t : M === 'hum' ? CTX.h : null;
  const zone = rr ? (() => { const l = P(rr[0]), w = P(Math.min(rr[1], b)) - l; return w > 0 ? `<i class="g2-z" style="left:${l}%;width:${w}%;background:${grad};background-size:${(100 / w * 100).toFixed(1)}% 100%;background-position:${(l / (100 - w || 1) * 100).toFixed(1)}% 0"></i>` : ''; })() : '';
  return `<div class="g2"><i class="g2-t" style="background:${grad}"></i>${zone}${v == null ? '' : `<i class="g2-m" style="left:${P(v)}%"></i>`}</div>`;

// 구간 흐름 작은 선 그래프: 또렷한 선 + 값 색 영역

  const X = (ts) => (ts - t0) / ((t1 - t0) || 1) * W, Y = (x) => H - 2 - (x - lo) / (hi - lo) * (H - 6);

}

// 바깥 날씨 (Open-Meteo, 키 불필요). 위치 기본값: 서울
const OUT = { lat: 37.5665, lon: 126.978, name: '서울' };
const outMemo = {};
// 실패한 요청은 기억하지 않고 한 번 더 시도
async function omGet(url){ if(outMemo[url]) return outMemo[url]; for(let i = 0; i < 2; i++){ try { const r = await fetch(url); if(!r.ok) throw new Error('om ' + r.status); return (outMemo[url] = await r.json()); } catch(e){ if(i) throw e; await new Promise(ok => setTimeout(ok, 1500)); } } }
const omSeries = (j) => { const h = j && j.hourly; if(!h) return []; return h.time.map((t, i) => ({ ts: Date.parse(t + ':00+09:00'), temp: h.temperature_2m[i], hum: h.relative_humidity_2m[i] })).filter(p => p.temp != null && p.hum != null); };
async function outdoorRange(t0, t1){
  const q = `latitude=${OUT.lat}&longitude=${OUT.lon}&hourly=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul`;
  const d0 = kstDate(t0 - 36e5), d1 = kstDate(t1 + 36e5), cut = kstDate(Date.now() - 6*864e5), parts = [];
  // 6일보다 오래된 구간은 관측 기록(archive), 최근은 예보 API의 지난 값
  if(d0 < cut) parts.push(omGet(`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${d0}&end_date=${d1 < cut ? d1 : addDays(cut, -1)}`));
  if(d1 >= cut) parts.push(omGet(`https://api.open-meteo.com/v1/forecast?${q}&start_date=${d0 > cut ? d0 : cut}&end_date=${d1}`));
  const all = (await Promise.all(parts.map(x => x.catch(() => null)))).flatMap(omSeries).sort((a, b) => a.ts - b.ts);
  return all.filter(p => p.ts <= Date.now() + 36e5);
}
// 일사량 과거값: 한국에너지기술연구원 API는 최근 약 12일만 주므로, 그 전은 Open-Meteo 일사(1시간 평균 W/㎡, 그 시각까지의 한 시간)로 채운다
async function omSunRange(t0, t1){
  const q = `latitude=37.552&longitude=127.169&hourly=shortwave_radiation&timezone=Asia%2FSeoul`;
  const d0 = kstDate(t0), d1 = kstDate(t1), cut = kstDate(Date.now() - 6*864e5), parts = [];
  if(d0 < cut) parts.push(omGet(`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${d0}&end_date=${d1 < cut ? d1 : addDays(cut, -1)}`));
  if(d1 >= cut) parts.push(omGet(`https://api.open-meteo.com/v1/forecast?${q}&start_date=${d0 > cut ? d0 : cut}&end_date=${d1}`));
  const js = await Promise.all(parts.map(x => x.catch(() => null)));
  return js.flatMap(j => { const h = j && j.hourly; if(!h) return []; return h.time.map((t, i) => { const b = Date.parse(t + ':00+09:00'); return { a: b - 36e5, b, w: h.shortwave_radiation[i] }; }); })
    .filter(x => x.w != null && x.b <= Date.now());
}
async function outdoorNow(){ const j = await omGet(`https://api.open-meteo.com/v1/forecast?latitude=${OUT.lat}&longitude=${OUT.lon}&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul&_=${Math.floor(Date.now()/6e5)}`);
  return j && j.current ? { ts: Date.parse(j.current.time + ':00+09:00'), temp: j.current.temperature_2m, hum: j.current.relative_humidity_2m } : null; }
// 시계열에서 특정 시각의 값 (선형 보간)
function valAt(S, ts, k){ if(!S || !S.length) return null; let lo = 0, hi = S.length - 1; if(ts <= S[0].ts) return S[0][k]; if(ts >= S[hi].ts) return S[hi][k];
  while(hi - lo > 1){ const m = (lo + hi) >> 1; if(S[m].ts <= ts) lo = m; else hi = m; } const a = S[lo], b = S[hi], f = (ts - a.ts) / (b.ts - a.ts); return a[k] + (b[k] - a[k]) * f; }
// 바깥 자료: 기상청 AWS 강동(1분, 날짜별로 받아 CDN 캐시)을 우선, 빠진 시간은 Open-Meteo(서울, 1시간)로 메운다
const awsMemo = {};
async function pool(tasks, n){ const out = new Array(tasks.length); let i = 0; await Promise.all(Array.from({length: Math.min(n, tasks.length)}, async () => { while(i < tasks.length){ const k = i++; out[k] = await tasks[k](); } })); return out; }
const smooth1 = (S, w) => S.map((p, i) => { const a = S.slice(Math.max(0, i - w), i + w + 1); return { ts: p.ts, temp: a.reduce((x, q) => x + q.temp, 0) / a.length, hum: a.reduce((x, q) => x + q.hum, 0) / a.length }; });
function mergeOut(aws, om){
  if(!aws.length) return om; if(!om.length) return aws;
  const near = (ts) => { let lo = 0, hi = aws.length - 1; while(hi - lo > 1){ const m = (lo + hi) >> 1; if(aws[m].ts <= ts) lo = m; else hi = m; } return Math.min(Math.abs(aws[lo].ts - ts), Math.abs(aws[hi].ts - ts)); };
  return aws.concat(om.filter(q => near(q.ts) > 45*60e3)).sort((x, y) => x.ts - y.ts);
}
async function awsDays(t0, t1){
  const res = t1 - t0 > 2*864e5 ? 10 : 1, days = []; for(let d = kstDate(t0); d <= kstDate(t1); d = addDays(d, 1)) days.push(d);
  const today = kstDate(Date.now());
  const parts = await pool(days.map(d => async () => { const k = d + '|' + res; if(awsMemo[k] && d < today) return awsMemo[k];
    const j = await get(`/api/outdoor?day=${d}&res=${res}`).catch(() => null), S = j && j.series || []; if(S.length) awsMemo[k] = S; return S; }), 6);
  const S = parts.flat().filter(p => p.ts >= t0 - 36e5 && p.ts <= t1 + 36e5).sort((x, y) => x.ts - y.ts);

// onStep: Open-Meteo가 먼저 오면 바로 그리고, AWS가 오면 다시 그린다
async function fetchOutdoor(t0, t1, onStep){
  // 1순위: DB에 쌓인 강동 자료 (수집 때마다 저장). 거의 다 있으면 그걸로 끝
  const db = await get(`/api/outdoor?from=${Math.round(t0 - 30*60e3)}&to=${Math.round(t1 + 30*60e3)}`).catch(() => null);
  const ds = db && db.series || [];
  if(ds.length > 1){ const cover = (ds.at(-1).ts - ds[0].ts) / Math.max(1, t1 - t0), gaps = ds.some((p, i) => i && p.ts - ds[i-1].ts > 3*36e5);
    const S = ds;
    if(cover > .95 && !gaps) return { series: S, src: 'AWS 402' };
    if(onStep) onStep({ series: S, src: 'AWS 402' }); }
  const omP = outdoorRange(t0, t1).catch(() => []);
  // 기상청 직접 조회는 호출 한도(하루 2만 회) 때문에 DB가 아예 응답하지 않을 때만, 7일 이하 구간에 한해 쓴다. 나머지 빈틈은 Open-Meteo
  const awsP = !db && t1 - t0 <= 7*864e5 ? awsDays(t0, t1).catch(() => []) : Promise.resolve([]);

// 히트맵용 바깥 자료 (히트맵 기간이 따로라서)

async function loadHeatOut(){

const outIn = () => { const S = cache && cache.out && cache.out.series, P = cache && cache.hist && cache.hist.points; if(!S || !S.length || !P || !P.length) return null; const a = P[0].ts, b = P.at(-1).ts; return S.filter(p => p.ts >= a && p.ts <= b); };
// 구간 집계용: 바깥 기온을 일·주·월 단위 최저/평균/최고로
function outRows(u){
