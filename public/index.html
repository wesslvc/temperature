<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion Room — 온습도</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f0e9; --panel:#faf8f3; --ink:#1d1c1a; --sub:#77736a; --faint:#a9a498; --rule:#dcd7ca;
  --t:#c2410c; --h:#1e6a8c; --ok:#4d7c3a;
  --t-soft:rgba(194,65,12,.13); --h-soft:rgba(30,106,140,.13); --comfort:rgba(77,124,58,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211; --panel:#191917; --ink:#ece9e1; --sub:#928e83; --faint:#5c5951; --rule:#2c2b27;
  --t:#f08a52; --h:#6cb4d6; --ok:#98c27c;
  --t-soft:rgba(240,138,82,.16); --h-soft:rgba(108,180,214,.16); --comfort:rgba(152,194,124,.1);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:28px 24px 72px}
.mono{font-variant-numeric:tabular-nums}
.k{font-size:12px;letter-spacing:.04em;color:var(--sub)}

/* header */
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{color:var(--sub);font-weight:400;margin-left:10px}
.meta{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
.fresh{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:7px}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.fresh.live i{background:var(--ok)}
.fresh.stale i{background:#d99a2b}
.tabs{display:flex;gap:2px}
.tabs button{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--ink)}

/* period picker */
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.pickers{display:flex;gap:6px;flex-wrap:wrap}
.pickers label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:3px 8px;border:1px solid var(--rule);border-radius:3px}
.pickers label.on{border-color:var(--ink);color:var(--ink)}
.pickers input,.pickers select{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;outline:none;color-scheme:light dark}

/* quick range + stepper */
.pickL{display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.step button{border:1px solid var(--rule);background:none;color:var(--ink);width:26px;height:26px;border-radius:3px;font:inherit;cursor:pointer;line-height:1}
.step button:hover:not(:disabled){border-color:var(--ink)}
.step button:disabled{color:var(--faint);cursor:default}
.step span{min-width:9.5em;text-align:center;font-weight:600}
.facts small{display:block;font-size:12px;color:var(--sub);margin-top:1px;font-variant-numeric:tabular-nums}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:14px;height:10px;border-radius:2px;display:inline-block}
table.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tb th{font-weight:500;font-size:12px;color:var(--sub);text-align:right;padding:8px 10px;border-bottom:1px solid var(--ink)}
table.tb td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--rule)}
table.tb th:first-child,table.tb td:first-child{text-align:left;padding-left:0}
table.tb td.ex{font-weight:700}
table.tb td.t{color:var(--t)} table.tb td.h{color:var(--h)}
.tbw{overflow-x:auto}

/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border-bottom:1px solid var(--rule)}
.now{padding:34px 40px 30px 0;border-right:1px solid var(--rule)}
.pair{display:flex;gap:56px;flex-wrap:wrap}
.num{font-size:88px;font-weight:600;letter-spacing:-.05em;line-height:.95;display:flex;align-items:flex-start}
.num small{font-size:26px;font-weight:500;letter-spacing:0;color:var(--sub);margin:8px 0 0 4px}
.num.t{color:var(--t)} .num.h{color:var(--h)}
.lbl{display:flex;gap:10px;align-items:baseline;margin-top:12px;font-size:13px;color:var(--sub)}
.lbl b{color:var(--ink);font-weight:700;font-size:14px}
.delta{font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)}
.facts div b{display:block;font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.facts div b em{font-style:normal;font-size:13px;color:var(--sub);font-weight:400;margin-left:2px}
.verdict{margin-top:22px;font-size:15px;max-width:34em}
.scatter{padding:34px 0 24px 36px}
.scatter h3,.sec h3{font-size:13px;font-weight:600;letter-spacing:.01em;margin-bottom:2px}
.scatter p,.sec p.cap{font-size:12px;color:var(--sub);margin-bottom:12px}

/* sections */
.sec{padding:36px 0 8px;border-bottom:1px solid var(--rule)}
.sec:last-of-type{border:0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:8px;opacity:.5}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--sub);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.gl{stroke:var(--rule);stroke-width:1}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:36px 0 0}
.strip>div{padding:18px 18px 18px 0;border-right:1px solid var(--rule);padding-left:18px}
.strip>div:first-child{padding-left:0}.strip>div:last-child{border:0}
.strip b{display:block;font-size:26px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.strip small{font-size:12px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.seg{display:inline-flex;gap:14px;font-size:12px}
.seg button{border:0;background:none;font:inherit;color:var(--sub);cursor:pointer;padding:0;border-bottom:1px solid transparent}
.seg button.on{color:var(--ink);border-color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;font-size:12px;line-height:1.5;opacity:0;z-index:9;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:48px 0;color:var(--sub);font-size:13px}
footer{margin-top:40px;font-size:12px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media(max-width:860px){
  .hero{grid-template-columns:1fr}
  .now{padding:28px 0;border-right:0;border-bottom:1px solid var(--rule)}
  .scatter{padding:28px 0 20px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .strip>div{border-bottom:1px solid var(--rule);padding-left:0!important}
  .two{grid-template-columns:1fr;gap:12px}
  .num{font-size:72px}
  .pair{gap:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Orion Room<span>온습도 기록</span></div>
    <div class="fresh" id="fresh"><i></i><span>불러오는 중</span></div>
  </header>
  <div class="pick">
    <div class="pickL">
      <nav class="tabs" id="tabs"></nav>
      <div class="step" id="step" style="display:none"><button id="stPrev" aria-label="이전">‹</button><span id="stLbl"></span><button id="stNext" aria-label="다음">›</button></div>
    </div>
    <div class="pickers">
      <label id="pd">일<input type="date" id="inD"></label>
      <label id="pm">월<input type="month" id="inM"></label>
      <label id="py">연<select id="inY"></select></label>
    </div>
  </div>

  <section class="hero">
    <div class="now" id="now"></div>
    <div class="scatter">
      <h3>쾌적 구간</h3>
      <p id="scCap"></p>
      <div id="scatter"></div>
    </div>
  </section>

  <section class="sec">
    <div class="sec-h">
      <div><h3>추이</h3><p class="cap" id="trendCap"></p></div>
      <div class="legend"><span><i style="background:var(--t)"></i>온도 °C</span><span><i style="background:var(--h)"></i>습도 %</span><span id="lgBand"><i class="band" style="background:var(--sub)"></i>최소–최대</span><span id="lgDot"><i style="background:none;border:1.5px solid var(--sub);width:7px;height:7px;border-radius:50%"></i>실측</span></div>
    </div>
    <div id="trend"></div>
  </section>

  <div class="strip" id="strip"></div>

  <section class="sec">
    <div class="sec-h">
      <div><h3>시간대 히트맵</h3><p class="cap" id="hmCap"></p></div>
      <div class="seg" id="hmSeg"><button data-m="temp" class="on">온도</button><button data-m="hum">습도</button></div>
    </div>
    <div id="heat"></div>
  </section>

  <section class="sec">
    <div class="two">
      <div><h3 id="dailyT">일별 온도 범위</h3><p class="cap">막대는 최저–최고, 눈금은 평균</p><div id="daily"></div></div>
      <div><h3>하루 패턴</h3><p class="cap">시간대별 평균 (서울 시간)</p><div id="hourly"></div></div>
    </div>
  </section>

  <section class="sec">
    <h3 id="tblT">일별 요약</h3>
    <p class="cap" id="tblCap"></p>
    <div class="tbw" id="tbl"></div>
  </section>

  <footer><span>센서가 보고한 값만 기록합니다 · 선택한 기간의 모든 측정값 기준</span></footer>
</div>
<div id="tip"></div>

<script>
const $ = (s) => document.querySelector(s);
const KST = 9*3600e3, WD = ['일','월','화','수','목','금','토'];
const kstDate = (ms) => new Date(ms+KST).toISOString().slice(0,10);
const addDays = (d, n) => { const x = new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo-1+n, 1)).toISOString().slice(0,7); };
const mondayOf = (d) => addDays(d, -((new Date(d+'T00:00:00Z').getUTCDay()+6)%7));
const wd = (d) => WD[new Date(d+'T00:00:00Z').getUTCDay()];
const md2 = (d) => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
const TABS = [['24h','현재'],['today','오늘'],['yest','어제'],['week','이번 주'],['month','이번 달'],['year','올해'],['all','전체']];
const tabRange = (k) => { const t = kstDate(Date.now()); return k==='24h' ? '24h' : k==='today' ? 'd:'+t : k==='yest' ? 'd:'+addDays(t,-1) : k==='week' ? 'w:'+mondayOf(t) : k==='month' ? 'm:'+t.slice(0,7) : k==='year' ? 'y:'+t.slice(0,4) : 'all'; };
const rangeLabel = (r) => { const v = r.slice(2), thisYear = kstDate(Date.now()).slice(0,4);
  if (r === '24h') return '최근 24시간'; if (r === 'all') return '전체 기간'; if (r === '1h') return '최근 1시간'; if (r === '7d') return '최근 7일'; if (r === '30d') return '최근 30일';
  if (r[0]==='d') return `${v.slice(0,4)===thisYear ? '' : v.slice(0,4)+'년 '}${+v.slice(5,7)}월 ${+v.slice(8,10)}일 (${wd(v)})`;
  if (r[0]==='w') return `${md2(v)} – ${md2(addDays(v,6))} 주`;
  if (r[0]==='m') return `${v.slice(0,4)}년 ${+v.slice(5,7)}월`;
  return `${v}년`; };
const shiftRange = (r, n) => r[0]==='d' ? 'd:'+addDays(r.slice(2), n) : r[0]==='w' ? 'w:'+addDays(r.slice(2), 7*n) : r[0]==='m' ? 'm:'+addMonths(r.slice(2), n) : r[0]==='y' ? 'y:'+(+r.slice(2)+n) : r;
const startOfRange = (r) => r[0]==='m' ? r.slice(2)+'-01' : r[0]==='y' ? r.slice(2)+'-01-01' : r.slice(2);
const canStep = (r) => /^[dwmy]:/.test(r);
const isFutureStart = (r) => startOfRange(r) > kstDate(Date.now());
let range = (()=>{try{const r = localStorage.range; return /^(24h|all|[dw]:\d{4}-\d{2}-\d{2}|m:\d{4}-\d{2}|y:\d{4})$/.test(r) ? r : null}catch{return null}})() || '24h', hmMetric = 'temp', heatData = [];
const n1 = (v) => v == null ? '–' : v.toFixed(1);
const n0 = (v) => v == null ? '–' : Math.round(v);
const hhmm = (ts) => new Date(ts).toLocaleTimeString('ko',{hour:'2-digit',minute:'2-digit',hour12:false});
const md = (ts) => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
const when = (ts) => ts ? `${md(ts)} ${hhmm(ts)}` : '';
const tip = $('#tip');
const showTip = (e, h) => { tip.innerHTML = h; tip.style.opacity = 1; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px'; tip.style.top = e.clientY + 16 + 'px'; };
const hideTip = () => tip.style.opacity = 0;
const get = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

const dew = (t, h) => { const g = Math.log(Math.max(h,1)/100) + 17.62*t/(243.12+t); return 243.12*g/(17.62-g); };
function feel(t, h){
  const ts = t < 19 ? '쌀쌀하고' : t < 22 ? '약간 서늘하고' : t <= 27 ? '적정 온도에' : t <= 29 ? '조금 덥고' : '더운 편이고';
  const hs = h < 30 ? '매우 건조합니다' : h < 40 ? '조금 건조합니다' : h <= 55 ? '습도도 쾌적합니다' : h <= 65 ? '조금 습합니다' : '습합니다';
  return `${ts} ${hs}.`;
}

/* ---------- 매끄러운 곡선: 단조 3차 보간(Fritsch–Carlson). 1차 미분이 연속이고 overshoot 없음 ---------- */
function smooth(pts, move = true){
  const n = pts.length; if(n === 0) return '';
  const f = v => v.toFixed(1);
  let d = (move ? 'M' : 'L') + f(pts[0][0]) + ',' + f(pts[0][1]);
  if(n === 1) return d;
  if(n === 2) return d + 'L' + f(pts[1][0]) + ',' + f(pts[1][1]);
  const h = [], sl = [];
  for(let i = 0; i < n-1; i++){ h[i] = pts[i+1][0]-pts[i][0]; sl[i] = h[i] ? (pts[i+1][1]-pts[i][1])/h[i] : 0; }
  const m = new Array(n);
  m[0] = sl[0]; m[n-1] = sl[n-2];
  for(let i = 1; i < n-1; i++) m[i] = sl[i-1]*sl[i] <= 0 ? 0 : 2/(1/sl[i-1] + 1/sl[i]);
  for(let i = 0; i < n-1; i++){
    if(sl[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    const a = m[i]/sl[i], b = m[i+1]/sl[i], r = a*a + b*b;
    if(r > 9){ const t = 3/Math.sqrt(r); m[i] = t*a*sl[i]; m[i+1] = t*b*sl[i]; }
  }
  for(let i = 0; i < n-1; i++){
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i+1][0], y1 = pts[i+1][1];
    d += `C${f(x0+h[i]/3)},${f(y0+m[i]*h[i]/3)} ${f(x1-h[i]/3)},${f(y1-m[i+1]*h[i]/3)} ${f(x1)},${f(y1)}`;
  }
  return d;
}

/* ---------- scatter: 온도 × 습도 ---------- */
function scatter(el, pts, cur, marks){
  const W = 460, H = 330, m = {l:38,r:10,t:8,b:30}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const [x0,x1,y0,y1] = [14,34,20,80];
  const X = t => m.l + (t-x0)/(x1-x0)*iw, Y = h => m.t + ih - (h-y0)/(y1-y0)*ih;
  let g = '';
  for(let t=x0;t<=x1;t+=4) g += `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${m.t+ih}"/><text x="${X(t)}" y="${H-10}" text-anchor="middle">${t}°</text>`;
  for(let h=y0;h<=y1;h+=20) g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(h)}" y2="${Y(h)}"/><text x="${m.l-8}" y="${Y(h)+4}" text-anchor="end">${h}%</text>`;
  g += `<rect x="${X(22)}" y="${Y(55)}" width="${X(27)-X(22)}" height="${Y(40)-Y(55)}" fill="var(--comfort)" stroke="var(--ok)" stroke-opacity=".5" stroke-dasharray="3 3"/>`;
  const clamp = (v,a,b) => Math.min(b,Math.max(a,v));
  const p = (marks && marks.length ? marks : pts).filter(q => q.temp != null && q.hum != null);
  p.forEach((q,i) => { const a = .12 + .5*i/Math.max(1,p.length-1);
    g += `<circle cx="${X(clamp(q.temp,x0,x1))}" cy="${Y(clamp(q.hum,y0,y1))}" r="2.6" fill="var(--ink)" fill-opacity="${a}"/>`; });
  if(cur && cur.temp != null){
    const cx = X(clamp(cur.temp,x0,x1)), cy = Y(clamp(cur.hum,y0,y1));
    g += `<circle cx="${cx}" cy="${cy}" r="11" fill="none" stroke="var(--ink)" stroke-opacity=".25"/><circle cx="${cx}" cy="${cy}" r="5.5" fill="var(--ink)"/>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------- 추이 (온도/습도 2단) ---------- */
function trend(el, pts, marks){
  if(pts.length < 2){ el.innerHTML = '<div class="empty">아직 그릴 만큼의 데이터가 없습니다. 수집이 시작되면 이곳에 나타납니다.</div>'; return; }
  const W = Math.max(320, el.clientWidth || 1112), m = {l:44,r:8}, iw = W-m.l-m.r;
  const panels = [{k:'temp',lo:'tmin',hi:'tmax',c:'var(--t)',s:'var(--t-soft)',y:6,h:170,u:'°'},{k:'hum',lo:'hmin',hi:'hmax',c:'var(--h)',s:'var(--h-soft)',y:214,h:140,u:'%'}];
  const H = 214+140+28, t0 = pts[0].ts, t1 = pts.at(-1).ts, span = t1-t0 || 1;
  const X = p => m.l + (p.ts-t0)/span*iw;
  let g = '';
  panels.forEach(P => {
    const v = pts.flatMap(p => [p[P.lo],p[P.hi]]).filter(x => x!=null);
    let lo = Math.min(...v), hi = Math.max(...v); const pad = Math.max((hi-lo)*.2,1); lo = Math.floor(lo-pad); hi = Math.ceil(hi+pad);
    P.Y = val => P.y + P.h - (val-lo)/(hi-lo)*P.h;
    const ticks = 4;
    for(let i=0;i<=ticks;i++){ const yy = P.y + P.h*i/ticks; g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${Math.round(hi-(hi-lo)*i/ticks)}${P.u}</text>`; }
    const v2 = pts.filter(p => p[P.k]!=null);
    // 실측 지점이 보이는 범위(≤300회)에서는 실측값을 지나는 매끄러운 곡선으로, 그보다 촘촘한 범위에서는 보간 격자를 이어서 그린다
    const real = (marks || []).filter(q => q[P.k] != null && q.ts > t0 && q.ts < t1);
    const src = real.length ? [v2[0], ...real, v2.at(-1)] : v2;
    const line = smooth(src.map(p => [X(p), P.Y(p[P.k])]));
    let band = '';
    if(!real.length){ const up = v2.map(p => [X(p), P.Y(p[P.hi])]), dn = v2.map(p => [X(p), P.Y(p[P.lo])]).reverse(); band = `<path d="${smooth(up) + smooth(dn, false)}Z" fill="${P.s}"/>`; }
    g += `${band}<path d="${line}" fill="none" stroke="${P.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    (marks || []).filter(q => q[P.k] != null && q.ts >= t0 && q.ts <= t1).forEach(q => { g += `<circle cx="${(m.l+(q.ts-t0)/span*iw).toFixed(1)}" cy="${P.Y(q[P.k]).toFixed(1)}" r="3" fill="var(--bg)" stroke="${P.c}" stroke-width="1.5"/>`; });
  });
  const fmt = ts => span < 2*864e5 ? hhmm(ts) : md(ts);
  const nt = W < 600 ? 3 : 6; for(let i=0;i<=nt;i++){ const ts = t0+span*i/nt; g += `<text x="${m.l+iw*i/nt}" y="${H-4}" text-anchor="${i==0?'start':i==nt?'end':'middle'}">${fmt(ts)}</text>`; }
  g += `<g id="cur" opacity="0"><line y1="6" y2="${214+140}" stroke="var(--ink)" stroke-opacity=".4"/><circle id="d1" r="4" fill="var(--t)"/><circle id="d2" r="4" fill="var(--h)"/></g><rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H-20}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, cur = svg.querySelector('#cur'), hit = svg.querySelector('#hit');
  hit.onmousemove = e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W;
    let b = pts[0]; for(const p of pts) if(Math.abs(X(p)-px) < Math.abs(X(b)-px)) b = p;
    cur.setAttribute('opacity',1); cur.firstChild.setAttribute('x1',X(b)); cur.firstChild.setAttribute('x2',X(b));
    const d1 = cur.querySelector('#d1'), d2 = cur.querySelector('#d2');
    d1.setAttribute('cx',X(b)); d1.setAttribute('cy',panels[0].Y(b.temp)); d2.setAttribute('cx',X(b)); d2.setAttribute('cy',panels[1].Y(b.hum));
    showTip(e, `<b>${when(b.ts)}</b><br>온도 ${n1(b.temp)}° <span style="opacity:.6">(${n1(b.tmin)}–${n1(b.tmax)})</span><br>습도 ${n0(b.hum)}% <span style="opacity:.6">(${n0(b.hmin)}–${n0(b.hmax)})</span>`);
  };
  hit.onmouseleave = () => { cur.setAttribute('opacity',0); hideTip(); };
}

/* ---------- 히트맵 ---------- */
const BINS = {
  temp: { u:'°', bins:[[18,'#2f5d9e','<18'],[20,'#5b8fc2','18–20'],[22,'#93bfd8','20–22'],[24,'#b9d9a8','22–24'],[26,'#e8e08a','24–26'],[27,'#f6d36b','26–27'],[28,'#f0a94f','27–28'],[29,'#e6794a','28–29'],[30,'#cf4a40','29–30'],[Infinity,'#8f2a3c','30+']] },
  hum:  { u:'%', bins:[[30,'#b9772f','<30'],[35,'#d9a65b','30–35'],[40,'#ecd596','35–40'],[47,'#bfe0cf','40–47'],[55,'#82c4ad','47–55'],[65,'#6aa0d4','55–65'],[Infinity,'#3d6bb0','65+']] },
};
const lum = (hex) => { const n = parseInt(hex.slice(1),16), c = [n>>16&255, n>>8&255, n&255].map(v => { v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
function heat(el, rows, metric){
  if(!rows.length){ el.innerHTML = '<div class="empty">이 기간에는 표시할 기록이 없습니다.</div>'; return; }
  const B = BINS[metric], monthly = rows[0].d.length === 7;
  const days = [...new Set(rows.map(r => r.d))].sort(); const map = {};
  rows.forEach(r => map[r.d+'|'+r.h] = r[metric]);
  const W = Math.max(320, el.clientWidth || 1112), m = {l:monthly ? 40 : 66, t:20, b:4}, cw = (W-m.l)/24, ch = 28, H = m.t + days.length*ch + m.b, nums = cw >= 26;
  const bin = v => B.bins.find(b => v < b[0]);
  let g = '';
  for(let h=0;h<24;h+=(W<600?6:3)) g += `<text x="${m.l+h*cw+cw/2}" y="11" text-anchor="middle">${h}시</text>`;
  days.forEach((d,i) => {
    const label = monthly ? `${+d.slice(5)}월` : `${md2(d)} ${wd(d)}`;
    g += `<text x="${m.l-8}" y="${m.t+i*ch+ch/2+4}" text-anchor="end">${label}</text>`;
    for(let h=0;h<24;h++){ const v = map[d+'|'+h], x = m.l+h*cw+1, y = m.t+i*ch+1;
      if(v==null){ g += `<rect x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="2" fill="var(--rule)" fill-opacity=".35"/>`; continue; }
      const c = bin(v)[1];
      g += `<rect data-d="${d}" data-h="${h}" data-v="${v}" x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="2" fill="${c}"/>`;
      if(nums) g += `<text x="${x+(cw-2)/2}" y="${y+(ch-2)/2+4}" text-anchor="middle" style="fill:${lum(c) > .42 ? '#1d1c1a' : '#fff'};font-size:11px;font-weight:600;pointer-events:none">${metric==='temp' ? v.toFixed(0) : Math.round(v)}</text>`; }
  });
  const legend = B.bins.map(b => `<span><i style="background:${b[1]}"></i>${b[2]}${B.u}</span>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend2">${legend}</div>`;
  el.querySelectorAll('rect[data-v]').forEach(r => { const d = r.dataset.d; r.onmousemove = e => showTip(e, `<b>${monthly ? `${+d.slice(5)}월 평균` : `${md2(d)} (${wd(d)})`} ${r.dataset.h}시</b><br>${metric==='temp' ? n1(+r.dataset.v) : n0(+r.dataset.v)}${B.u}`); r.onmouseleave = hideTip; });
}

/* ---------- 일별 범위 ---------- */
function daily(el, rows, monthly){
  rows = rows.slice(monthly ? -24 : -31);
  if(!rows.length){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = 520, H = 240, m = {l:36,r:4,t:8,b:26}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  let lo = Math.floor(Math.min(...rows.map(r => r.tmin))-1), hi = Math.ceil(Math.max(...rows.map(r => r.tmax))+1);
  const Y = v => m.t+ih-(v-lo)/(hi-lo)*ih, bw = iw/rows.length; let g = '';
  for(let i=0;i<=4;i++){ const yy = m.t+ih*i/4; g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${Math.round(hi-(hi-lo)*i/4)}°</text>`; }
  const step = Math.ceil(rows.length/6);
  rows.forEach((r,i) => { const x = m.l+i*bw+bw*.25, w = bw*.5;
    g += `<rect data-i="${i}" x="${x}" y="${Y(r.tmax)}" width="${w}" height="${Math.max(2,Y(r.tmin)-Y(r.tmax))}" fill="var(--t)" fill-opacity=".28"/><line x1="${x-2}" x2="${x+w+2}" y1="${Y(r.temp)}" y2="${Y(r.temp)}" stroke="var(--t)" stroke-width="2"/>`;
    if(i%step===0) g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${monthly ? (rows.length > 12 ? r.d.slice(2).replace('-','.') : +r.d.slice(5)+'월') : r.d.slice(5).replace('-','/')}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelectorAll('rect[data-i]').forEach(r => { const d = rows[r.dataset.i]; r.onmousemove = e => showTip(e, `<b>${monthly ? d.d.replace('-','.') : d.d.slice(5)}</b><br>평균 ${n1(d.temp)}° · ${n1(d.tmin)}–${n1(d.tmax)}°<br>습도 ${n0(d.hum)}%`); r.onmouseleave = hideTip; });
}

/* ---------- 하루 패턴 ---------- */
function hourly(el, rows){
  if(rows.length < 2){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = 520, H = 240, m = {l:36,r:36,t:8,b:26}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const ext = k => { const v = rows.map(r => r[k]); const lo = Math.min(...v), hi = Math.max(...v), p = Math.max((hi-lo)*.3,1); return [Math.floor(lo-p),Math.ceil(hi+p)]; };
  const [tl,th] = ext('temp'), [hl,hh] = ext('hum');
  const X = r => m.l + r.h/23*iw, YT = v => m.t+ih-(v-tl)/(th-tl)*ih, YH = v => m.t+ih-(v-hl)/(hh-hl)*ih;
  let g = '';
  for(let i=0;i<=4;i++){ const yy = m.t+ih*i/4; g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${Math.round(th-(th-tl)*i/4)}°</text><text x="${W-m.r+6}" y="${yy+4}">${Math.round(hh-(hh-hl)*i/4)}%</text>`; }
  for(let h=0;h<24;h+=6) g += `<text x="${m.l+h/23*iw}" y="${H-8}" text-anchor="middle">${h}시</text>`;
  const L = (k,Y) => smooth(rows.map(r => [X(r), Y(r[k])]));
  g += `<path d="${L('hum',YH)}" fill="none" stroke="var(--h)" stroke-width="1.8"/><path d="${L('temp',YT)}" fill="none" stroke="var(--t)" stroke-width="1.8"/>`;
  g += `<line id="vl" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink)" stroke-opacity=".35" opacity="0"/><rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, vl = svg.querySelector('#vl');
  svg.querySelector('#hit').onmousemove = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W;
    let b = rows[0]; for(const q of rows) if(Math.abs(X(q)-px) < Math.abs(X(b)-px)) b = q;
    vl.setAttribute('x1',X(b)); vl.setAttribute('x2',X(b)); vl.setAttribute('opacity',1);
    showTip(e, `<b>${b.h}시</b><br>온도 ${n1(b.temp)}°<br>습도 ${n0(b.hum)}%`); };
  svg.querySelector('#hit').onmouseleave = () => { vl.setAttribute('opacity',0); hideTip(); };
}

/* ---------- 히어로 / 요약 ---------- */
function renderNow(cur, ref, st){
  const o = st.overall, now = range === '24h';
  const big = (t, h, tl, hl) => `<div class="pair">
      <div><div class="num t mono">${n1(t)}<small>°C</small></div><div class="lbl"><b>${tl[0]}</b>${tl[1]}</div></div>
      <div><div class="num h mono">${n0(h)}<small>%</small></div><div class="lbl"><b>${hl[0]}</b>${hl[1]}</div></div></div>`;
  const tm = (ts) => !ts ? '' : range[0]==='d' ? hhmm(ts) : when(ts);
  const fact = (k, v, u, sub) => `<div><span class="k">${k}</span><b>${v}<em>${u}</em></b>${sub ? `<small>${sub}</small>` : ''}</div>`;
  if(now && !cur){ $('#now').innerHTML = big(null,null,['온도',''],['습도','']).replace(/class="num (t|h) mono"/g,'class="num $1 mono" style="color:var(--faint)"') + `<p class="verdict" style="color:var(--sub)">첫 측정값을 기다리고 있습니다. 센서 연결이 끝나면 1분 안에 이곳에 표시됩니다.</p>`; return; }
  if(!now && (o.temp == null)){ $('#now').innerHTML = `<div class="k">${rangeLabel(range)}</div><p class="verdict" style="margin-top:14px;color:var(--sub)">이 기간에는 측정 기록이 없습니다.</p>`; return; }
  const dp = now ? dew(cur.temp, cur.hum) : o.dew;
  if(now){
    const dT = ref && ref.temp != null ? cur.temp - ref.temp : null, dH = ref && ref.hum != null ? cur.hum - ref.hum : null;
    const gap = ref ? (() => { const m = (cur.ts-ref.ts)/60000; return m < 60 ? `${Math.max(1,Math.round(m))}분` : m < 1440 ? `${Math.round(m/60)}시간` : `${Math.round(m/1440)}일`; })() : '';
    const dl = (v,u) => v == null ? '' : `<span class="delta">${Math.abs(v)<.05?'–':(v>0?'▲':'▼')} ${Math.abs(v).toFixed(u==='°'?1:0)}${u} <span style="color:var(--faint)">직전 측정(${gap} 전) 대비</span></span>`;
    $('#now').innerHTML = `<div class="k" style="margin-bottom:10px">지금 · 마지막 측정 ${md(cur.ts)} ${hhmm(cur.ts)}</div>` + big(cur.temp, cur.hum, ['온도', dl(dT,'°')], ['습도', dl(dH,'%')]) + `
      <p class="verdict">${feel(cur.temp, cur.hum)}</p>
      <div class="facts">
        ${fact('24시간 최저 온도', n1(o.tmin), '°C', tm(o.tmin_ts))}${fact('24시간 최고 온도', n1(o.tmax), '°C', tm(o.tmax_ts))}${fact('쾌적 시간 비율', o.comfort == null ? '–' : n0(o.comfort), '%', '')}
        ${fact('24시간 최저 습도', n0(o.hmin), '%', tm(o.hmin_ts))}${fact('24시간 최고 습도', n0(o.hmax), '%', tm(o.hmax_ts))}${fact('이슬점', n1(dp), '°C', '')}
      </div>`;
    return;
  }
  $('#now').innerHTML = `<div class="k" style="margin-bottom:10px">${rangeLabel(range)} · 구간 평균</div>` + big(o.temp, o.hum, ['평균 온도', ''], ['평균 습도', '']) + `
      <p class="verdict">구간 평균은 ${feel(o.temp, o.hum)}</p>
      <div class="facts">
        ${fact('최저 온도', n1(o.tmin), '°C', tm(o.tmin_ts))}${fact('최고 온도', n1(o.tmax), '°C', tm(o.tmax_ts))}${fact('쾌적 시간 비율', o.comfort == null ? '–' : n0(o.comfort), '%', '')}
        ${fact('최저 습도', n0(o.hmin), '%', tm(o.hmin_ts))}${fact('최고 습도', n0(o.hmax), '%', tm(o.hmax_ts))}${fact('평균 이슬점', n1(dp), '°C', '')}
      </div>`;
}

/* ---------- 일/월 요약 표 ---------- */
function table(el, rows, monthly){
  if(!rows.length){ el.innerHTML = '<div class="empty">이 기간에는 기록이 없습니다.</div>'; return; }
  const lo = Math.min(...rows.map(r => r.tmin)), hi = Math.max(...rows.map(r => r.tmax));
  const lab = d => monthly ? `${d.slice(0,4)}년 ${+d.slice(5)}월` : `${md2(d)} (${wd(d)})`;
  el.innerHTML = `<table class="tb"><thead><tr><th>${monthly?'월':'날짜'}</th><th>최저 온도</th><th>평균 온도</th><th>최고 온도</th><th>평균 습도</th><th>습도 범위</th></tr></thead><tbody>${
    [...rows].reverse().map(r => `<tr><td>${lab(r.d)}</td><td class="t${r.tmin===lo?' ex':''}">${n1(r.tmin)}°</td><td class="t">${n1(r.temp)}°</td><td class="t${r.tmax===hi?' ex':''}">${n1(r.tmax)}°</td><td class="h">${n0(r.hum)}%</td><td>${n0(r.hmin)}–${n0(r.hmax)}%</td></tr>`).join('')}</tbody></table>`;
}

function renderStrip(st){

    c('최저 온도', n1(o.tmin)+'°', when(o.tmin_ts)),
    c('평균 습도', n0(o.hum)+'%', o.hmin == null ? '' : `${n0(o.hmin)}–${n0(o.hmax)}% 범위`),

async function load(){
  try {
    const [curR, hist, st] = await Promise.all([get('/api/current'), get(`/api/history?range=${range}`), get(`/api/stats?range=${range}`)]);
    const cur = curR.devices[0] || null;
    renderNow(cur, cur && cur.prev, st);
    const now = range === '24h', o = st.overall;
    $('#scCap').textContent = '초록 영역이 22–27°C · 습도 40–55%. 점은 선택 기간의 실측 흐름, 큰 점이 ' + (now ? '현재.' : '구간 평균.');
    scatter($('#scatter'), hist.points, now ? cur : (o.temp == null ? null : {temp:o.temp, hum:o.hum}), hist.marks);
    $('#trendCap').textContent = hist.points.length ? `${rangeLabel(range)} · 실측 ${hist.samples.toLocaleString()}회 · 측정값 사이는 직선으로 이어 계산` : '';
    trend($('#trend'), hist.points, hist.marks);
    const dense = !(hist.marks && hist.marks.length); $('#lgBand').style.display = dense ? '' : 'none'; $('#lgDot').style.display = dense ? 'none' : '';
    renderStrip(st);
    const useMonthly = (range === 'all' || range[0] === 'y') && st.monthly.length > 1;
    $('#dailyT').textContent = useMonthly ? '월별 온도 범위' : '일별 온도 범위';
    daily($('#daily'), useMonthly ? st.monthly : st.daily, useMonthly);
    $('#tblT').textContent = useMonthly ? '월별 요약' : '일별 요약';
    $('#tblCap').textContent = '최저·최고는 측정값과 보간값을 모두 포함한 해당 기간의 극값이며, 굵게 표시한 칸이 전체 기간의 가장 낮은/높은 날입니다.';
    table($('#tbl'), useMonthly ? st.monthly : st.daily, useMonthly);
    hourly($('#hourly'), st.hourly);
    // 센서가 실제로 보고한 시각만 표시 (화면을 불러온 시각이 아님)
    const age = cur ? (Date.now()-cur.ts)/60000 : null, f = $('#fresh');
    f.className = 'fresh' + (age == null ? '' : age < 120 ? ' live' : ' stale');
    const ago = age == null ? '' : age < 1 ? '1분 미만 전' : age < 60 ? `${Math.round(age)}분 전` : age < 1440 ? `${Math.floor(age/60)}시간 ${Math.round(age%60)}분 전` : `${Math.floor(age/1440)}일 전`;
    f.lastChild.textContent = cur ? `마지막 측정 ${md(cur.ts)} ${hhmm(cur.ts)} · ${ago}` : '수집 대기 중';
  } catch(e){ $('#fresh').lastChild.textContent = '연결 오류'; }
}
async function loadHeat(){

function setRange(r){ range = r; try{localStorage.range = r}catch{} syncPick(); load(); loadHeat(); }

  const st = $('#step'); st.style.display = canStep(range) ? '' : 'none';

$('#tabs').innerHTML = TABS.map(([k,l]) => `<button data-k="${k}">${l}</button>`).join('');
$('#tabs').onclick = e => { const k = e.target.dataset.k; if(k) setRange(tabRange(k)); };

$('#inY').onchange = e => setRange('y:'+e.target.value);
(async () => {
  let y0 = new Date().getFullYear(), y1 = y0, lo = '', hi = '';
  try { const b = await get('/api/bounds'); if (b.first) { y0 = new Date(b.first).getFullYear(); y1 = Math.max(y1, new Date(b.last).getFullYear()); lo = new Date(b.first+9*3600e3).toISOString().slice(0,10); hi = new Date(b.last+9*3600e3).toISOString().slice(0,10); } } catch {}
  $('#inY').innerHTML = Array.from({length:y1-y0+1}, (_,i) => y1-i).map(y => `<option value="${y}">${y}년</option>`).join('');
  if (lo) { $('#inD').min = lo; $('#inD').max = hi; $('#inM').min = lo.slice(0,7); $('#inM').max = hi.slice(0,7); }
  const today = new Date(Date.now()+9*3600e3).toISOString();
  if (!range.includes(':')) { $('#inD').value = today.slice(0,10); $('#inM').value = today.slice(0,7); $('#inY').value = today.slice(0,4); }
  syncPick();
})();
$('#hmSeg').onclick = e => { const m = e.target.dataset.m; if(!m) return; hmMetric = m; document.querySelectorAll('#hmSeg button').forEach(b => b.classList.toggle('on', b.dataset.m===m)); heat($('#heat'), heatData, hmMetric); };
syncPick();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { load(); heat($('#heat'), heatData, hmMetric); }, 200); });
load(); loadHeat(); setInterval(load, 30000); setInterval(loadHeat, 300000);
</script>
