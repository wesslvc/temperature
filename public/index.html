<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion Room — 온습도</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#f3f0e9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="온습도">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f3f0e9; --panel:#faf8f3; --ink:#1d1c1a; --sub:#77736a; --faint:#a9a498; --rule:#dcd7ca;
  --t:#c2410c; --h:#1e6a8c; --ok:#4d7c3a;
  --d:#7b5ea7; --d-soft:rgba(123,94,167,.13);
  --t-soft:rgba(194,65,12,.13); --h-soft:rgba(30,106,140,.13); --comfort:rgba(77,124,58,.12);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121211; --panel:#191917; --ink:#ece9e1; --sub:#928e83; --faint:#5c5951; --rule:#2c2b27;
  --t:#f08a52; --h:#6cb4d6; --ok:#98c27c;
  --d:#b9a1e6; --d-soft:rgba(185,161,230,.16);
  --t-soft:rgba(240,138,82,.16); --h-soft:rgba(108,180,214,.16); --comfort:rgba(152,194,124,.1);
}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin:0 auto;padding:28px 24px 72px}
.mono{font-variant-numeric:tabular-nums}
.k{font-size:12px;letter-spacing:.04em;color:var(--sub)}

/* header */
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.brand{font-weight:700;font-size:15px;letter-spacing:.01em}
.brand span{color:var(--sub);font-weight:400;margin-left:10px}
.meta{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}
.fresh{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:7px}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.fresh.live i{background:var(--ok)}
.fresh.stale i{background:#d99a2b}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{white-space:nowrap;border:0;background:none;color:var(--sub);font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);font-weight:600;border-color:var(--ink)}

/* period picker */
.pick{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.pickers{display:flex;gap:6px;flex-wrap:wrap}
.pickers label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:3px 8px;border:1px solid var(--rule);border-radius:3px}
.pickers label.on{border-color:var(--ink);color:var(--ink)}
.pickers select{max-width:9.5em;cursor:pointer}
.pickers input,.pickers select{border:0;background:none;font:inherit;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;outline:none;color-scheme:light dark}

/* quick range + stepper */
.pickL{display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:2px;font-size:13px;font-variant-numeric:tabular-nums}
.step button{border:1px solid var(--rule);background:none;color:var(--ink);width:26px;height:26px;border-radius:3px;font:inherit;cursor:pointer;line-height:1}
.step button:hover:not(:disabled){border-color:var(--ink)}
.step button:disabled{color:var(--faint);cursor:default}
.step span{min-width:9.5em;text-align:center;font-weight:600}
.facts small{display:block;font-size:12px;color:var(--sub);margin-top:1px;font-variant-numeric:tabular-nums}
.spec{position:relative;margin:16px 0 0 auto;max-width:440px;padding:0 14px}
.specbar{height:10px;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.spect{position:relative;height:18px;margin-top:4px;font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums}
.spect span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.spect span:first-child{transform:none}.spect span:last-child{transform:translateX(-100%)}
.specu{position:absolute;right:0;top:-2px;font-size:11px;color:var(--sub)}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:14px;height:10px;border-radius:2px;display:inline-block}
table.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tb th{font-weight:500;font-size:12px;color:var(--sub);text-align:right;padding:8px 10px;border-bottom:1px solid var(--ink)}
table.tb td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--rule)}
table.tb th:first-child,table.tb td:first-child{text-align:left;padding-left:0}
table.tb td.ex{font-weight:700}
table.tb td.t{color:var(--t)} table.tb td.h{color:var(--h)}
.tbw{overflow-x:auto}
.chip{display:inline-block;min-width:3.6em;text-align:center;padding:2px 8px;border-radius:999px;font-weight:500}
.chip.ex{font-weight:700;box-shadow:inset 0 0 0 1.5px currentColor}

/* period tiles */
.cmpbar{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:14px 0 12px;font-size:12px;color:var(--sub)}
.cmpbar button{border:1px solid var(--rule);background:none;color:var(--sub);font:inherit;font-size:12px;padding:3px 10px;border-radius:3px;cursor:pointer}
.cmpbar button.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.tile{padding:16px 18px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.tile .v{font-size:36px;font-weight:700;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .v em{font-style:normal;font-size:15px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:0}
.tile.t .v{color:var(--t)} .tile.h .v{color:var(--h)}
.tile small{display:block;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tile .dl{margin-top:8px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tile .dl i{font-style:normal;font-weight:400;color:var(--faint);margin-left:4px}

/* pills */
.pick2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule)}
.pick2 .k{margin-right:6px}
.pick2[hidden]{display:none}
.pill{border:1px solid var(--rule);background:none;color:var(--sub);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer;display:inline-flex;align-items:center}
.pill select{border:0;background:none;font:inherit;color:inherit;outline:none;cursor:pointer;max-width:9.5em;color-scheme:light dark}
.pill.on{border-color:var(--ink);color:var(--ink);font-weight:600}
button.pill.on{background:var(--ink);color:var(--bg)}
.pill.dis{opacity:.4;pointer-events:none}
.hh{font-size:13px;font-weight:600;margin:14px 0 4px}
.sw{display:block;height:5px;border-radius:3px;margin-top:10px}
/* click detail */
.detail{margin-top:14px;border-top:1px solid var(--ink);padding-top:12px}
.detail .dh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.detail .dh b{color:var(--ink);font-size:15px}
.detail .dh button{border:0;background:none;color:var(--sub);cursor:pointer;font:inherit;font-size:12px;text-decoration:underline}
.detail .pair3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px}
.detail .pc{min-width:0}.detail .num{font-size:56px}.detail .lbl{display:flex;flex-direction:column;gap:2px;align-items:flex-start;margin-top:10px}.detail .delta{font-size:13px;font-weight:600}
.detail .dg>div{padding:10px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.detail .dg b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.detail .dg small{color:var(--sub);font-size:12px}
.tb tr.go{cursor:pointer} .tb tr.go:hover td{background:var(--rule)}
/* rates + three-up */
.rates{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px;margin-top:22px;padding-top:14px;border-top:1px solid var(--rule)}
.rates:empty{display:none}
.rate b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.rate .bar2{height:4px;border-radius:2px;background:var(--rule);margin-top:6px;overflow:hidden}
.rate .bar2 i{display:block;height:100%;background:var(--ok)}
.rate small{display:block;font-size:12px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:860px){.three{grid-template-columns:1fr;gap:12px}}
@media(max-width:520px){.rates{gap:0 10px}.rate b{font-size:18px}.rate small{font-size:11px}}
@media(max-width:860px){.three svg{max-height:260px}.scatter svg{max-height:340px}}
/* declutter: section tabs, panels, matrix */
.panel{display:none;padding-top:22px}.panel.on{display:block}
.secnav{display:flex;gap:4px;margin-top:34px;border-bottom:1px solid var(--ink)}
.secnav button{border:0;background:none;font:inherit;font-size:15px;color:var(--sub);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.secnav button.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.pick{justify-content:space-between}
#pToggle{font-size:12px}
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);border-top:1px solid var(--rule);margin-top:6px}
.mx>div{padding:12px 14px 10px 0;min-width:0}
.mx .mh{font-size:12px;color:var(--sub);padding-top:10px;padding-bottom:0}
.mx .ml{display:flex;flex-direction:column;justify-content:center;font-size:13px;font-weight:600;padding-right:18px;white-space:nowrap}
.mx .ml small{font-weight:400;color:var(--sub);font-size:11px}
.mx .mc b{display:block;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;border-bottom:3px solid;padding-bottom:4px}
.mx .mc b em{font-style:normal;font-size:13px;font-weight:500;color:var(--sub);margin-left:2px;letter-spacing:0}
.mx .mc small{display:block;font-size:11px;color:var(--sub);margin-top:4px;font-variant-numeric:tabular-nums}
.mx .mc .dl{font-size:12px;font-weight:600;margin-top:2px}
.mxh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
@media(max-width:520px){.mx .mc b{font-size:21px}.mx .ml small{display:none}.mx>div{padding-right:8px}}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border-bottom:1px solid var(--rule)}
.now{padding:34px 40px 30px 0;border-right:1px solid var(--rule)}
.pair{display:flex;gap:56px;flex-wrap:wrap}
.num{font-size:88px;font-weight:600;letter-spacing:-.05em;line-height:.95;display:flex;align-items:flex-start}
.num small{font-size:26px;font-weight:500;letter-spacing:0;color:var(--sub);margin:8px 0 0 4px}
.num.t{color:var(--t)} .num.h{color:var(--h)}
.lbl{display:flex;gap:10px;align-items:baseline;margin-top:12px;font-size:13px;color:var(--sub)}
.lbl b{color:var(--ink);font-weight:700;font-size:14px}
.delta{font-variant-numeric:tabular-nums}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;padding-top:18px;border-top:1px solid var(--rule)}
.facts div b{display:block;font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.facts div b em{font-style:normal;font-size:13px;color:var(--sub);font-weight:400;margin-left:2px}
.verdict{margin-top:22px;font-size:15px;max-width:34em}
.scatter{padding:34px 0 24px 36px}
.scatter h3,.sec h3{font-size:13px;font-weight:600;letter-spacing:.01em;margin-bottom:2px}
.scatter p,.sec p.cap{font-size:12px;color:var(--sub);margin-bottom:12px}

/* sections */
.sec{padding:36px 0 8px;border-bottom:1px solid var(--rule)}
.sec:last-of-type{border:0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:8px;opacity:.5}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--sub);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.gl{stroke:var(--rule);stroke-width:1}
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:36px 0 0}
.strip>div{padding:18px 18px 18px 0;border-right:1px solid var(--rule);padding-left:18px}
.strip>div:first-child{padding-left:0}.strip>div:last-child{border:0}
.strip b{display:block;font-size:26px;font-weight:700;letter-spacing:-.025em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.strip small{font-size:12px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:56px}
.seg{display:inline-flex;gap:14px;font-size:12px}
.seg button{border:0;background:none;font:inherit;color:var(--sub);cursor:pointer;padding:0;border-bottom:1px solid transparent}
.seg button.on{color:var(--ink);border-color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;font-size:12px;line-height:1.5;opacity:0;z-index:9;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{padding:48px 0;color:var(--sub);font-size:13px}
footer{margin-top:40px;font-size:12px;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media(max-width:860px){
  .hero{grid-template-columns:1fr}
  .now{padding:28px 0;border-right:0;border-bottom:1px solid var(--rule)}
  .scatter{padding:28px 0 20px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .strip>div{border-bottom:1px solid var(--rule);padding-left:0!important}
  .two{grid-template-columns:1fr;gap:12px}
  .num{font-size:72px}
  .detail .pair3{gap:10px}.detail .num{font-size:30px;letter-spacing:-.04em}.detail .num small{font-size:12px;margin:3px 0 0 2px}.detail .delta{font-size:12px}
  .tile{padding:12px 12px 10px}.tile .v{font-size:26px}.tile .v em{font-size:12px}
  .pair{gap:36px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Orion Room<span>온습도 기록</span></div>
    <div class="fresh" id="fresh"><i></i><span>불러오는 중</span></div>
  </header>
  <div class="pick">
    <div class="pickL">
      <nav class="tabs" id="tabs"></nav>
      <div class="step" id="step" style="display:none"><button id="stPrev" aria-label="이전">‹</button><span id="stLbl"></span><button id="stNext" aria-label="다음">›</button></div>
    </div>
    <button class="pill" id="pToggle" aria-expanded="false">기간 직접 선택 ▾</button>
  </div>
  <div class="pick2" id="pick2" hidden>
    <span class="k">기간</span>
    <button class="pill" id="pAll">전체</button>
    <label class="pill" id="py"><select id="inY"></select></label>
    <label class="pill" id="pm"><select id="inM"></select></label>
    <label class="pill" id="pk"><select id="inK"></select></label>
    <label class="pill" id="pd"><select id="inD"></select></label>
  </div>

  <section class="hero">
    <div class="now" id="now"></div>
    <div class="scatter">
      <h3>쾌적 구간</h3>
      <p id="scCap"></p>
      <div id="scatter"></div>
      <div id="rates"></div>
    </div>
  </section>

  <nav class="secnav" id="secTabs">
    <button data-p="trend">추이</button><button data-p="heat">히트맵</button><button data-p="agg">구간 집계</button><button data-p="day">하루 패턴</button>
  </nav>

  <div class="panel" id="p-trend">
    <div class="sec-h">
      <p class="cap" id="trendCap"></p>
      <div class="legend"><span><i style="background:var(--t)"></i>온도</span><span><i style="background:var(--h)"></i>습도</span><span><i style="background:var(--d)"></i>이슬점</span><span id="lgBand"><i class="band" style="background:var(--sub)"></i>최소–최대</span><span id="lgDot"><i style="background:none;border:1.5px solid var(--sub);width:7px;height:7px;border-radius:50%"></i>실측</span></div>
    </div>
    <div id="trend"></div>
    <div id="detail" class="detail" style="display:none"></div>
    <div class="strip" id="strip"></div>
  </div>

  <div class="panel" id="p-heat">
    <div class="sec-h">
      <p class="cap" id="hmCap"></p>
      <div class="seg" id="hmSeg"><button data-b="d">일별</button><button data-b="m">월별</button></div>
    </div>
    <h4 class="hh">온도</h4>
    <div id="heatT"></div>
    <h4 class="hh" style="margin-top:28px">습도</h4>
    <div id="heatH"></div>
    <h4 class="hh" style="margin-top:28px">이슬점</h4>
    <div id="heatD"></div>
  </div>

  <div class="panel" id="p-agg">
    <div class="sec-h">
      <p class="cap" id="rangeCap"></p>
      <div class="seg" id="unitSeg"><button data-u="d">일별</button><button data-u="w">주별</button><button data-u="m">월별</button></div>
    </div>
    <div class="three">
      <div><h3 id="dailyT">온도</h3><div id="daily"></div></div>
      <div><h3 id="dailyHT">습도</h3><div id="dailyHum"></div></div>
      <div><h3 id="dailyDT">이슬점</h3><div id="dailyDew"></div></div>
    </div>
    <div class="sec-h" style="margin-top:34px">
      <h3 id="tblT">일별 요약</h3>
      <div class="seg" id="tblSeg"><button data-m="temp">온도</button><button data-m="hum">습도</button><button data-m="dew">이슬점</button></div>
    </div>
    <div class="tbw" id="tbl"></div>
  </div>

  <div class="panel" id="p-day">
    <p class="cap">선택한 구간의 시간대별 평균 (서울 시간)</p>
    <div id="hourly"></div>
  </div>

  <footer><span>센서가 보고한 값만 기록합니다 · 선택한 기간의 모든 측정값 기준</span></footer>
</div>
<div id="tip"></div>

<script>
const $ = (s) => document.querySelector(s);
const KST = 9*3600e3, WD = ['일','월','화','수','목','금','토'];
const kstDate = (ms) => new Date(ms+KST).toISOString().slice(0,10);
const addDays = (d, n) => { const x = new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const addMonths = (m, n) => { const [y, mo] = m.split('-').map(Number); return new Date(Date.UTC(y, mo-1+n, 1)).toISOString().slice(0,7); };
const mondayOf = (d) => addDays(d, -((new Date(d+'T00:00:00Z').getUTCDay()+6)%7));
const wd = (d) => WD[new Date(d+'T00:00:00Z').getUTCDay()];
const md2 = (d) => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
const kstMs = (d) => Date.parse(d + 'T00:00:00+09:00');
const periodBounds = (r) => { const v = r.slice(2);
  if(r[0]==='k'){ const [mm, k] = v.split(':'); return [kstMs(kStart(mm,+k)), kstMs(kEnd(mm,+k))]; }

/* ---------- 매끄러운 곡선: 단조 3차 보간(Fritsch–Carlson). 1차 미분이 연속이고 overshoot 없음 ---------- */

// 연속 색 스펙트럼: 값에 따라 색 정지점 사이를 부드럽게 보간한다
const BINS = {
  temp: { u:'°', stops:[[20,'#2f5d9e'],[21.3,'#4f86bd'],[22.6,'#7db3d3'],[23.9,'#a6d3c4'],[25.2,'#c9e2a0'],[26.5,'#f0e27d'],[27.8,'#f7c45f'],[29.1,'#f0974e'],[30.4,'#e2663f'],[31.7,'#c43a3a'],[33,'#8c2340']],
          ticks:[[20,'≤20°'],[23,'23°'],[26,'26°'],[29,'29°'],[33,'33°+']] },
  hum:  { u:'%', stops:[[25,'#b9772f'],[32,'#d9a65b'],[40,'#ecd596'],[47,'#bfe0cf'],[55,'#82c4ad'],[65,'#6aa0d4'],[75,'#3d6bb0']],
          ticks:[[25,'≤25%'],[35,'35%'],[45,'45%'],[55,'55%'],[65,'65%'],[75,'75%+']] },
  dew:  { u:'°', stops:[[8,'#c98f4a'],[11.5,'#bfe0cf'],[14.5,'#82c4ad'],[17,'#f0e27d'],[19.5,'#f0974e'],[22,'#c43a3a']],
          ticks:[[8,'≤8°'],[11,'11°'],[14,'14°'],[17,'17°'],[20,'20°'],[22,'22°+']] },
};
const hex2rgb = (h) => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const rgb2hex = (c) => '#' + c.map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
function specColor(metric, v){
  const st = BINS[metric].stops;
  if(v <= st[0][0]) return st[0][1]; if(v >= st.at(-1)[0]) return st.at(-1)[1];
  for(let i = 1; i < st.length; i++){ if(v <= st[i][0]){ const [a, ca] = st[i-1], [b, cb] = st[i], t = (v-a)/(b-a), A = hex2rgb(ca), B = hex2rgb(cb); return rgb2hex(A.map((x,k) => x + (B[k]-x)*t)); } }
}
function legendHtml(metric){
  const B = BINS[metric], st = B.stops, lo = st[0][0], hi = st.at(-1)[0], pos = v => ((v-lo)/(hi-lo)*100).toFixed(1);
  return `<div class="spec"><div class="specbar" style="background:linear-gradient(90deg,${st.map(([v,c]) => `${c} ${pos(v)}%`).join(',')})"></div><div class="spect">${B.ticks.map(([v,l]) => `<span style="left:${pos(v)}%">${l}</span>`).join('')}</div></div>`;
}
const darkMode = () => matchMedia('(prefers-color-scheme: dark)').matches;
function inkFor(hex){ let c = hex2rgb(hex); const dark = darkMode();
  for(let i=0;i<24;i++){ const L = lum(rgb2hex(c)); if(dark ? L >= .32 : L <= .2) break; c = dark ? c.map(v => v+(255-v)*.1) : c.map(v => v*.9); }
  return rgb2hex(c); }
const colorOf = (metric, v) => { if(v == null) return null; const f = specColor(metric, v); return { fill: f, ink: inkFor(f), label: '' }; };
const lum = (hex) => { const n = parseInt(hex.slice(1),16), c = [n>>16&255, n>>8&255, n&255].map(v => { v/=255; return v<=.03928 ? v/12.92 : ((v+.055)/1.055)**2.4; }); return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
function heat(el, rows, metric){
  if(!rows.length){ el.innerHTML = '<div class="empty">이 기간에는 표시할 기록이 없습니다.</div>'; return; }
  const B = BINS[metric], monthly = rows[0].d.length === 7;
  const days = [...new Set(rows.map(r => r.d))].sort(); const map = {};
  rows.forEach(r => map[r.d+'|'+r.h] = r[metric]);
  const n = days.length, W = Math.max(320, el.clientWidth || 1112), m = {l:34, t:n > 20 ? 26 : 20, b:4}, cw = (W-m.l)/n, ch = 15, H = m.t + 24*ch + m.b, nums = cw >= 26 && n <= 31;
  let g = '';
  for(let h=0;h<24;h+=3) g += `<text x="${m.l-6}" y="${m.t+h*ch+ch/2+4}" text-anchor="end">${h}시</text>`;
  const lblStep = Math.ceil(n/(W < 600 ? 7 : 16));
  days.forEach((d,i) => {
    const x = m.l+i*cw+1;
    if(i%lblStep===0) g += `<text x="${x+(cw-2)/2}" y="11" text-anchor="middle">${monthly ? `${+d.slice(5)}월` : `${+d.slice(8)}`}</text>`;
    for(let h=0;h<24;h++){ const v = map[d+'|'+h], y = m.t+h*ch+1;
      if(v==null){ g += `<rect x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="2" fill="var(--rule)" fill-opacity=".35"/>`; continue; }
      const c = specColor(metric, v);
      g += `<rect data-d="${d}" data-h="${h}" data-v="${v}" x="${x}" y="${y}" width="${cw-2}" height="${ch-2}" rx="2" fill="${c}"/>`;
      if(nums) g += `<text x="${x+(cw-2)/2}" y="${y+(ch-2)/2+4}" text-anchor="middle" style="fill:${lum(c) > .42 ? '#1d1c1a' : '#fff'};font-size:10px;font-weight:600;pointer-events:none">${metric==='temp' ? v.toFixed(0) : Math.round(v)}</text>`; }
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>${legendHtml(metric)}`;
  el.querySelectorAll('rect[data-v]').forEach(r => { const d = r.dataset.d; r.onmousemove = e => showTip(e, `<b>${monthly ? `${+d.slice(5)}월 평균` : `${md2(d)} (${wd(d)})`} ${r.dataset.h}시</b><br>${metric==='hum' ? n0(+r.dataset.v) : n1(+r.dataset.v)}${B.u}`); r.onmouseleave = hideTip; });
}

/* ---------- 일별 범위 ---------- */
const rowLabel = (u, d, long) => u==='d' ? (long ? `${md2(d)} (${wd(d)})` : md2(d))
  : u==='w' ? (() => { const [, m, n] = d.split('-'); return `${+m}월 ${n}주${long ? ` (${kSpan(+n)}일)` : ''}`; })()
  : (long ? `${d.slice(0,4)}년 ${+d.slice(5)}월` : `${+d.slice(5)}월`);
const rowRange = (u, d) => u==='d' ? 'd:'+d : u==='w' ? (() => { const p = d.split('-'); return `k:${p[0]}-${p[1]}:${p[2]}`; })() : 'm:'+d;
const UNITS = { d:['일별','daily',31], w:['주별','weekly',26], m:['월별','monthly',24] };
const MK = { temp: { lo:'tmin', hi:'tmax', alo:'tminavg', ahi:'tmaxavg', av:'temp', fmt:n1, u:'°', pad:1, name:'온도' },
             dew:  { lo:'dmin', hi:'dmax', alo:'dminavg', ahi:'dmaxavg', av:'dew', fmt:n1, u:'°', pad:1, name:'이슬점' },
             hum:  { lo:'hmin', hi:'hmax', alo:'hminavg', ahi:'hmaxavg', av:'hum',  fmt:n0, u:'%', pad:3, name:'습도' } };
const UW = { d:'', w:'주 ', m:'월 ' };
function rangeChart(el, rows, u, M){
  const K = MK[M]; rows = rows.slice(-UNITS[u][2]);
  if(!rows.length){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = 400, H = 250, m = {l:36,r:6,t:16,b:28}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const sc = niceScale(Math.min(...rows.map(r => r[K.lo])) - K.pad/2, Math.max(...rows.map(r => r[K.hi])) + K.pad/2), lo = sc.lo, hi = sc.hi;
  const Y = v => m.t+ih-(v-lo)/(hi-lo)*ih, bw = iw/rows.length; let g = '';
  sc.ticks.forEach(v => { const yy = Y(v); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${tickLabel(v, sc.step)}${K.u}</text>`; });
  const step = Math.ceil(rows.length/6), labels = rows.length <= 14;
  rows.forEach((r,i) => { const x = m.l+i*bw+bw*.2, w = bw*.6, c = colorOf(M, r[K.av]), cx = x+w/2;
    g += `<rect data-i="${i}" x="${x}" y="${Y(r[K.hi])}" width="${w}" height="${Math.max(3,Y(r[K.lo])-Y(r[K.hi]))}" rx="2" fill="${c.fill}" fill-opacity=".3" style="cursor:pointer"/>`;
    if(u !== 'd' && r[K.alo] != null) g += `<rect x="${x+w*.18}" y="${Y(r[K.ahi])}" width="${w*.64}" height="${Math.max(2,Y(r[K.alo])-Y(r[K.ahi]))}" rx="2" fill="${c.fill}" fill-opacity=".85" pointer-events="none"/>`;
    g += `<line x1="${x-2}" x2="${x+w+2}" y1="${Y(r[K.av])}" y2="${Y(r[K.av])}" stroke="${c.ink}" stroke-width="2.5" pointer-events="none"/>`;
    if(labels){ g += `<text x="${cx}" y="${Y(r[K.hi])-4}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${K.fmt(r[K.hi])}</text><text x="${cx}" y="${Y(r[K.lo])+12}" text-anchor="middle" style="font-weight:600;fill:var(--ink)">${K.fmt(r[K.lo])}</text>`; }
    if(i%step===0) g += `<text x="${cx}" y="${H-8}" text-anchor="middle">${rowLabel(u, r.d, false)}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelectorAll('rect[data-i]').forEach(r => { const d = rows[r.dataset.i], w = UW[u];
    r.onmousemove = e => showTip(e, `<b>${rowLabel(u, d.d, true)}</b><br>${w}최고 ${K.fmt(d[K.hi])}${K.u}` + (u !== 'd' && d[K.ahi] != null ? `<br>일 최고 평균 ${K.fmt(d[K.ahi])}${K.u}` : '') + `<br>평균 ${K.fmt(d[K.av])}${K.u}` + (u !== 'd' && d[K.alo] != null ? `<br>일 최저 평균 ${K.fmt(d[K.alo])}${K.u}` : '') + `<br>${w}최저 ${K.fmt(d[K.lo])}${K.u}`);
    r.onmouseleave = hideTip; r.onclick = () => { hideTip(); setRange(rowRange(u, d.d)); }; });
}

/* ---------- 하루 패턴 ---------- */
function hourly(el, rows){
  if(rows.length < 2){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = Math.max(320, el.clientWidth || 1112), H = 240, m = {l:36,r:36,t:8,b:26}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const ext = k => { const v = rows.map(r => r[k]), lo = Math.min(...v), hi = Math.max(...v), p = Math.max((hi-lo)*.25,.3); return niceScale(lo-p, hi+p); };
  const sT = ext('temp'), sH = ext('hum'), tl = sT.lo, th = sT.hi, hl = sH.lo, hh = sH.hi;
  const X = r => m.l + r.h/23*iw, YT = v => m.t+ih-(v-tl)/(th-tl)*ih, YH = v => m.t+ih-(v-hl)/(hh-hl)*ih;
  let g = '';
  sT.ticks.forEach(v => { const yy = YT(v); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${tickLabel(v, sT.step)}°</text>`; });
  sH.ticks.forEach(v => { g += `<text x="${W-m.r+6}" y="${YH(v)+4}">${tickLabel(v, sH.step)}%</text>`; });
  for(let h=0;h<24;h+=6) g += `<text x="${m.l+h/23*iw}" y="${H-8}" text-anchor="middle">${h}시</text>`;
  const L = (k,Y) => smooth(rows.map(r => [X(r), Y(r[k])]));
  g += `<path d="${L('hum',YH)}" fill="none" stroke="var(--h)" stroke-width="1.8"/><path d="${L('temp',YT)}" fill="none" stroke="var(--t)" stroke-width="1.8"/>`;
  g += `<line id="vl" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink)" stroke-opacity=".35" opacity="0"/><rect id="hit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, vl = svg.querySelector('#vl');
  svg.querySelector('#hit').onmousemove = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W;
    let b = rows[0]; for(const q of rows) if(Math.abs(X(q)-px) < Math.abs(X(b)-px)) b = q;
    vl.setAttribute('x1',X(b)); vl.setAttribute('x2',X(b)); vl.setAttribute('opacity',1);
    showTip(e, `<b>${b.h}시</b><br>온도 ${n1(b.temp)}°<br>습도 ${n0(b.hum)}%`); };
  svg.querySelector('#hit').onmouseleave = () => { vl.setAttribute('opacity',0); hideTip(); };
}

/* ---------- 히어로 / 요약 ---------- */
// 쾌적 진입률: 선택 구간에서 쾌적 범위 안에 머문 시간 비율 (사잇값 보간 기준)
function ratesHtml(o, base){
  const d = (k) => !base || base[k] == null || o[k] == null ? '' : (() => { const x = o[k] - base[k]; return Math.abs(x) < .5 ? '– 변화 없음' : `${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(0)}%p`; })();
  const r = (label, k, sub) => `<div class="rate"><span class="k">${label}</span><b>${o[k] == null ? '–' : n0(o[k])}%</b><div class="bar2"><i style="width:${o[k] == null ? 0 : Math.min(100, o[k])}%"></i></div><small>${sub}${d(k) ? '<br>' + d(k) : ''}</small></div>`;
  return `<div class="rates">${r('쾌적 온도 진입률', 'comfort_t', '22.5–28°C')}${r('쾌적 습도 진입률', 'comfort_h', '40–55%')}${r('둘 다 진입률', 'comfort', '온도·습도 동시')}</div>`;
}
function renderNow(cur, ref, st, cmp){
  $('#rates').innerHTML = '';
  const o = st.overall, now = range === '24h';
  const big = (t, h, tl, hl) => { const ct = colorOf('temp', t), ch = colorOf('hum', h); return `<div class="pair">
      <div><div class="num t mono" ${ct ? `style="color:${ct.ink}"` : ''}>${n1(t)}<small>°C</small></div>${ct ? `<i class="sw" style="background:${ct.fill}"></i>` : ''}<div class="lbl"><b>${tl[0]}</b>${tl[1]}</div></div>
      <div><div class="num h mono" ${ch ? `style="color:${ch.ink}"` : ''}>${n0(h)}<small>%</small></div>${ch ? `<i class="sw" style="background:${ch.fill}"></i>` : ''}<div class="lbl"><b>${hl[0]}</b>${hl[1]}</div></div></div>`; };
  const tm = (ts) => !ts ? '' : range[0]==='d' ? hhmm(ts) : when(ts);
  if(now && !cur){ $('#now').innerHTML = big(null,null,['온도',''],['습도','']).replace(/class="num (t|h) mono"/g,'class="num $1 mono" style="color:var(--faint)"') + `<p class="verdict" style="color:var(--sub)">첫 측정값을 기다리고 있습니다. 센서 연결이 끝나면 1분 안에 이곳에 표시됩니다.</p>`; return; }
  if(!now && (o.temp == null)){ $('#now').innerHTML = `<div class="k">${rangeLabel(range)}</div><p class="verdict" style="margin-top:14px;color:var(--sub)">이 기간에는 측정 기록이 없습니다.</p>`; return; }
  const specs = now ? [] : compareSpecs(range), sp = specs[Math.min(cmpIdx, specs.length-1)];
  const base = sp && cmp && cmp.overall && cmp.overall.n > 0 ? cmp.overall : null;
  // 최저·최고·평균을 한 표로 (온도 / 습도 / 이슬점 3행 × 3열)
  const dl = (k, u, dec) => { if(!base || base[k] == null || o[k] == null) return ''; const d = o[k] - base[k];
    return `<div class="dl">${Math.abs(d) < (dec ? .05 : .5) ? '– 변화 없음' : `${d > 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(dec)}${u}`}</div>`; };
  const mc = (M, k, tsk, u, du, dec, fmt) => { const c = colorOf(M, o[k]); return `<div class="mc"><b style="${c ? `color:${c.ink};border-color:${c.fill}` : ''}">${fmt(o[k])}<em>${u}</em></b><small>${tsk ? tm(o[tsk]) : '&nbsp;'}</small>${dl(k, du, dec)}</div>`; };
  const row = (M, label, unit, kmin, kmax, kavg, du, dec, fmt) => `<div class="ml">${label}</div>${mc(M,kmin,kmin+'_ts',unit,du,dec,fmt)}${mc(M,kmax,kmax+'_ts',unit,du,dec,fmt)}${mc(M,kavg,null,unit,du,dec,fmt)}`;
  const matrix = `<div class="mx"><div></div><div class="mh">최저</div><div class="mh">최고</div><div class="mh">평균</div>
      ${row('temp','온도','°C','tmin','tmax','temp','°',1,n1)}${row('hum','습도','%','hmin','hmax','hum','%p',0,n0)}${row('dew','이슬점','°C','dmin','dmax','dew','°',1,n1)}</div>`;
  const fmtW = (ms) => `${md(ms)} ${hhmm(ms)}`;
  const bar = specs.length ? `<div class="cmpbar"><span>비교</span>${specs.length > 1 ? specs.map((x,i) => `<button data-i="${i}" class="${i===Math.min(cmpIdx,specs.length-1)?'on':''}">${x.label}</button>`).join('') : `<b style="color:var(--ink);font-weight:600">${sp.label}</b>`}
      <span>${base ? `${fmtW(sp.from)} – ${fmtW(sp.to)}` : `비교 구간(${fmtW(sp.from)} – ${fmtW(sp.to)})에 기록이 없습니다`}</span></div>` : '';
  if(now){
    const dT = ref && ref.temp != null ? cur.temp - ref.temp : null, dH = ref && ref.hum != null ? cur.hum - ref.hum : null;
    const gap = ref ? fmtGap((cur.ts-ref.ts)/60000) : '';
    const dd = (v,u) => v == null ? '' : `<span class="delta">${Math.abs(v)<.05?'–':(v>0?'▲':'▼')} ${Math.abs(v).toFixed(u==='°'?1:0)}${u}</span>`;
    $('#now').innerHTML = `<div class="k" style="margin-bottom:10px">지금 · ${md(cur.ts)} ${hhmm(cur.ts)} 측정${ref ? ` · 변화는 직전 측정(${gap} 전) 대비` : ''}</div>` + big(cur.temp, cur.hum, ['온도', dd(dT,'°')], ['습도', dd(dH,'%')]) + `
      <p class="verdict">${feel(cur.temp, cur.hum)}</p>
      <div class="k" style="margin-top:22px">최근 24시간</div>${matrix}`;
    $('#rates').innerHTML = ratesHtml(o, null);
    return;
  }
  $('#now').innerHTML = `<div class="k">${rangeLabel(range)} · 구간 통계</div>${bar}${matrix}
    <p class="verdict">구간 평균 기준으로 ${feel(o.temp, o.hum)}</p>`;
  $('#rates').innerHTML = ratesHtml(o, base);
  document.querySelectorAll('.cmpbar button').forEach(bn => bn.onclick = () => { cmpIdx = +bn.dataset.i; load(); });
}

/* ---------- 일/월 요약 표 ---------- */
function table(el, rows, u, M){
  const K = MK[M];
  if(!rows.length){ el.innerHTML = '<div class="empty">이 기간에는 기록이 없습니다.</div>'; return; }
  const lo = Math.min(...rows.map(r => r[K.lo])), hi = Math.max(...rows.map(r => r[K.hi])), w = UW[u], multi = u !== 'd';
  const head = multi ? `<th>${w}최저</th><th>일 최저 평균</th><th>평균</th><th>일 최고 평균</th><th>${w}최고</th>` : `<th>최저</th><th>평균</th><th>최고</th>`;
  // 값마다 히트맵과 같은 색 단계로 칩 표시
  const cell = (v, bold) => { if(v == null) return '<td>–</td>'; const c = colorOf(M, v);
    return `<td><span class="chip${bold ? ' ex' : ''}" style="background:${c.fill}38;color:${c.ink}">${K.fmt(v)}${K.u}</span></td>`; };
  el.innerHTML = `<table class="tb"><thead><tr><th>${u==='d'?'날짜':u==='w'?'주':'월'}</th>${head}</tr></thead><tbody>${
    [...rows].reverse().map(r => `<tr class="go" data-r="${rowRange(u, r.d)}"><td>${rowLabel(u, r.d, true)}</td>${
      multi ? cell(r[K.lo], r[K.lo]===lo) + cell(r[K.alo]) + cell(r[K.av], true) + cell(r[K.ahi]) + cell(r[K.hi], r[K.hi]===hi)
            : cell(r[K.lo], r[K.lo]===lo) + cell(r[K.av], true) + cell(r[K.hi], r[K.hi]===hi)}</tr>`).join('')}</tbody></table>`;
  el.querySelectorAll('tr.go').forEach(tr => tr.onclick = () => setRange(tr.dataset.r));
}

function renderStrip(st){
  const o = st.overall, rl = rangeLabel(range);
  const c = (k,v,s) => `<div><span class="k">${k}</span><b>${v}</b><small>${s}</small></div>`;
  $('#strip').innerHTML = [
    c('온도 변동폭', o.tmax == null ? '–' : (o.tmax-o.tmin).toFixed(1)+'°', `${n1(o.tmin)}° ~ ${n1(o.tmax)}°`),
    c('습도 변동폭', o.hmax == null ? '–' : Math.round(o.hmax-o.hmin)+'%p', `${n0(o.hmin)}% ~ ${n0(o.hmax)}%`),
    c('이슬점 변동폭', o.dmax == null ? '–' : (o.dmax-o.dmin).toFixed(1)+'°', `${n1(o.dmin)}° ~ ${n1(o.dmax)}°`),
    c('온도 편차', o.tstd == null ? '–' : '±'+o.tstd.toFixed(1)+'°', '시간 가중 표준편차'),
    c('습도 편차', o.hstd == null ? '–' : '±'+o.hstd.toFixed(1)+'%p', '시간 가중 표준편차'),
    c('측정 횟수', (o.n||0).toLocaleString(), `${rl} · 실제 보고`),
  ].join('');
}

async function load(){
  try {
    const specs = compareSpecs(range), sp = specs[Math.min(cmpIdx, specs.length-1)];
    const [curR, hist, st, cmp] = await Promise.all([get('/api/current'), get(`/api/history?range=${range}`), get(`/api/stats?range=${range}`), sp ? get(`/api/stats?range=${sp.range}`).catch(() => null) : null]);
    const cur = curR.devices[0] || null;
    cache = { cur, hist, st, cmp }; lastStats = st;
    renderAll();
    // 센서가 실제로 보고한 시각만 표시 (화면을 불러온 시각이 아님)
    const age = cur ? (Date.now()-cur.ts)/60000 : null, f = $('#fresh');
    f.className = 'fresh' + (age == null ? '' : age < 120 ? ' live' : ' stale');
    const ago = age == null ? '' : age < 1 ? '1분 미만 전' : age < 60 ? `${Math.round(age)}분 전` : age < 1440 ? `${Math.floor(age/60)}시간 ${Math.round(age%60)}분 전` : `${Math.floor(age/1440)}일 전`;
    f.lastChild.textContent = cur ? `마지막 측정 ${md(cur.ts)} ${hhmm(cur.ts)} · ${ago}` : '수집 대기 중';
  } catch(e){ $('#fresh').lastChild.textContent = '연결 오류'; }
}
// 서버 호출 없이 캐시로 다시 그리기. 폭을 재야 하는 그래프는 보이는 패널만 그린다.
function renderAll(){
  if(!cache) return;
  const { cur, hist, st, cmp } = cache, now = range === '24h', o = st.overall;
  renderNow(cur, cur && cur.prev, st, cmp);
  $('#scCap').textContent = '초록 = 쾌적 범위 (22.5–28°C · 40–55%) · 큰 점 = ' + (now ? '현재' : '구간 평균');
  scatter($('#scatter'), hist.points, now ? cur : (o.temp == null ? null : {temp:o.temp, hum:o.hum}), hist.marks);
  if(panel === 'trend'){
    $('#trendCap').textContent = hist.points.length ? `${rangeLabel(range)} · 실측 ${hist.samples.toLocaleString()}회` : '';
    trend($('#trend'), hist.points, hist.marks);
    const dense = !(hist.marks && hist.marks.length); $('#lgBand').style.display = dense ? '' : 'none'; $('#lgDot').style.display = dense ? 'none' : '';
    renderStrip(st);
  }
  if(panel === 'agg'){
    const u = unit || (range === 'all' || range[0] === 'y' ? 'm' : 'd'), rows = st[UNITS[u][1]];
    document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
    document.querySelectorAll('#tblSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === tblMetric));
    $('#dailyT').textContent = '온도'; $('#dailyHT').textContent = '습도'; $('#dailyDT').textContent = '이슬점';
    $('#rangeCap').textContent = (u === 'd' ? '연한 막대 = 하루 최저~최고 · 가로선 = 평균' : `연한 막대 = ${UW[u]}최저~최고 · 진한 막대 = 일 최저~최고 평균 · 가로선 = 평균`) + ' · 누르면 해당 기간으로 이동';
    rangeChart($('#daily'), rows, u, 'temp'); rangeChart($('#dailyHum'), rows, u, 'hum'); rangeChart($('#dailyDew'), rows, u, 'dew');
    $('#tblT').textContent = UNITS[u][0] + ' 요약';
    table($('#tbl'), rows, u, tblMetric);
  }
  if(panel === 'day') hourly($('#hourly'), st.hourly);
  if(panel === 'heat') drawHeat();
}
function showPanel(name){
  panel = name; try { localStorage.panel = name; } catch {}
  document.querySelectorAll('.panel').forEach(el => el.classList.toggle('on', el.id === 'p-' + name));
  document.querySelectorAll('#secTabs button').forEach(b => b.classList.toggle('on', b.dataset.p === name));
  renderAll();
}
const drawHeat = () => { heat($('#heatT'), heatData, 'temp'); heat($('#heatH'), heatData, 'hum'); heat($('#heatD'), heatData, 'dew'); };
const heatUnit = () => heatBy || (range === 'all' || range[0] === 'y' ? 'm' : 'd');
async function loadHeat(){
  const by = heatUnit();
  document.querySelectorAll('#hmSeg button').forEach(b => b.classList.toggle('on', b.dataset.b === by));
  $('#hmCap').textContent = (range === '24h' ? '최근 14일' : rangeLabel(range)) + (by === 'm' ? ' · 월별 평균 (월 × 시간)' : ' · 일별 (날짜 × 시간)' + (range === 'all' || range[0] === 'y' ? ', 최근 62일' : ''));
  try { heatData = await get(`/api/heatmap?range=${range}&by=${by}`); } catch { heatData = []; }
  if(panel === 'heat') drawHeat();
}

function setRange(r){ range = r; cmpIdx = 0; selTs = null; $('#detail').style.display = 'none'; try{localStorage.range = r}catch{} syncPick(); load(); loadHeat(); }
function derive(r){ const o = {y:'', m:'', k:'', d:''}, v = r.slice(2);
  if(r[0]==='y') o.y = v;
  else if(r[0]==='m'){ o.y = v.slice(0,4); o.m = v; }
  else if(r[0]==='k'){ const [mm, n] = v.split(':'); o.y = mm.slice(0,4); o.m = mm; o.k = n; }
  else if(r[0]==='d'){ o.y = v.slice(0,4); o.m = v.slice(0,7); o.k = String(wkOfDay(v)); o.d = v; }
  return o; }
function fillPickers(){
  const sel = derive(range), today = kstDate(Date.now()), first = dataFirst || today, last = dataLast || today;
  const opt = (arr, ph, val) => `<option value="">${ph}</option>` + arr.map(([v, l]) => `<option value="${v}"${String(v) === val ? ' selected' : ''}>${l}</option>`).join('');
  const ys = []; for(let y = +last.slice(0,4); y >= +first.slice(0,4); y--) ys.push([y, `${y}년`]);
  const ms = []; if(sel.y) for(let i = 12; i >= 1; i--){ const m = `${sel.y}-${String(i).padStart(2,'0')}`; if(m >= first.slice(0,7) && m <= last.slice(0,7)) ms.push([m, `${i}월`]); }
  const ks = []; if(sel.m) for(let n = 1; n <= 4; n++) if(kStart(sel.m, n) <= last && kEnd(sel.m, n) > first) ks.push([n, `${n}주 (${kSpan(n)}일)`]);
  const ds = []; if(sel.m){ const n = +sel.k; const from = n ? kStart(sel.m, n) : sel.m+'-01', to = n ? kEnd(sel.m, n) : addMonths(sel.m,1)+'-01';
    for(let d = from; d < to; d = addDays(d, 1)) if(d >= first && d <= last) ds.push([d, `${+d.slice(8)}일 (${wd(d)})`]); }
  $('#inY').innerHTML = opt(ys, '연도', sel.y); $('#inM').innerHTML = opt(ms, '월', sel.m); $('#inK').innerHTML = opt(ks, '주', sel.k); $('#inD').innerHTML = opt(ds, '일', sel.d);
  $('#pm').classList.toggle('dis', !sel.y); $('#pk').classList.toggle('dis', !sel.m); $('#pd').classList.toggle('dis', !sel.m);
  [['y','#py'],['m','#pm'],['k','#pk'],['d','#pd']].forEach(([k, id]) => $(id).classList.toggle('on', !!sel[k]));
  $('#pAll').classList.toggle('on', range === 'all');
}
function syncPick(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', tabRange(b.dataset.k) === range));
  fillPickers();
  const st = $('#step'); st.style.display = canStep(range) ? '' : 'none';
  if(canStep(range)){ $('#stLbl').textContent = rangeLabel(range); $('#stNext').disabled = isFutureStart(shiftRange(range, 1)); }
}
$('#tabs').innerHTML = TABS.filter(t => t[0] !== 'all').map(([k,l]) => `<button data-k="${k}">${l}</button>`).join('');
$('#tabs').onclick = e => { const k = e.target.dataset.k; if(k) setRange(tabRange(k)); };
$('#stPrev').onclick = () => setRange(shiftRange(range, -1));
$('#stNext').onclick = () => { const n = shiftRange(range, 1); if(!isFutureStart(n)) setRange(n); };
$('#pAll').onclick = () => setRange('all');
$('#inY').onchange = e => setRange(e.target.value ? 'y:'+e.target.value : 'all');
$('#inM').onchange = e => setRange(e.target.value ? 'm:'+e.target.value : 'y:'+derive(range).y);
$('#inK').onchange = e => { const m = derive(range).m; setRange(e.target.value ? `k:${m}:${e.target.value}` : 'm:'+m); };
$('#inD').onchange = e => { const o = derive(range); setRange(e.target.value ? 'd:'+e.target.value : (o.k ? `k:${o.m}:${o.k}` : 'm:'+o.m)); };
$('#hmSeg').onclick = e => { const bb = e.target.dataset.b; if(!bb) return; heatBy = bb; loadHeat(); };
$('#unitSeg').onclick = e => { const u = e.target.dataset.u; if(!u) return; unit = u; renderAll(); };
$('#tblSeg').onclick = e => { const m = e.target.dataset.m; if(!m) return; tblMetric = m; renderAll(); };
$('#secTabs').onclick = e => { const pn = e.target.dataset.p; if(pn) showPanel(pn); };
$('#pToggle').onclick = () => { const h = $('#pick2').hidden; $('#pick2').hidden = !h; $('#pToggle').setAttribute('aria-expanded', String(h)); $('#pToggle').textContent = h ? '기간 직접 선택 ▴' : '기간 직접 선택 ▾'; };
(async () => { try { const b = await get('/api/bounds'); if(b.first){ dataFirst = kstDate(b.first); dataLast = kstDate(Math.max(b.last, Date.now())); } } catch {} syncPick(); })();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderAll, 200); });
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
showPanel(panel); load(); loadHeat(); setInterval(load, 30000); setInterval(loadHeat, 300000);
</script>
</body>
</html>
