<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orion Room — 온습도</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/icon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#F6F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="온습도">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ==========================================================================
   Orion Room — playcounters와 같은 디자인 언어
   글꼴은 Pretendard 하나. 숫자·제목은 크고 굵고 촘촘하게, 나머지는 작고 조용하게.
   화면 틀은 무채색(먹색 글씨, 종이색 배경, 헤어라인). 색은 데이터(온도·습도·이슬점·계절)에만 쓴다.
   ========================================================================== */
:root{
  --bg:#F6F6F4; --panel:#FFFFFF; --sunk:#EDEDEA; --sunk-2:#E4E4E0;
  --ink:#0C0C0D; --sub:#5B5B61; --faint:#8F8F96;
  --rule:rgba(12,12,13,.10); --hair:rgba(12,12,13,.06);
  --shadow:0 1px 2px rgba(12,12,13,.04), 0 10px 30px -14px rgba(12,12,13,.18);
  --top-bg:rgba(246,246,244,.82);
  --t:#c2410c; --h:#1e6a8c; --ok:#1E9E62;
  --hot:#c43a3a; --cold:#3c78b0; --wet:#2f8f74; --dry:#b9772f;
  --d:#7b5ea7; --d-soft:rgba(123,94,167,.13);
  --t-soft:rgba(194,65,12,.13); --h-soft:rgba(30,106,140,.13); --comfort:rgba(77,124,58,.12); --sw:#3b78c4; --sm:#4d7c3a; --ss:#d9822b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#09090A; --panel:#141416; --sunk:#1E1E21; --sunk-2:#2A2A2E;
  --ink:#F3F3F4; --sub:#A4A4AB; --faint:#6F6F77;
  --rule:rgba(255,255,255,.10); --hair:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 32px -14px rgba(0,0,0,.6);
  --top-bg:rgba(11,11,12,.78);
  --t:#f08a52; --h:#6cb4d6; --ok:#3DD68C;
  --hot:#f0805f; --cold:#7db3d3; --wet:#82c4ad; --dry:#e0b36a;
  --d:#b9a1e6; --d-soft:rgba(185,161,230,.16);
  --t-soft:rgba(240,138,82,.16); --h-soft:rgba(108,180,214,.16); --comfort:rgba(152,194,124,.1); --sw:#7db3d3; --sm:#98c27c; --ss:#f0a65a;
}}
html{color-scheme:light dark;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.005em;font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
::selection{background:var(--ink);color:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px 56px}
.mono{font-variant-numeric:tabular-nums}
.k{font-size:12.5px;font-weight:500;color:var(--sub)}

/* ---------- header: 고정 + 블러 ---------- */
header{position:sticky;top:0;z-index:20;margin:0 -20px;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;height:56px;
  background:var(--top-bg);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid var(--hair)}
.brand{display:inline-flex;align-items:center;gap:9px;font-size:16.5px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.brand img{width:22px;height:22px;border-radius:6px}
.brand span{color:var(--faint);font-weight:500;font-size:13.5px;letter-spacing:-.01em}
.hr{display:flex;align-items:center;gap:4px;min-width:0}
.fresh{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fresh i{width:6px;height:6px;border-radius:50%;background:var(--faint);flex:none}
.fresh.live i{background:var(--ok)}
.fresh.stale i{background:#d99a2b}
.rbtn{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--sunk);white-space:nowrap;transition:background .15s}
.rbtn:hover:not(:disabled){background:var(--sunk-2)}
.rbtn:disabled{color:var(--faint)}

/* ---------- 기간 선택: 세그먼트 + 칩 ---------- */
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px 14px;flex-wrap:wrap;padding:16px 0 0}
.pickL{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.tabs{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--sunk);max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;height:30px;padding:0 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--sub);white-space:nowrap;transition:background .15s,color .15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--hair)}
@media (prefers-color-scheme:dark){.tabs button.on{background:var(--sunk-2)}}
.step{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-variant-numeric:tabular-nums}
.step button{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);font-size:16px;line-height:1;transition:border-color .15s}
.step button:hover:not(:disabled){border-color:var(--faint)}
.step button:disabled{color:var(--faint);background:transparent;border-color:var(--hair);cursor:default}
.step span{min-width:9em;text-align:center;font-weight:650;letter-spacing:-.015em}
.pick2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 0 0}
.pick2 .k{margin-right:4px}
.pick2[hidden]{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--rule);background:var(--panel);font-size:13.5px;font-weight:500;color:var(--ink);white-space:nowrap;cursor:pointer;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--faint)}
.pill select{border:0;background:none;font:inherit;color:inherit;outline:none;cursor:pointer;max-width:9.5em;color-scheme:light dark}
.pill.on{border-color:var(--ink)}
button.pill.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.pill.dis{opacity:.4;pointer-events:none}
#pToggle{color:var(--sub)}

/* ---------- 현재 / 구간 통계 ---------- */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;padding-top:26px;align-items:start}
.now{padding:8px 0 0;min-width:0}
.pair{display:flex;gap:48px;flex-wrap:wrap}
.num{font-size:clamp(64px,9vw,96px);font-weight:800;letter-spacing:-.055em;line-height:.95;display:flex;align-items:flex-start}
.num small{font-size:24px;font-weight:600;letter-spacing:0;color:var(--faint);margin:8px 0 0 4px}
.num.t{color:var(--t)} .num.h{color:var(--h)}
.sw{display:block;height:4px;border-radius:3px;margin-top:12px}
.lbl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--sub)}
.lbl b{color:var(--ink);font-weight:700;font-size:14px}
.delta{font-variant-numeric:tabular-nums}
.verdict{margin-top:22px;font-size:16px;font-weight:600;letter-spacing:-.02em;max-width:34em;word-break:keep-all}
.c-hot{color:var(--hot)}.c-cold{color:var(--cold)}.c-wet{color:var(--wet)}.c-dry{color:var(--dry)}
.chips{display:inline-grid;grid-template-columns:repeat(2,minmax(74px,auto));gap:5px}
.chip2{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;line-height:1.2;border-radius:8px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;background:color-mix(in srgb,currentColor 11%,transparent)}
.chip2 svg{width:13px;height:13px;flex:none;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip2.z{color:var(--faint);font-weight:500;background:var(--sunk)}
.lg{display:inline-flex;align-items:center;gap:4px;margin-left:10px;vertical-align:-2px}.lg svg{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:6px}.lg svg:first-child{margin-left:0}

/* 최저·최고·평균 표: 헤어라인으로만 구획 */
.mx{display:grid;grid-template-columns:auto repeat(3,1fr);margin-top:8px;border-top:1px solid var(--rule)}
.mx>div{padding:12px 14px 12px 0;min-width:0;border-bottom:1px solid var(--hair)}
.mx .mh{font-size:12px;font-weight:500;color:var(--faint);padding:10px 14px 8px 0}
.mx .ml{display:flex;flex-direction:column;justify-content:center;font-size:13.5px;font-weight:650;padding-right:18px;white-space:nowrap}
.mx .ml small{font-weight:400;color:var(--sub);font-size:11px}
.mx .mc b{display:block;font-size:27px;font-weight:750;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;border-bottom:2px solid;padding-bottom:5px}
.mx .mc b em{font-style:normal;font-size:12.5px;font-weight:500;color:var(--faint);margin-left:2px;letter-spacing:0}
.mx .mc small{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.mx .mc .dl{font-size:12px;font-weight:650;margin-top:2px}
.mxh{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.cmpbar{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;margin:14px 0 12px;font-size:12.5px;color:var(--sub)}
.cmpbar button{height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);font-size:12.5px;font-weight:500;color:var(--sub)}
.cmpbar button.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}

/* ---------- 카드 ---------- */
.scatter,.panel.on{background:var(--panel);border:1px solid var(--hair);border-radius:18px}
.scatter{padding:18px 18px 16px;min-width:0}
.scatter h3{font-size:18px;font-weight:750;letter-spacing:-.03em}
.scatter p,.sec p.cap,p.cap{font-size:12.5px;color:var(--sub);margin:3px 0 12px}
.sg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}.sg i{width:10px;height:10px;border-radius:3px;display:inline-block}.sg i.hx{background:repeating-linear-gradient(45deg,transparent 0 2px,color-mix(in srgb,var(--ink) 25%,transparent) 2px 3px);border:1px solid var(--rule)}
#scCap{display:flex;flex-wrap:wrap;gap:4px 0;line-height:1.4}

/* 진입률: 큰 숫자 + 세로 헤어라인 */
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.rates:empty{display:none}
.rate{min-width:0;padding:0 14px;border-left:1px solid var(--rule)}
.rate:first-child{padding-left:0;border-left:none}
.rate b{display:block;font-size:24px;font-weight:750;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums;margin-top:2px}
.rate .bar2{height:3px;border-radius:3px;background:var(--sunk);margin-top:8px;overflow:hidden}
.rate .bar2 i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.rate small{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;font-variant-numeric:tabular-nums}
.rate .k{font-size:12px}

/* ---------- 섹션 탭 (밑줄) ---------- */
.secnav{display:flex;gap:24px;margin-top:44px;border-bottom:1px solid var(--hair);overflow-x:auto;scrollbar-width:none}
.secnav::-webkit-scrollbar{display:none}
.secnav button{position:relative;padding:4px 0 13px;font-size:15px;font-weight:600;letter-spacing:-.015em;color:var(--faint);white-space:nowrap;transition:color .15s}
.secnav button:hover{color:var(--sub)}
.secnav button.on{color:var(--ink)}
.secnav button.on::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.panel{display:none}
.panel.on{display:block;margin-top:16px;padding:18px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px 14px;flex-wrap:wrap;margin-bottom:8px}
.sec-h h3,.three h3{font-size:16px;font-weight:750;letter-spacing:-.02em}
.hh{font-size:15px;font-weight:750;letter-spacing:-.02em;margin:16px 0 6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--sub)}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:8px;opacity:.5}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end;margin-top:12px;font-size:12px;color:var(--sub)}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:14px;height:10px;border-radius:2px;display:inline-block}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:11px;background:var(--sunk)}
.seg button{height:28px;padding:0 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--sub);white-space:nowrap;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08),0 0 0 .5px var(--hair)}
@media (prefers-color-scheme:dark){.seg button.on{background:var(--sunk-2)}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--faint);font-size:11px;font-family:inherit;font-variant-numeric:tabular-nums}
.gl{stroke:var(--hair);stroke-width:1}
.spec{position:relative;margin:16px 0 0 auto;max-width:440px;padding:0 14px}
.specbar{height:8px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--hair)}
.spect{position:relative;height:18px;margin-top:5px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.spect span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.spect span:first-child{transform:none}.spect span:last-child{transform:translateX(-100%)}
.specu{position:absolute;right:0;top:-2px;font-size:11px;color:var(--faint)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}

/* 하단 지표: 큰 숫자 + 세로 헤어라인 */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:22px 0 0;padding-top:16px;border-top:1px solid var(--hair)}
.strip>div{min-width:0;padding:0 14px;border-left:1px solid var(--rule)}
.strip>div:first-child{padding-left:0;border-left:none}
.strip b{display:block;font-size:24px;font-weight:750;letter-spacing:-.04em;line-height:1.15;margin:3px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.strip small{display:block;font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .k{font-size:12px}

/* 표 */
table.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.tb th{font-weight:500;font-size:12px;color:var(--faint);text-align:right;padding:8px 10px;border-bottom:1px solid var(--rule)}
table.tb td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--hair)}
table.tb th:first-child,table.tb td:first-child{text-align:left;padding-left:0}
table.tb td.ex{font-weight:700}
table.tb td.t{color:var(--t)} table.tb td.h{color:var(--h)}
.tbw{overflow-x:auto}
.chip{display:inline-block;min-width:3.6em;text-align:center;padding:2px 8px;border-radius:7px;font-weight:600}
.chip.ex{font-weight:800;box-shadow:inset 0 0 0 1.5px currentColor}
.tb tr.go{cursor:pointer} .tb tr.go:hover td{background:var(--sunk)}

/* 점 클릭 카드 */
.detail{margin-top:16px;padding:16px;border-radius:16px;background:var(--sunk)}
.detail .dh{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.detail .dh b{color:var(--ink);font-size:15px}
.detail .dh button{height:30px;padding:0 12px;border-radius:9px;background:var(--panel);font-size:12.5px;font-weight:600;color:var(--ink)}
.detail .pair3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:14px}
.detail .pc{min-width:0}.detail .num{font-size:56px}.detail .lbl{display:flex;flex-direction:column;gap:2px;align-items:flex-start;margin-top:10px}.detail .delta{font-size:13px;font-weight:650}
.detail .verdict{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.tile{padding:14px 16px 12px 0;border-bottom:1px solid var(--hair);min-width:0}
.tile .v{font-size:34px;font-weight:750;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .v em{font-style:normal;font-size:14px;font-weight:500;color:var(--faint);margin-left:2px;letter-spacing:0}
.tile.t .v{color:var(--t)} .tile.h .v{color:var(--h)}
.tile small{display:block;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.tile .dl{margin-top:8px;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .dl i{font-style:normal;font-weight:400;color:var(--faint);margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;padding-top:18px;border-top:1px solid var(--hair)}
.facts div b{display:block;font-size:20px;font-weight:750;margin-top:2px;font-variant-numeric:tabular-nums}
.facts div b em{font-style:normal;font-size:13px;color:var(--faint);font-weight:400;margin-left:2px}
.facts small{display:block;font-size:12px;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:48px}

#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:10px;font-size:12px;line-height:1.5;opacity:0;z-index:30;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.empty{padding:48px 12px;text-align:center;color:var(--sub);font-size:14px}
footer{margin-top:48px;font-size:12px;color:var(--faint);text-align:center;line-height:1.8}



/* ---------- 한 칸 흐름 레이아웃 ---------- */
.mt{display:flex;flex-direction:column}.mt .gauge{margin-top:auto}
.wrap{max-width:1000px}
.hero{display:block;padding-top:22px}
.now{padding:0}
.scatter{margin-top:30px;padding:20px 20px 18px}
.scatter h3{font-size:17px}
.hero .tiles2{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt-dew .mt-v{font-size:clamp(40px,5.2vw,60px)}
.mt-dew .g-band{display:none}
#scCap{gap:4px 0;margin:6px 0 14px}
.sg.crit{color:var(--faint);margin-left:auto;margin-right:0}
.area{pointer-events:none}
.verdict{margin-top:20px}
.subh{margin-top:34px}
@media(max-width:720px){
  .hero .tiles2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mt-dew{grid-column:1 / -1;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"h h" "v g";column-gap:18px;align-items:end}
  .mt-dew .mt-h{grid-area:h}.mt-dew .mt-v{grid-area:v;margin:6px 0 0;font-size:40px}
  .mt-dew .gauge,.mt-dew .g-t{grid-column:2}

/* ========== 다시 다듬은 현재 화면 ========== */
.hero2{position:relative;isolation:isolate;overflow:hidden;padding:22px 24px 22px;border-radius:26px;background:var(--panel);border:1px solid var(--hair)}

.g2-z{position:absolute;top:5px;height:4px;border-radius:2px;background-repeat:no-repeat}

.sp{display:block;width:calc(100% + 32px);height:48px;margin:12px -16px 0}

@media(max-width:720px){

.cs-p{fill:var(--ink)!important;font-size:15px!important;font-weight:750;letter-spacing:-.02em}

/* ---------- 현재 온습도 카드 (다크 기준) ---------- */
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt{position:relative;isolation:isolate;overflow:hidden;min-width:0;padding:18px 18px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--hair)}
.mt::before{content:'';position:absolute;inset:0;z-index:-1;background:radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--c) 30%,transparent) 0%,color-mix(in srgb,var(--c) 8%,transparent) 45%,transparent 75%)}

/* ---------- 최저 · 평균 · 최고 + 범위 막대 ---------- */

/* ==========================================================================
   타이포그래피 중심: 크고 시원한 숫자(좁은 폭 그로테스크), 상자 대신 헤어라인, 무채색
   ========================================================================== */
:root{--disp:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif}
.en{display:block;font-style:normal;font-size:10.5px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.hm-v,.sc-v,.rt,.dl-av{font-family:var(--disp)}
svg text.cs-p{font-family:var(--disp)}

.subh{font-family:var(--disp);font-size:13px!important;font-weight:650;letter-spacing:0;text-transform:uppercase;color:var(--faint);margin:34px 0 0!important}
.scs{gap:0 32px;margin-top:14px}
.sc{padding:16px 0 0;border-radius:0;background:none;border:none;border-top:1px solid var(--rule);overflow:visible}
.sc-h{font-size:14px;color:var(--sub)}
.sc-v{font-size:clamp(40px,4.4vw,52px);font-weight:750;letter-spacing:-.05em;line-height:1;margin-top:10px}
.sc-v small{font-size:16px!important;color:var(--faint)}
.sc-r{margin-top:14px}
.sc .sp{margin:10px 0 0!important;width:100%!important;display:block}

.scatter{background:none!important;border:none!important;border-radius:0!important;padding:0!important;margin-top:46px!important}

svg text.cs-p{fill:var(--ink)!important;font-size:22px!important;font-weight:750;letter-spacing:-.03em}

/* 쾌적 시간: 시계 + 달력 */
.ccs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 28px;margin-top:14px;max-width:760px}
.cc{width:100%;height:auto;display:block}

<script>
const $ = (s) => document.querySelector(s);
const KST = 9*3600e3, WD = ['일','월','화','수','목','금','토'];

const addDays = (d, n) => { const x = new Date(d+'T00:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };

const md2 = (d) => `${+d.slice(5,7)}/${+d.slice(8,10)}`;
const kstMs = (d) => Date.parse(d + 'T00:00:00+09:00');
const periodBounds = (r) => { const v = r.slice(2);
  if(r[0]==='k'){ const [mm, k] = v.split(':'); return [kstMs(kStart(mm,+k)), kstMs(kEnd(mm,+k))]; }
  return r[0]==='d' ? [kstMs(v), kstMs(addDays(v,1))] : r[0]==='w' ? [kstMs(v), kstMs(addDays(v,7))] : r[0]==='m' ? [kstMs(v+'-01'), kstMs(addMonths(v,1)+'-01')] : [kstMs(v+'-01-01'), kstMs((+v+1)+'-01-01')]; };
// 비교 대상 구간. 아직 끝나지 않은 기간(오늘·이번 주 등)은 지난 기간의 같은 경과 시간만큼만 비교한다.
const compareSpecs = (r) => {
  if(!/^[dwmyk]:/.test(r)) return [];
  const [s, e] = periodBounds(r), el = Math.min(Date.now(), e) - s; if(el <= 0) return [];
  const mk = (shifted, label) => { const [ps, pe] = periodBounds(shifted), to = Math.min(pe, ps + el); return {label, range: `r:${ps}:${to}`, from: ps, to}; };
  return r[0]==='d' ? [mk(shiftRange(r,-1),'전날 같은 시간대'), mk('d:'+addDays(r.slice(2),-7),'지난주 같은 요일')]
       : r[0]==='k' ? [mk(shiftRange(r,-1),'이전 주 같은 기간')] : r[0]==='w' ? [mk(shiftRange(r,-1),'지난주 같은 기간')] : r[0]==='m' ? [mk(shiftRange(r,-1),'지난달 같은 기간')] : [mk(shiftRange(r,-1),'작년 같은 기간')];
};
let cmpIdx = 0, heatBy = '', unit = '', tblMetric = 'temp', panel = (() => { try { return localStorage.panel || 'trend'; } catch { return 'trend'; } })(), cache = null, selTs = null, lastStats = null, lastTrend = null, dataFirst = null, dataLast = null;
const wkOfDay = (d) => Math.min(4, Math.floor((+d.slice(8,10)-1)/7)+1);
const kStart = (m, n) => `${m}-${String(1+7*(n-1)).padStart(2,'0')}`;

const kSpan = (n) => n === 4 ? '22~말일' : `${(n-1)*7+1}~${n*7}`;

  if (r === '24h') return '최근 24시간'; if (r === 'all') return '전체 기간'; if (r === '1h') return '최근 1시간'; if (r === '7d') return '최근 7일'; if (r === '30d') return '최근 30일';
  if (r[0]==='d') return `${v.slice(0,4)===thisYear ? '' : v.slice(0,4)+'년 '}${+v.slice(5,7)}월 ${+v.slice(8,10)}일 (${wd(v)})`;

  if (r[0]==='m') return `${v.slice(0,4)}년 ${+v.slice(5,7)}월`;
  return `${v}년`; };
const shiftRange = (r, n) => r[0]==='k' ? (() => { const [mm, k] = r.slice(2).split(':'); let i = +k + n, m = mm; while(i > 4){ i -= 4; m = addMonths(m, 1); } while(i < 1){ i += 4; m = addMonths(m, -1); } return `k:${m}:${i}`; })() : r[0]==='d' ? 'd:'+addDays(r.slice(2), n) : r[0]==='w' ? 'w:'+addDays(r.slice(2), 7*n) : r[0]==='m' ? 'm:'+addMonths(r.slice(2), n) : r[0]==='y' ? 'y:'+(+r.slice(2)+n) : r;
const startOfRange = (r) => r[0]==='k' ? (() => { const [mm, k] = r.slice(2).split(':'); return kStart(mm, +k); })() : r[0]==='m' ? r.slice(2)+'-01' : r[0]==='y' ? r.slice(2)+'-01-01' : r.slice(2);
const canStep = (r) => /^[dwmyk]:/.test(r);
const isFutureStart = (r) => startOfRange(r) > kstDate(Date.now());
let range = (()=>{try{const r = localStorage.range; return /^(24h|all|[dw]:\d{4}-\d{2}-\d{2}|m:\d{4}-\d{2}|k:\d{4}-\d{2}:[1-4]|y:\d{4})$/.test(r) ? r : null}catch{return null}})() || '24h', heatData = [];
const n1 = (v) => v == null ? '–' : v.toFixed(1);
const n0 = (v) => v == null ? '–' : Math.round(v);
const hhmm = (ts) => new Date(ts).toLocaleTimeString('ko',{hour:'2-digit',minute:'2-digit',hour12:false});
const md = (ts) => { const d = new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; };
const mdLong = (ts) => { const d = new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; };
const when = (ts) => ts ? `${md(ts)} ${hhmm(ts)}` : '';
const tip = $('#tip');
const showTip = (e, h) => { if(matchMedia('(hover: none)').matches) return; tip.innerHTML = h; tip.style.opacity = 1; const w = tip.offsetWidth; tip.style.left = Math.min(e.clientX + 14, innerWidth - w - 8) + 'px'; tip.style.top = e.clientY + 16 + 'px'; };
const hideTip = () => tip.style.opacity = 0;
const get = (u) => fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

const fmtGap = (min) => min < 60 ? `${Math.max(1,Math.round(min))}분` : min < 1440 ? `${Math.floor(min/60)}시간${Math.round(min%60) ? ' ' + Math.round(min%60) + '분' : ''}` : `${(min/1440).toFixed(1)}일`;
const dew = (t, h) => { const g = Math.log(Math.max(h,1)/100) + 17.62*t/(243.12+t); return 243.12*g/(17.62-g); };
// 온도·습도를 단계별 표현으로 (쾌적 범위 안에서도 '살짝 따뜻한 편', '매우 적절' 등으로 구분)
// 가변최적기온제도 (한국 시간 기준 월): 12~2월 23–25°C·습도 40% 이상 / 3~5·9~11월 26–28°C·40–55% / 6~8월 27–29°C·50% 이하
function comfortAt(ts){
  const m = new Date((ts || Date.now()) + 9*36e5).getUTCMonth() + 1;
  if(m === 12 || m <= 2) return { m, key:'w', season:'겨울', t:[23,25], h:[40,100], hTxt:'40% 이상' };
  if(m >= 6 && m <= 8)   return { m, key:'s', season:'여름', t:[27,29], h:[0,50],   hTxt:'50% 이하' };
  return { m, key:'m', season: m <= 5 ? '봄' : '가을', t:[26,28], h:[40,55], hTxt:'40–55%' };
}
const comfortTxt = (c) => `${c.t[0]}–${c.t[1]}°C · ${c.hTxt}`;
const inComfort = (c, t, h) => ({ t: t >= c.t[0] && t <= c.t[1], h: h >= c.h[0] && h <= c.h[1] });
let CTX = comfortAt(Date.now()), MULTI = false, SEASONS = ['m'];
const SEASON_BOX = { w:{ name:'겨울 12~2월', t:[23,25], h:[40,100] }, m:{ name:'봄·가을 3~5·9~11월', t:[26,28], h:[40,55] }, s:{ name:'여름 6~8월', t:[27,29], h:[0,50] } };
// 조회 구간에 걸친 계절 (올해·전체는 사계절 모두)
function seasonsFor(rangeKey, pts, cur){
  if(rangeKey === 'all' || rangeKey[0] === 'y') return ['w','m','s'];
  const a = pts.length ? pts[0].ts : (cur ? cur.ts : Date.now()), b = pts.length ? pts.at(-1).ts : a, out = new Set();
  const d0 = new Date(a + 9*36e5), d1 = new Date(b + 9*36e5);
  for(let y = d0.getUTCFullYear(), mo = d0.getUTCMonth(); y < d1.getUTCFullYear() || (y === d1.getUTCFullYear() && mo <= d1.getUTCMonth()); mo++){ if(mo > 11){ mo = 0; y++; if(y > d1.getUTCFullYear()) break; } out.add(comfortAt(Date.UTC(y, mo, 15)).key); }
  return ['w','m','s'].filter(k => out.has(k));

// 쾌적 범위를 기준으로 상대적인 단계 표현 (범위 안에서도 '살짝 따뜻한 편', '매우 적절' 등으로 구분)
function tempWord(t, c = CTX){
  const [lo, hi] = c.t, w = hi - lo;

    [hi-.27*w,'매우 적절하고','매우 적절합니다','매우 적절'],[hi+1e-9,'살짝 따뜻한 편이고','살짝 따뜻한 편입니다','살짝 따뜻한 편'],[hi+2,'따뜻하고','따뜻합니다','따뜻함'],[hi+4,'덥고','덥습니다','더움'],[Infinity,'매우 덥고','매우 덥습니다','매우 더움']];
  return S.find(x => t < x[0]);

function humWord(h, c = CTX){
  const [lo, hi] = c.h;

function niceScale(a, b){
  const span = Math.max(b - a, .5);
  const step = [0.5,1,2,5,10,20,50,100].find(x => span / x <= 5) || 100;
  let lo = Math.floor(a/step + 1e-9)*step, hi = Math.ceil(b/step - 1e-9)*step; if(hi - lo < step) hi = lo + step;
  const ticks = []; for(let v = lo; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));

/* ---------- 매끄러운 곡선: 단조 3차 보간(Fritsch–Carlson). 1차 미분이 연속이고 overshoot 없음 ---------- */
function smooth(pts, move = true){
  const n = pts.length; if(n === 0) return '';
  const f = v => v.toFixed(1);
  let d = (move ? 'M' : 'L') + f(pts[0][0]) + ',' + f(pts[0][1]);
  if(n === 1) return d;
  if(n === 2) return d + 'L' + f(pts[1][0]) + ',' + f(pts[1][1]);
  const h = [], sl = [];
  for(let i = 0; i < n-1; i++){ h[i] = pts[i+1][0]-pts[i][0]; sl[i] = h[i] ? (pts[i+1][1]-pts[i][1])/h[i] : 0; }
  const m = new Array(n);
  m[0] = sl[0]; m[n-1] = sl[n-2];
  for(let i = 1; i < n-1; i++) m[i] = sl[i-1]*sl[i] <= 0 ? 0 : 2/(1/sl[i-1] + 1/sl[i]);
  for(let i = 0; i < n-1; i++){
    if(sl[i] === 0){ m[i] = 0; m[i+1] = 0; continue; }
    const a = m[i]/sl[i], b = m[i+1]/sl[i], r = a*a + b*b;
    if(r > 9){ const t = 3/Math.sqrt(r); m[i] = t*a*sl[i]; m[i+1] = t*b*sl[i]; }
  }
  for(let i = 0; i < n-1; i++){
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i+1][0], y1 = pts[i+1][1];
    d += `C${f(x0+h[i]/3)},${f(y0+m[i]*h[i]/3)} ${f(x1-h[i]/3)},${f(y1-m[i+1]*h[i]/3)} ${f(x1)},${f(y1)}`;
  }
  return d;
}

/* ---------- 값에 따른 색 그라데이션 (선·막대 공통) ---------- */

/* ---------- 쾌적 시간: 시간축 위에 값의 색 띠 + 쾌적 범위 안 구간 표시 ---------- */

/* ---------- 쾌적 시간: 24시간 시계(시각별 쾌적 비율) + 날짜 달력 ---------- */
let ccOpen = false; try { ccOpen = localStorage.getItem('ccOpen') === '1'; } catch {}
let ccArgs = null, ccFlag = false;
function comfortClock(el, pts, o, base){
  ccArgs = [el, pts, o, base];
  const tg = $('#ccTog'); if(tg){ tg.setAttribute('aria-expanded', ccOpen); tg.firstChild.textContent = ccOpen ? '간단히' : '자세히'; }
  const P = pts.filter(p => p.temp != null && p.hum != null);

  const ok = (M, p) => { const c = comfortAt(p.ts), r = M === 'temp' ? c.t : c.h; return p[M] >= r[0] && p[M] <= r[1]; };
  const test = { temp: p => ok('temp', p), hum: p => ok('hum', p), both: p => ok('temp', p) && ok('hum', p) };

    for(const k in test){ const v = test[k](p) ? 1 : 0; H[k][h][0] += v; H[k][h][1]++; D[d][k][0] += v; D[d][k][1]++; } });
  const nowH = hr(Date.now()), live = Date.now() - P.at(-1).ts < 3*36e5;
  const arc = (cx, cy, r0, r1, a0, a1) => { const p = (r, a) => [cx + r*Math.sin(a), cy - r*Math.cos(a)], [x0,y0] = p(r1,a0), [x1,y1] = p(r1,a1), [x2,y2] = p(r0,a1), [x3,y3] = p(r0,a0);
    return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r1},${r1} 0 0 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r0},${r0} 0 0 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`; };

    for(let h = 0; h < 24; h++){ const [a, n] = H[k][h], a0 = h/24*2*Math.PI + gap, a1 = (h+1)/24*2*Math.PI - gap, sh = n ? a/n : null;

    const v = o && o[rk] != null ? Math.round(o[rk]) : null, d = base && base[rk] != null && v != null ? o[rk] - base[rk] : null;

    el.firstElementChild && el.querySelectorAll('.ccs > *, .cal').forEach((n, i) => n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: i*30, easing: 'ease-out', fill: 'backwards' })); }
}

/* ---------- scatter: 온도 × 습도 ---------- */
function scatter(el, pts, cur, marks){

    cs.push(`<rect x="${(m.l+i*cw).toFixed(2)}" y="${m.t+h*ch}" width="${(cw+.5).toFixed(2)}" height="${ch+.5}" fill="${specColor(metric, v)}"/>`); } });
  g += `<g clip-path="url(#hmClip)" shape-rendering="crispEdges">${cs.join('')}</g>`;
  // 칸은 붙이되 얇은 격자선으로 구분
  let gl = ''; for(let i = 1; i < n; i++){ const x = (m.l+i*cw).toFixed(2); gl += `M${x},${m.t}V${m.t+ih}`; } for(let h = 1; h < 24; h++){ gl += `M${m.l},${m.t+h*ch}H${W}`; }
  g += `<path d="${gl}" clip-path="url(#hmClip)" class="hm-grid"/><rect x="${m.l+.5}" y="${m.t+.5}" width="${iw-1}" height="${ih-1}" rx="8" fill="none" class="hm-frame"/>`;
  g += `<line id="hmV" y1="${m.t}" y2="${m.t+ih}" stroke="var(--ink)" stroke-opacity=".5" opacity="0"/><line id="hmH" x1="${m.l}" x2="${W}" stroke="var(--ink)" stroke-opacity=".5" opacity="0"/><rect id="hmHit" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>${legendHtml(metric)}`;
  const svg = el.firstChild, hit = svg.querySelector('#hmHit'), vl = svg.querySelector('#hmV'), hl = svg.querySelector('#hmH');
  hit.onmousemove = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W, py = (e.clientY-r.top)/r.height*H;
    const i = Math.max(0, Math.min(n-1, Math.floor((px-m.l)/cw))), h = Math.max(0, Math.min(23, Math.floor((py-m.t)/ch))), d = days[i], v = map[d+'|'+h];
    const x = m.l+i*cw+cw/2, y = m.t+h*ch+ch/2; vl.setAttribute('x1', x); vl.setAttribute('x2', x); hl.setAttribute('y1', y); hl.setAttribute('y2', y); vl.setAttribute('opacity', 1); hl.setAttribute('opacity', 1);
    showTip(e, `<b>${monthly ? `${+d.slice(5)}월 평균` : `${md2(d)} (${wd(d)})`} ${h}시</b><br>${metric === 'out' ? `바깥(${OUT.name}) ` : ''}${v == null ? '기록 없음' : (metric==='hum' ? n0(v) : n1(v)) + B.u}`); };
  hit.onmouseleave = () => { vl.setAttribute('opacity', 0); hl.setAttribute('opacity', 0); hideTip(); };
}

/* ---------- 일별 범위 ---------- */
const rowLabel = (u, d, long) => u==='d' ? (long ? `${md2(d)} (${wd(d)})` : md2(d))
  : u==='w' ? (() => { const [, m, n] = d.split('-'); return `${+m}월 ${n}주${long ? ` (${kSpan(+n)}일)` : ''}`; })()
  : (long ? `${d.slice(0,4)}년 ${+d.slice(5)}월` : `${+d.slice(5)}월`);
const rowRange = (u, d) => u==='d' ? 'd:'+d : u==='w' ? (() => { const p = d.split('-'); return `k:${p[0]}-${p[1]}:${p[2]}`; })() : 'm:'+d;
const UNITS = { d:['일별','daily',31], w:['주별','weekly',26], m:['월별','monthly',24] };
const MK = { temp: { lo:'tmin', hi:'tmax', alo:'tminavg', ahi:'tmaxavg', av:'temp', fmt:n1, u:'°', pad:1, name:'온도' },
             dew:  { lo:'dmin', hi:'dmax', alo:'dminavg', ahi:'dmaxavg', av:'dew', fmt:n1, u:'°', pad:1, name:'이슬점' },
             hum:  { lo:'hmin', hi:'hmax', alo:'hminavg', ahi:'hmaxavg', av:'hum',  fmt:n0, u:'%', pad:3, name:'습도' },
             out:  { lo:'omin', hi:'omax', alo:'ominavg', ahi:'omaxavg', av:'out', fmt:n1, u:'°', pad:1, name:'바깥' } };
const UW = { d:'', w:'주 ', m:'월 ' };
function rangeChart(el, rows, u, M){
  const K = MK[M]; rows = rows.slice(-UNITS[u][2]);
  if(!rows.length){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  const W = Math.max(320, el.clientWidth || 400), H = W < 600 ? 220 : 250, m = {l:40,r:6,t:16,b:28}, iw = W-m.l-m.r, ih = H-m.t-m.b;
  const sc = niceScale(Math.min(...rows.map(r => r[K.lo])) - K.pad/2, Math.max(...rows.map(r => r[K.hi])) + K.pad/2), lo = sc.lo, hi = sc.hi;
  const Y = v => m.t+ih-(v-lo)/(hi-lo)*ih, bw = iw/rows.length; let g = '';
  sc.ticks.forEach(v => { const yy = Y(v); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-6}" y="${yy+4}" text-anchor="end">${tickLabel(v, sc.step)}${K.u}</text>`; });
  const step = Math.ceil(rows.length/(W < 600 ? 6 : 12)), labels = rows.length <= (W < 600 ? 10 : 20);
  rows.forEach((r,i) => { const w = Math.min(bw*.46, 34), x = m.l+i*bw+(bw-w)/2, c = colorOf(M, r[K.av]), cx = x+w/2;
    const ga = vGrad(M, r[K.lo], r[K.hi], Y(r[K.lo]), Y(r[K.hi]), .6), gi = u !== 'd' && r[K.alo] != null ? vGrad(M, r[K.alo], r[K.ahi], Y(r[K.alo]), Y(r[K.ahi])) : null;
    g += `<defs>${ga.def}${gi ? gi.def : ''}</defs>`;
    g += `<rect data-i="${i}" x="${x}" y="${Y(r[K.hi])}" width="${w}" height="${Math.max(4,Y(r[K.lo])-Y(r[K.hi]))}" rx="${Math.min(4, w/2)}" fill="url(#${ga.id})" style="cursor:pointer"/>`;
    if(u !== 'd' && r[K.alo] != null) g += `<rect x="${x+w*.18}" y="${Y(r[K.ahi])}" width="${w*.64}" height="${Math.max(2,Y(r[K.alo])-Y(r[K.ahi]))}" rx="${Math.min(3, w*.32)}" fill="url(#${gi ? gi.id : ''})" pointer-events="none"/>`;
    g += `<line x1="${x-3}" x2="${x+w+3}" y1="${Y(r[K.av])}" y2="${Y(r[K.av])}" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" pointer-events="none"/>`;
    if(labels){ g += `<text x="${cx}" y="${Y(r[K.hi])-4}" text-anchor="middle" style="font-weight:600;fill:var(--sub)">${K.fmt(r[K.hi])}</text><text x="${cx}" y="${Y(r[K.lo])+13}" text-anchor="middle" style="font-weight:600;fill:var(--sub)">${K.fmt(r[K.lo])}</text>`; }
    if(i%step===0) g += `<text x="${cx}" y="${H-8}" text-anchor="middle">${rowLabel(u, r.d, false)}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  el.querySelectorAll('rect[data-i]').forEach(r => { const d = rows[r.dataset.i], w = UW[u];
    r.onmousemove = e => showTip(e, `<b>${rowLabel(u, d.d, true)}</b><br>${w}최고 ${K.fmt(d[K.hi])}${K.u}` + (u !== 'd' && d[K.ahi] != null ? `<br>일 최고 평균 ${K.fmt(d[K.ahi])}${K.u}` : '') + `<br>평균 ${K.fmt(d[K.av])}${K.u}` + (u !== 'd' && d[K.alo] != null ? `<br>일 최저 평균 ${K.fmt(d[K.alo])}${K.u}` : '') + `<br>${w}최저 ${K.fmt(d[K.lo])}${K.u}`);
    r.onmouseleave = hideTip; r.onclick = () => { hideTip(); setRange(rowRange(u, d.d)); }; });
}

/* ---------- 하루 패턴 ---------- */
function hourly(el, rows){
  if(rows.length < 2){ el.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  // 축 하나에 한 지표만: 온도·습도·이슬점을 같은 시간축 위에 위아래로 나눠 그린다
  const W = Math.max(320, el.clientWidth || 1112), m = {l:44,r:8}, iw = W-m.l-m.r;
  const panels = [{k:'temp',c:'var(--t)',y:34,h:120,u:'°',name:'온도'},{k:'hum',c:'var(--h)',y:192,h:100,u:'%',name:'습도'},{k:'dew',c:'var(--d)',y:332,h:90,u:'°',name:'이슬점'},{k:'out',y:472,h:100,u:'°',name:`바깥 기온 · ${OUT.name}`}].filter(P => rows.some(r => r[P.k] != null));
  const last = panels.at(-1), H = last.y + last.h + 28;
  const X = r => m.l + r.h/23*iw;
  let g = '', labs = '';
  panels.forEach(P => {
    const v = rows.map(r => r[P.k]).filter(x => x != null), lo0 = Math.min(...v), hi0 = Math.max(...v), pad = Math.max((hi0-lo0)*.2, .3), sc = niceScale(lo0-pad, hi0+pad);
    P.Y = val => P.y + P.h - (val-sc.lo)/(sc.hi-sc.lo)*P.h;
    sc.ticks.forEach(t => { const yy = P.Y(t); g += `<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end">${tickLabel(t, sc.step)}${P.u}</text>`; });
    const ga = vGrad(P.k, sc.lo, sc.hi, P.Y(sc.lo), P.Y(sc.hi), .38, true); g += `<defs>${ga.def}</defs>`;
    const rr = rows.filter(r => r[P.k] != null), ln = smooth(rr.map(r => [X(r), P.Y(r[P.k])])), yb = P.y + P.h;
    g += `<path d="${ln}L${X(rr.at(-1))},${yb}L${X(rr[0])},${yb}Z" fill="url(#${ga.id})" class="area"/><path d="${ln}" fill="none" stroke="var(--ink)" stroke-opacity=".88" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
    labs += `<g class="plab"><text x="${m.l-36}" y="${P.y-16}">${P.name}</text></g>`;
  });
  for(let h=0;h<24;h+=(W < 600 ? 6 : 3)) g += `<text x="${X({h})}" y="${H-6}" text-anchor="${h===0?'start':'middle'}">${h}시</text>`;
  g += labs + `<g id="cur" opacity="0"><line y1="20" y2="${last.y+last.h}" stroke="var(--ink)" stroke-opacity=".35"/>${panels.map(P => `<circle data-k="${P.k}" r="4.5" stroke="var(--panel)" stroke-width="2"/>`).join('')}</g><rect id="hit" x="${m.l}" y="0" width="${iw}" height="${H-20}" fill="transparent"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
  const svg = el.firstChild, cur = svg.querySelector('#cur');
  svg.querySelector('#hit').onmousemove = e => { const r = svg.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*W;
    let b = rows[0]; for(const q of rows) if(Math.abs(X(q)-px) < Math.abs(X(b)-px)) b = q;
    cur.setAttribute('opacity', 1); cur.firstChild.setAttribute('x1', X(b)); cur.firstChild.setAttribute('x2', X(b));
    panels.forEach(P => { const c = cur.querySelector(`[data-k="${P.k}"]`); if(b[P.k] != null){ c.setAttribute('cx', X(b)); c.setAttribute('cy', P.Y(b[P.k])); c.setAttribute('fill', specColor(P.k, b[P.k])); } });
    showTip(e, `<b>${b.h}시 평균</b><br>온도 ${n1(b.temp)}°<br>습도 ${n0(b.hum)}%` + (b.dew != null ? `<br>이슬점 ${n1(b.dew)}°` : '') + (b.out != null ? `<br>바깥 ${n1(b.out)}° <span style="opacity:.6">(실내 ${b.temp - b.out >= 0 ? '+' : '−'}${n1(Math.abs(b.temp - b.out))}°)</span>` : '')); };
  svg.querySelector('#hit').onmouseleave = () => { cur.setAttribute('opacity', 0); hideTip(); };
}

/* ---------- 히어로 / 요약 ---------- */
// 쾌적 진입률: 선택 구간에서 쾌적 범위 안에 머문 시간 비율 (사잇값 보간 기준)
function ratesHtml(o, base, cz = CTX, multi = false){
  const d = (k) => !base || base[k] == null || o[k] == null ? '' : (() => { const x = o[k] - base[k]; return Math.abs(x) < .5 ? '– 변화 없음' : `${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(0)}%p`; })();
  const r = (label, k, sub) => `<div class="rate"><span class="k">${label}</span><b>${o[k] == null ? '–' : n0(o[k])}%</b><div class="bar2"><i style="width:${o[k] == null ? 0 : Math.min(100, o[k])}%"></i></div><small>${sub}${d(k) ? '<br>' + d(k) : ''}</small></div>`;
  return `<div class="rates">${r('온도 진입률', 'comfort_t', multi ? '계절별 기준' : `${cz.t[0]}–${cz.t[1]}°C`)}${r('습도 진입률', 'comfort_h', multi ? '계절별 기준' : cz.hTxt)}${r('둘 다 진입률', 'comfort', '온도·습도 동시')}</div>`;
}
function renderNow(cur, ref, st, cmp, yd, hist){
  $('#rates').innerHTML = '';
  const o = st.overall, now = range === '24h';
  // 스펙트럼 위치(0~100%)와 그라데이션: 색은 '어디쯤인가'를 보여주는 데만 쓴다
  const SP = (M) => { const st = BINS[M].stops; return { a: st[0][0], b: st.at(-1)[0], grad: `linear-gradient(90deg,${st.map(([v,c]) => `${c} ${((v-st[0][0])/(st.at(-1)[0]-st[0][0])*100).toFixed(1)}%`).join(',')})` }; };
  const pos = (M, v) => { const q = SP(M); return Math.max(0, Math.min(100, (v - q.a) / (q.b - q.a) * 100)); };
  const crange = (M) => M === 'temp' ? CTX.t : M === 'hum' ? CTX.h : null;
  const band = (M) => { const r = crange(M); if(!r) return ''; const l = pos(M, r[0]), w = pos(M, r[1]) - l; return w > 0 ? `<i class="g-band" style="left:${l}%;width:${w}%"></i>` : ''; };
  const gauge = (M, v) => { const q = SP(M), c = colorOf(M, v); return `<div class="gauge"><div class="g-bar"></div>${band(M)}${v == null ? '' : `<i class="g-dot" style="left:${pos(M, v)}%;background:${c.fill}"></i>`}</div><div class="g-t"><span>${q.a}${BINS[M].u}</span><span>${q.b}${BINS[M].u}</span></div>`; };
  // 쾌적 범위까지의 거리 (안이면 '쾌적 범위 안')
  const toComfort = (M, v) => { const r = crange(M); if(!r || v == null) return ''; const u = M === 'temp' ? '°' : '%p', f = M === 'temp' ? (x) => x.toFixed(1) : (x) => Math.round(x);
    const rt = M === 'temp' ? `${r[0]}–${r[1]}°` : CTX.hTxt;
    if(v < r[0]) return `<div class="mt-c"><b>${f(r[0]-v)}${u}</b> 낮음 · 쾌적 ${rt}</div>`;
    if(v > r[1]) return `<div class="mt-c"><b>${f(v-r[1])}${u}</b> 높음 · 쾌적 ${rt}</div>`;
    return `<div class="mt-c in">쾌적 범위 안 · ${rt}</div>`; };
  const word = (M, v) => v == null || M === 'dew' ? '' : M === 'temp' ? tempWord(v)[3] : humWord(v)[3];
  const tile = (M, name, v, fmt, unit, extra) => { const c = colorOf(M, v); return `<div class="mt mt-${M}" style="--c:${c ? c.fill : 'var(--faint)'}">
      <div class="mt-h"><span class="mt-n">${name}</span>${word(M, v) ? `<span class="mt-w">${word(M, v)}</span>` : ''}</div>
      <div class="mt-v">${v == null ? '–' : fmt(v)}<small>${unit}</small></div>${extra || ''}${toComfort(M, v)}${gauge(M, v)}</div>`; };
  const big = (t, h, tl, hl) => `<div class="tiles2">${tile('temp', '온도', t, n1, '°C', tl[1])}${tile('hum', '습도', h, n0, '%', hl[1])}${t == null ? '' : tile('dew', '이슬점', dew(t, h), n1, '°C', '')}</div>`;
  const tm = (ts) => !ts ? '' : range[0]==='d' ? hhmm(ts) : when(ts);
  if(now && !cur){ $('#now').innerHTML = big(null,null,['온도',''],['습도','']) + `<p class="verdict" style="color:var(--sub)">첫 측정값을 기다리고 있습니다. 센서 연결이 끝나면 1분 안에 이곳에 표시됩니다.</p>`; return; }
  if(!now && (o.temp == null)){ $('#now').innerHTML = `<div class="k">${rangeLabel(range)}</div><p class="verdict" style="margin-top:14px;color:var(--sub)">이 기간에는 측정 기록이 없습니다.</p>`; return; }
  const specs = now ? [] : compareSpecs(range), sp = specs[Math.min(cmpIdx, specs.length-1)];
  const base = sp && cmp && cmp.overall && cmp.overall.n > 0 ? cmp.overall : null;
  // 최저·최고·평균을 한 표로 (온도 / 습도 / 이슬점 3행 × 3열)
  const dl = (k, u, dec) => { if(!base || base[k] == null || o[k] == null) return ''; const d = o[k] - base[k];
    const kind = k[0] === 't' ? 'temp' : k[0] === 'h' ? 'hum' : 'dew';
    return Math.abs(d) < (dec ? .05 : .5) ? '<span class="dl">–</span>' : `<span class="dl ${chgCls(kind, d, 0)}">${chgTxt(d, u, dec)}</span>`; };
  // 최저~최고 범위를 같은 스펙트럼 위의 막대로, 평균은 점으로
  const SER = { temp:'var(--t)', hum:'var(--h)', dew:'var(--d)' };
  const rrow = (M, label, kmin, kmax, kavg, u, du, dec, fmt) => {
    if(o[kmin] == null) return '';
    // 막대 눈금: 이 줄의 최저~최고에 맞춰 확대. 쾌적 범위가 화면 안이면 연하게 칠하고, 밖이면 끝에 방향만 표시
    const mh = { temp: .5, hum: 3, dew: .8 }[M], c0 = (o[kmin] + o[kmax]) / 2, half = Math.max((o[kmax] - o[kmin]) / 2 * 1.35, mh), lo = c0 - half, hi = c0 + half;
    const P = (v) => (v - lo) / (hi - lo) * 100, l = P(o[kmin]), w = Math.max(P(o[kmax]) - l, 1.2), av = P(o[kavg]);
    const cr = crange(M); let zone = '';
    if(cr){ const a = Math.max(0, P(cr[0])), b = Math.min(100, P(Math.min(cr[1], 100)));
      if(b > a) zone = `<i class="rr-zone" style="left:${a}%;width:${b-a}%"></i>`;
      else zone = `<span class="rr-out ${P(cr[0]) >= 100 ? 'r' : 'l'}">${P(cr[0]) >= 100 ? '' : '‹ '}쾌적 ${M === 'temp' ? `${cr[0]}–${cr[1]}°` : CTX.hTxt}${P(cr[0]) >= 100 ? ' ›' : ''}</span>`; }
    return `<div class="rr">
      <div class="rr-l">${label}</div>
      <div class="rr-n"><b>${fmt(o[kmin])}<em>${u}</em></b><small>${tm(o[kmin+'_ts'])}</small>${dl(kmin, du, dec)}</div>
      <div class="rr-n c"><b>${fmt(o[kavg])}<em>${u}</em></b><small>&nbsp;</small>${dl(kavg, du, dec)}</div>
      <div class="rr-n r"><b>${fmt(o[kmax])}<em>${u}</em></b><small>${tm(o[kmax+'_ts'])}</small>${dl(kmax, du, dec)}</div>
      <div class="rr-track">${zone}<div class="rr-base"></div><div class="rr-seg" style="left:${l}%;width:${w}%;background:linear-gradient(90deg,${specColor(M, o[kmin])},${specColor(M, o[kmax])})"></div><i class="rr-tick" style="left:${av}%"></i></div></div>`; };
  const matrix = `<div class="rrs"><div class="rr rr-h"><div></div><div>최저</div><div class="c">평균</div><div class="r">최고</div></div>${rrow('temp','온도','tmin','tmax','temp','°','°',1,n1)}${rrow('hum','습도','hmin','hmax','hum','%','%p',0,n0)}${rrow('dew','이슬점','dmin','dmax','dew','°','°',1,n1)}</div>`;
  const fmtW = (ms) => md(ms);
  const bar = specs.length ? `<div class="cmpbar"><span>비교</span>${specs.length > 1 ? specs.map((x,i) => `<button data-i="${i}" class="${i===Math.min(cmpIdx,specs.length-1)?'on':''}">${x.label}</button>`).join('') : `<b style="color:var(--ink);font-weight:600">${sp.label}</b>`}
      <span>${base ? `${fmtW(sp.from)} – ${fmtW(sp.to)}` : `${fmtW(sp.from)} – ${fmtW(sp.to)} · 비교할 기록 없음`}</span></div>` : '';
  const pts = (hist && hist.points) || [];
  // 같은 기간 바깥 평균과 실내와의 차이

// 바깥 날씨 (Open-Meteo, 키 불필요). 위치 기본값: 서울
const OUT = { lat: 37.5665, lon: 126.978, name: '서울' };
const outMemo = {};
async function omGet(url){ if(outMemo[url]) return outMemo[url]; const r = await fetch(url); if(!r.ok) throw new Error('om ' + r.status); return (outMemo[url] = r.json()); }
const omSeries = (j) => { const h = j && j.hourly; if(!h) return []; return h.time.map((t, i) => ({ ts: Date.parse(t + ':00+09:00'), temp: h.temperature_2m[i], hum: h.relative_humidity_2m[i] })).filter(p => p.temp != null && p.hum != null); };
async function outdoorRange(t0, t1){
  const q = `latitude=${OUT.lat}&longitude=${OUT.lon}&hourly=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul`;

  if(d0 < cut) parts.push(omGet(`https://archive-api.open-meteo.com/v1/archive?${q}&start_date=${d0}&end_date=${d1 < cut ? d1 : addDays(cut, -1)}`));
  if(d1 >= cut) parts.push(omGet(`https://api.open-meteo.com/v1/forecast?${q}&start_date=${d0 > cut ? d0 : cut}&end_date=${d1}`));
  const all = (await Promise.all(parts.map(x => x.catch(() => null)))).flatMap(omSeries).sort((a, b) => a.ts - b.ts);
  return all.filter(p => p.ts <= Date.now() + 36e5);
}
async function outdoorNow(){ const j = await omGet(`https://api.open-meteo.com/v1/forecast?latitude=${OUT.lat}&longitude=${OUT.lon}&current=temperature_2m,relative_humidity_2m&timezone=Asia%2FSeoul&_=${Math.floor(Date.now()/6e5)}`);
  return j && j.current ? { ts: Date.parse(j.current.time + ':00+09:00'), temp: j.current.temperature_2m, hum: j.current.relative_humidity_2m } : null; }
// 시계열에서 특정 시각의 값 (선형 보간)
function valAt(S, ts, k){ if(!S || !S.length) return null; let lo = 0, hi = S.length - 1; if(ts <= S[0].ts) return S[0][k]; if(ts >= S[hi].ts) return S[hi][k];
  while(hi - lo > 1){ const m = (lo + hi) >> 1; if(S[m].ts <= ts) lo = m; else hi = m; } const a = S[lo], b = S[hi], f = (ts - a.ts) / (b.ts - a.ts); return a[k] + (b[k] - a[k]) * f; }
// 바깥 자료: 기상청 AWS 강동(1분, 날짜별로 받아 CDN 캐시)을 우선, 빠진 시간은 Open-Meteo(서울, 1시간)로 메운다
const awsMemo = {};
async function pool(tasks, n){ const out = new Array(tasks.length); let i = 0; await Promise.all(Array.from({length: Math.min(n, tasks.length)}, async () => { while(i < tasks.length){ const k = i++; out[k] = await tasks[k](); } })); return out; }
const smooth1 = (S, w) => S.map((p, i) => { const a = S.slice(Math.max(0, i - w), i + w + 1); return { ts: p.ts, temp: a.reduce((x, q) => x + q.temp, 0) / a.length, hum: a.reduce((x, q) => x + q.hum, 0) / a.length }; });
function mergeOut(aws, om){
  if(!aws.length) return om; if(!om.length) return aws;
  const near = (ts) => { let lo = 0, hi = aws.length - 1; while(hi - lo > 1){ const m = (lo + hi) >> 1; if(aws[m].ts <= ts) lo = m; else hi = m; } return Math.min(Math.abs(aws[lo].ts - ts), Math.abs(aws[hi].ts - ts)); };
  return aws.concat(om.filter(q => near(q.ts) > 45*60e3)).sort((x, y) => x.ts - y.ts);
}
async function awsDays(t0, t1){
  const res = t1 - t0 > 2*864e5 ? 10 : 1, days = []; for(let d = kstDate(t0); d <= kstDate(t1); d = addDays(d, 1)) days.push(d);
  const today = kstDate(Date.now());
  const parts = await pool(days.map(d => async () => { const k = d + '|' + res; if(awsMemo[k] && d < today) return awsMemo[k];
    const j = await get(`/api/outdoor?day=${d}&res=${res}`).catch(() => null), S = j && j.series || []; if(S.length) awsMemo[k] = S; return S; }), 6);
  const S = parts.flat().filter(p => p.ts >= t0 - 36e5 && p.ts <= t1 + 36e5).sort((x, y) => x.ts - y.ts);

// onStep: Open-Meteo가 먼저 오면 바로 그리고, AWS가 오면 다시 그린다
async function fetchOutdoor(t0, t1, onStep){

  const awsP = t1 - t0 <= 31*864e5 ? awsDays(t0, t1).catch(() => []) : Promise.resolve([]);
  const om = await omP; if(onStep && om.length) onStep({ series: om, src: '서울' });
  const aws = await awsP, series = mergeOut(aws, om);
  const cover = aws.length ? (aws.at(-1).ts - aws[0].ts) / Math.max(1, t1 - t0) : 0;
  return { series, src: !aws.length ? '서울' : cover > .9 ? '강동' : '강동·서울' };
}
async function loadOut(){

  const P = c.hist.points, t0 = P[0].ts, t1 = P.at(-1).ts;

  D.forEach(r => (G[keyOf(r.d)] = G[keyOf(r.d)] || []).push(r));
  const av = (a, k) => a.reduce((x, r) => x + r[k], 0) / a.length;
  return Object.entries(G).sort().map(([d, a]) => ({ d, omin: Math.min(...a.map(r => r.omin)), omax: Math.max(...a.map(r => r.omax)), out: av(a, 'out'), ominavg: av(a, 'omin'), omaxavg: av(a, 'omax') }));
}
// 하루 패턴용: 시각별 바깥 평균
function outHourly(){
  const S = outIn(); if(!S || !S.length) return null;
  const H = Array.from({length: 24}, () => []); S.forEach(p => H[new Date(p.ts + KST).getUTCHours()].push(p.temp));
  return H.map(v => v.length ? v.reduce((a, b) => a + b, 0) / v.length : null);
}

// 전환 애니메이션: 바뀐 내용을 짧게 겹쳐 보이며 교체, 숫자는 이전 값에서 새 값으로 이어서 변한다
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function fx(...sel){ if(RM()) return; sel.flatMap(x => typeof x === 'string' ? [...document.querySelectorAll(x)] : [x]).filter(Boolean).forEach(el =>
  el.animate([{ opacity: .4 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' })); }
const NUMSEL = '.hm-v, .sc-v';
function numSnap(){ const m = {}; document.querySelectorAll(NUMSEL).forEach((el, i) => { const n = el.firstChild; if(n && n.nodeType === 3) m[el.className + i] = parseFloat(n.textContent); }); return m; }
function numTween(prev){ if(RM()) return; const ease = t => 1 - Math.pow(1 - t, 3);
  document.querySelectorAll(NUMSEL).forEach((el, i) => { const n = el.firstChild; if(!n || n.nodeType !== 3) return; const txt = n.textContent, v = parseFloat(txt), a = prev[el.className + i];
    if(!isFinite(v) || !isFinite(a) || a === v) return; const dec = (txt.split('.')[1] || '').length, t0 = performance.now(), dur = 360;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); n.textContent = (a + (v - a) * ease(k)).toFixed(dec); if(k < 1) requestAnimationFrame(step); else n.textContent = txt; };
    n.textContent = a.toFixed(dec); requestAnimationFrame(step); }); }
let ccAnimNext = false;
// 불러오는 동안 멈춘 느낌이 없게: 상단 진행선이 흐르고 기존 내용은 살짝 가라앉아 숨 쉬듯 움직인다
let loadingN = 0;
const busy = (on) => { loadingN = Math.max(0, loadingN + (on ? 1 : -1)); document.body.classList.toggle('loading', loadingN > 0); };
async function load(){
  busy(true);
  try {
    const specs = compareSpecs(range), sp = specs[Math.min(cmpIdx, specs.length-1)];
    const [curR, hist, st, cmp] = await Promise.all([get('/api/current'), get(`/api/history?range=${range}`), get(`/api/stats?range=${range}`), sp ? get(`/api/stats?range=${sp.range}`).catch(() => null) : null]);
    const cur = curR.devices[0] || null;
    let yd = null;
    if(range === '24h' && cur){ try { yd = await get(`/api/point?ts=${cur.ts - 864e5}`); if(yd && Math.abs(yd.ts - (cur.ts - 864e5)) > 6*36e5) yd = null; } catch {} }
    cache = { cur, hist, st, cmp, yd }; lastStats = st;
    const prev = numSnap(), first = !document.querySelector('.hm-v, .sc-v');
    ccAnimNext = true; renderAll(); ccAnimNext = false;
    loadOut();
    if(!first){ numTween(prev); fx('#now .hero2', '#now .scs', '#now .rt', '#now .cmpbar', '.panel.on > :not(.sec-h)'); }
    // 센서가 실제로 보고한 시각만 표시 (화면을 불러온 시각이 아님)
    const age = cur ? (Date.now()-cur.ts)/60000 : null, f = $('#fresh');
    f.className = 'fresh' + (age == null ? '' : age < 120 ? ' live' : ' stale');
    const ago = age == null ? '' : age < 1 ? '1분 미만 전' : age < 60 ? `${Math.round(age)}분 전` : age < 1440 ? `${Math.floor(age/60)}시간 ${Math.round(age%60)}분 전` : `${Math.floor(age/1440)}일 전`;
    f.lastChild.textContent = cur ? (innerWidth < 520 ? `${hhmm(cur.ts)} 측정 · ${ago}` : `마지막 측정 ${md(cur.ts)} ${hhmm(cur.ts)} · ${ago}`) : '수집 대기 중';
    f.title = cur ? `마지막 측정 ${md(cur.ts)} ${hhmm(cur.ts)}` : '';
  } catch(e){ $('#fresh').lastChild.textContent = '연결 오류'; }
  finally { busy(false); }
}
// 서버 호출 없이 캐시로 다시 그리기. 폭을 재야 하는 그래프는 보이는 패널만 그린다.
function renderAll(){
  if(!cache) return;
  const { cur, hist, st, cmp, yd } = cache, now = range === '24h', o = st.overall;
  // 쾌적 범위는 가변최적기온제도에 따라 월별로 다름: 현재는 최신 측정 월, 구간은 구간 끝 월 기준
  const cpts = hist.points, c0 = cpts.length ? comfortAt(cpts[0].ts) : null;
  CTX = comfortAt(now && cur ? cur.ts : (cpts.length ? cpts.at(-1).ts : Date.now()));
  MULTI = !!c0 && (c0.t[0] !== CTX.t[0] || c0.h[0] !== CTX.h[0] || c0.h[1] !== CTX.h[1]);
  SEASONS = seasonsFor(range, cpts, cur);
  MULTI = MULTI || SEASONS.length > 1;
  renderNow(cur, cur && cur.prev, st, cmp, yd, hist);
  const cspec = now ? null : compareSpecs(range)[Math.min(cmpIdx, Math.max(0, compareSpecs(range).length-1))], cbase = cspec && cmp && cmp.overall && cmp.overall.n > 0 ? cmp.overall : null;
  comfortClock($('#scatter'), hist.points, o, cbase);
  $('#scCap').innerHTML = `<span class="sg crit">${MULTI ? '계절별 기준' : `${CTX.season} ${comfortTxt(CTX)}`}</span>`;
  if(panel === 'trend'){
    $('#trendCap').textContent = '';
    trend($('#trend'), hist.points, hist.marks);
    const dense = !(hist.marks && hist.marks.length); $('#lgBand').style.display = dense ? '' : 'none'; $('#lgDot').style.display = dense ? 'none' : '';
    renderStrip(st);
  }
  if(panel === 'agg'){
    const u = unit || (range === 'all' || range[0] === 'y' ? 'm' : 'd'), rows = tblMetric === 'out' ? outRows(u) : st[UNITS[u][1]];
    document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('on', b.dataset.u === u));
    document.querySelectorAll('#tblSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === tblMetric));
    rangeChart($('#rangeT'), rows, u, tblMetric);
    table($('#tbl'), rows, u, tblMetric);
  }
  if(panel === 'day'){ const oh = outHourly(); hourly($('#hourly'), oh ? st.hourly.map(r => ({ ...r, out: oh[r.h] })) : st.hourly); }
  if(panel === 'heat') drawHeat();
}
function showPanel(name){
  panel = name; try { localStorage.panel = name; } catch {}
  document.querySelectorAll('.panel').forEach(el => el.classList.toggle('on', el.id === 'p-' + name));
  document.querySelectorAll('#secTabs button').forEach(b => b.classList.toggle('on', b.dataset.p === name));
  renderAll(); fx('.panel.on');
}
let heatMetric = 'temp';
const drawHeat = () => { document.querySelectorAll('#hmMSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === heatMetric));
  if(heatMetric === 'out'){ if(!heatOut.rows.length){ $('#heatT').innerHTML = '<div class="empty">바깥 기온을 불러오는 중</div>'; loadHeatOut(); return; } heat($('#heatT'), heatOut.rows, 'out'); return; }
  heat($('#heatT'), heatData, heatMetric); };
$('#hmMSeg').onclick = e => { const m = e.target.dataset.m; if(!m) return; heatMetric = m; drawHeat(); fx('#heatT'); };
const heatUnit = () => heatBy || (range === 'all' || range[0] === 'y' ? 'm' : 'd');
async function loadHeat(){
  const by = heatUnit();
  document.querySelectorAll('#hmSeg button').forEach(b => b.classList.toggle('on', b.dataset.b === by));
  $('#hmCap').textContent = (range === '24h' ? '최근 14일' : rangeLabel(range)) + (by === 'm' ? ' · 월 평균' : (range === 'all' || range[0] === 'y' ? ' · 최근 62일' : ''));
  busy(true); try { heatData = await get(`/api/heatmap?range=${range}&by=${by}`); } catch { heatData = []; } finally { busy(false); }
  heatOut = { key: '', rows: [] }; if(heatMetric === 'out') loadHeatOut();
  if(panel === 'heat') drawHeat();
}

function setRange(r){ range = r; cmpIdx = 0; selTs = null; $('#detail').style.display = 'none'; try{localStorage.range = r}catch{} syncPick(); load(); loadHeat(); }
function derive(r){ const o = {y:'', m:'', k:'', d:''}, v = r.slice(2);
  if(r[0]==='y') o.y = v;
  else if(r[0]==='m'){ o.y = v.slice(0,4); o.m = v; }
  else if(r[0]==='k'){ const [mm, n] = v.split(':'); o.y = mm.slice(0,4); o.m = mm; o.k = n; }
  else if(r[0]==='d'){ o.y = v.slice(0,4); o.m = v.slice(0,7); o.k = String(wkOfDay(v)); o.d = v; }
  return o; }
function fillPickers(){
  const sel = derive(range), today = kstDate(Date.now()), first = dataFirst || today, last = dataLast || today;
  const opt = (arr, ph, val) => `<option value="">${ph}</option>` + arr.map(([v, l]) => `<option value="${v}"${String(v) === val ? ' selected' : ''}>${l}</option>`).join('');
  const ys = []; for(let y = +last.slice(0,4); y >= +first.slice(0,4); y--) ys.push([y, `${y}년`]);
  const ms = []; if(sel.y) for(let i = 12; i >= 1; i--){ const m = `${sel.y}-${String(i).padStart(2,'0')}`; if(m >= first.slice(0,7) && m <= last.slice(0,7)) ms.push([m, `${i}월`]); }
  const ks = []; if(sel.m) for(let n = 1; n <= 4; n++) if(kStart(sel.m, n) <= last && kEnd(sel.m, n) > first) ks.push([n, `${n}주 (${kSpan(n)}일)`]);
  const ds = []; if(sel.m){ const n = +sel.k; const from = n ? kStart(sel.m, n) : sel.m+'-01', to = n ? kEnd(sel.m, n) : addMonths(sel.m,1)+'-01';
    for(let d = from; d < to; d = addDays(d, 1)) if(d >= first && d <= last) ds.push([d, `${+d.slice(8)}일 (${wd(d)})`]); }
  $('#inY').innerHTML = opt(ys, '연도', sel.y); $('#inM').innerHTML = opt(ms, '월', sel.m); $('#inK').innerHTML = opt(ks, '주', sel.k); $('#inD').innerHTML = opt(ds, '일', sel.d);
  $('#pm').classList.toggle('dis', !sel.y); $('#pk').classList.toggle('dis', !sel.m); $('#pd').classList.toggle('dis', !sel.m);
  [['y','#py'],['m','#pm'],['k','#pk'],['d','#pd']].forEach(([k, id]) => $(id).classList.toggle('on', !!sel[k]));
  $('#pAll').classList.toggle('on', range === 'all');
}
function syncPick(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', tabRange(b.dataset.k) === range));
  fillPickers();
  const st = $('#step'); st.style.display = canStep(range) ? '' : 'none';
  if(canStep(range)){ $('#stLbl').textContent = rangeLabel(range); $('#stNext').disabled = isFutureStart(shiftRange(range, 1)); }
}
$('#tabs').innerHTML = TABS.filter(t => t[0] !== 'all').map(([k,l]) => `<button data-k="${k}">${l}</button>`).join('');
$('#tabs').onclick = e => { const k = e.target.dataset.k; if(k) setRange(tabRange(k)); };
$('#stPrev').onclick = () => setRange(shiftRange(range, -1));
$('#stNext').onclick = () => { const n = shiftRange(range, 1); if(!isFutureStart(n)) setRange(n); };
$('#pAll').onclick = () => setRange('all');
$('#inY').onchange = e => setRange(e.target.value ? 'y:'+e.target.value : 'all');
$('#inM').onchange = e => setRange(e.target.value ? 'm:'+e.target.value : 'y:'+derive(range).y);
$('#inK').onchange = e => { const m = derive(range).m; setRange(e.target.value ? `k:${m}:${e.target.value}` : 'm:'+m); };
$('#inD').onchange = e => { const o = derive(range); setRange(e.target.value ? 'd:'+e.target.value : (o.k ? `k:${o.m}:${o.k}` : 'm:'+o.m)); };
$('#hmSeg').onclick = e => { const bb = e.target.dataset.b; if(!bb) return; heatBy = bb; loadHeat(); };
$('#unitSeg').onclick = e => { const u = e.target.dataset.u; if(!u) return; unit = u; renderAll(); fx('#rangeT', '#tbl'); };
$('#tblSeg').onclick = e => { const m = e.target.dataset.m; if(!m) return; tblMetric = m; renderAll(); fx('#rangeT', '#tbl'); };
$('#ccTog').onclick = () => { ccOpen = !ccOpen; try { localStorage.setItem('ccOpen', ccOpen ? '1' : '0'); } catch {} if(ccArgs){ const a = ccArgs.slice(0, 4); ccFlag = true; comfortClock(...a); } };
$('#secTabs').onclick = e => { const pn = e.target.dataset.p; if(pn) showPanel(pn); };
$('#pToggle').onclick = () => { const h = $('#pick2').hidden; $('#pick2').hidden = !h; $('#pToggle').setAttribute('aria-expanded', String(h)); $('#pToggle').textContent = h ? '기간 직접 선택 ▴' : '기간 직접 선택 ▾'; };
(async () => { try { const b = await get('/api/bounds'); if(b.first){ dataFirst = kstDate(b.first); dataLast = kstDate(Math.max(b.last, Date.now())); } } catch {} syncPick(); })();
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(renderAll, 200); });
if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
showPanel(panel); load(); loadHeat(); setInterval(load, 30000); setInterval(loadHeat, 300000);
</script>
